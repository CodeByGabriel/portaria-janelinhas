<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sala — Janelinhas do Saber</title>
  <link rel="stylesheet" href="../comum/tokens.css">
  <style>
    .entrada { max-width: 420px; margin: 3.5rem auto; padding: 0 1.15rem; }
    .entrada h2 { font-size: 1.15rem; font-weight: 600; margin: 0 0 0.3rem; }
    .entrada p { color: var(--tinta-media); margin: 0 0 1.4rem; font-size: 0.92rem; }
    .entrada label {
      display: block; font-size: 0.78rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--tinta-fraca); margin-bottom: 0.4rem;
    }
    .entrada select { margin-bottom: 1rem; }
    .palco { padding: 1.15rem; max-width: 900px; margin: 0 auto; }
    .cartao button { width: 100%; }
    .rodape {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 0.5rem 1.15rem; background: var(--superficie);
      border-top: 1px solid var(--borda); display: flex; gap: 1rem; align-items: center;
    }
    .contagem { font-size: 0.82rem; color: var(--tinta-media); margin-left: auto; }
  </style>
</head>
<body>

  <div id="entrada" class="entrada">
    <h2>Tela da sala</h2>
    <p>Escolha a turma. Você será avisado quando o responsável de um aluno chegar no portão.</p>
    <label for="turma">Turma</label>
    <select id="turma"></select>
    <button class="principal larga" id="entrar">Entrar na sala</button>
  </div>

  <div id="app" hidden>
    <header class="cabecalho">
      <span class="marca-glifo" aria-hidden="true"></span>
      <div>
        <p class="titulo">Janelinhas do Saber</p>
        <p class="subtitulo" id="turmaAtual"></p>
      </div>
      <div class="direita">
        <button class="fantasma" id="mudo" aria-pressed="false">Som ligado</button>
      </div>
    </header>

    <p class="faixa" id="faixa" hidden></p>

    <!--
      Aviso de som interrompido.

      Fica FORA da faixa de "N responsáveis chegaram" de propósito: as duas
      podem estar valendo ao mesmo tempo, e é justamente quando as duas valem
      que o aviso importa — tem gente esperando no portão e a sala não ouviu.
      É um botão, não um texto, porque reativar áudio exige gesto do usuário;
      um aviso que só informa deixaria a professora sem o que fazer.
    -->
    <button class="faixa aviso" id="avisoSom" aria-live="polite" hidden></button>

    <main class="palco">
      <p class="vazio" id="vazio">Nenhuma chamada agora.</p>
      <div class="grade" id="grade"></div>
    </main>

    <footer class="rodape">
      <span class="rede" id="rede">ligando…</span>
      <span class="contagem" id="contagem"></span>
    </footer>
  </div>

  <script type="module">
    import { criarCartao } from '../comum/cartao.js'
    import { ligar } from '../comum/ligacao.js'
    import {
      destravar,
      tocarAbertura,
      tocarEntrega,
      alternarMudo,
      estaMudo,
      aoFalharSom,
    } from '../comum/som.js'

    const TURMAS = [
      ['Educação Infantil', ['Pré 1', 'Pré 2']],
      ['Fundamental I', ['1º ano', '2º ano', '3º ano', '4º ano', '5º ano']],
      ['Fundamental II', ['6º ano', '7º ano', '8º ano', '9º ano']],
    ]

    const seletor = document.getElementById('turma')
    for (const [segmento, turmas] of TURMAS) {
      const grupo = document.createElement('optgroup')
      grupo.label = segmento
      for (const t of turmas) {
        const opcao = document.createElement('option')
        opcao.value = t
        opcao.textContent = t
        grupo.append(opcao)
      }
      seletor.append(grupo)
    }
    const daUrl = new URLSearchParams(location.search).get('turma')
    if (daUrl) seletor.value = daUrl

    const botaoMudo = document.getElementById('mudo')
    const rede = document.getElementById('rede')
    const grade = document.getElementById('grade')
    const faixa = document.getElementById('faixa')
    const vazio = document.getElementById('vazio')
    const contagem = document.getElementById('contagem')

    let turma = null
    let conexao = null
    const cartoes = new Map()

    /*
      O rótulo carrega o estado e `aria-pressed` também.

      É redundante de propósito. Trocar o rótulo por um nome fixo ("Silenciar")
      e deixar só o aria-pressed dizer o estado quebraria a 2.5.3 do WCAG para
      quem comanda por voz, que precisa falar o texto que está vendo.
    */
    const avisoSom = document.getElementById('avisoSom')

    function desenharMudo() {
      const mudo = estaMudo()
      botaoMudo.textContent = mudo ? 'Som desligado' : 'Som ligado'
      botaoMudo.setAttribute('aria-pressed', String(mudo))
    }
    desenharMudo()

    /*
      O som pode parar sozinho depois do primeiro gesto — aba em segundo plano,
      ligação, tela bloqueada. Sem isto a sala continuava desenhando o cartão e
      nada mais: a professora só descobria pelo responsável reclamando no portão.
    */
    aoFalharSom((mensagem) => {
      // O texto ANTES de mostrar: uma região aria-live que aparece já com o
      // conteúdo é anunciada; preenchida depois de aparecer, às vezes não.
      if (mensagem) avisoSom.textContent = mensagem
      avisoSom.hidden = !mensagem
    })
    avisoSom.onclick = () => destravar()

    botaoMudo.onclick = () => {
      alternarMudo()
      desenharMudo()
    }

    document.getElementById('entrar').onclick = () => {
      destravar()
      turma = seletor.value
      document.getElementById('entrada').hidden = true
      document.getElementById('app').hidden = false
      document.getElementById('turmaAtual').textContent = turma
      document.title = `${turma} — Janelinhas do Saber`

      conexao = ligar({
        papel: 'sala',
        turma,
        aoEstadoDaRede: (estado) => {
          rede.dataset.rede = estado
          rede.textContent = estado === 'ligado' ? 'conectado' : 'reconectando…'
        },
        aoRetrato: desenhar,
      })
    }

    function desenhar(retrato) {
      const ativas = retrato.chamadas
        .filter((c) => c.estado === 'chamado' || c.estado === 'liberado')
        .sort((a, b) => a.desde - b.desde)

      const presentes = new Set(ativas.map((c) => c.alunoId))
      for (const [id, cartao] of cartoes) {
        if (!presentes.has(id)) {
          cartao.remove()
          cartoes.delete(id)
        }
      }

      for (const chamada of ativas) {
        let cartao = cartoes.get(chamada.alunoId)

        if (!cartao) {
          cartao = criarCartao({ nome: chamada.nome, turma: chamada.turma })
          const botao = document.createElement('button')
          botao.className = 'principal'
          botao.textContent = 'Liberar saída'
          botao.onclick = () =>
            conexao.enviar({ tipo: 'liberar', alunoId: chamada.alunoId })
          cartao.acrescentar(botao)
          cartao.__botao = botao
          cartao.__estado = null
          cartoes.set(chamada.alunoId, cartao)
          grade.append(cartao)
          tocarAbertura()
        }

        if (chamada.estado !== cartao.__estado) {
          cartao.definirEstado(chamada.estado)
          if (chamada.estado === 'liberado') tocarEntrega()
          cartao.__estado = chamada.estado
        }
        cartao.__botao.disabled = chamada.estado === 'liberado'
        cartao.__botao.textContent =
          chamada.estado === 'liberado' ? 'Aguardando no portão' : 'Liberar saída'
      }

      const aguardando = ativas.filter((c) => c.estado === 'chamado').length
      vazio.hidden = ativas.length > 0
      faixa.hidden = aguardando === 0
      faixa.textContent =
        aguardando === 1
          ? 'Responsável chegou. Toque em liberar saída.'
          : `${aguardando} responsáveis chegaram. Toque em liberar saída.`
      contagem.textContent = ativas.length > 0 ? `${ativas.length} em saída` : ''
    }
  </script>
</body>
</html>
