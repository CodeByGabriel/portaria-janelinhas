<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sala — Janelinhas do Saber</title>
  <link rel="stylesheet" href="../comum/tokens.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--papel);
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--tinta);
      display: grid;
      place-items: center;
    }
    .palco { width: min(88vw, 420px); text-align: center; }
    .vazio { color: var(--tinta-suave); font-size: 1.05rem; }
    .fila { color: var(--tinta-suave); font-size: 0.9rem; min-height: 1.4em; margin: 0.8rem 0 0; }
    button {
      font: inherit; padding: 0.7rem 1.2rem; border-radius: 8px;
      border: 2px solid var(--moldura); background: var(--papel);
      color: var(--tinta); cursor: pointer;
    }
    button:hover { background: var(--papel-fundo); }
    .liberar {
      background: var(--moldura); color: #fff; border-color: var(--moldura-escura);
      width: 100%; margin-top: 1.1rem; font-size: 1.05rem; padding: 0.9rem;
    }
    .liberar:hover { background: var(--moldura-escura); }
    .entrar { font-size: 1.15rem; padding: 1rem 2rem; }
    .canto-alto { position: fixed; top: 1rem; right: 1rem; display: flex; gap: 0.5rem; }
    .canto-baixo {
      position: fixed; bottom: 1rem; left: 1rem;
      font-size: 0.82rem; color: var(--tinta-suave);
    }
    .canto-baixo[data-rede="desligado"] { color: var(--aviso); font-weight: 600; }
    .turma-atual { position: fixed; top: 1rem; left: 1rem; color: var(--tinta-suave); font-size: 0.9rem; }
  </style>
</head>
<body>
  <p class="turma-atual" id="turmaAtual"></p>

  <div class="palco" id="palco">
    <button class="entrar" id="entrar">Entrar na sala</button>
  </div>

  <div class="canto-alto"><button id="mudo" hidden>Som ligado</button></div>
  <p class="canto-baixo" id="rede" hidden>ligando…</p>

  <script type="module">
    import { criarJanelinha } from '../comum/janelinha.js'
    import { ligar } from '../comum/ligacao.js'
    import { destravar, tocarAbertura, tocarEntrega, alternarMudo } from '../comum/som.js'

    const turma = new URLSearchParams(location.search).get('turma') ?? 'Jardim II'
    const palco = document.getElementById('palco')
    const rede = document.getElementById('rede')
    const botaoMudo = document.getElementById('mudo')

    document.getElementById('turmaAtual').textContent = turma

    let atual = null
    let ultimoId = null
    let ultimoEstado = null
    let conexao = null

    botaoMudo.onclick = () => {
      botaoMudo.textContent = alternarMudo() ? 'Som desligado' : 'Som ligado'
    }

    document.getElementById('entrar').onclick = () => {
      destravar()
      botaoMudo.hidden = false
      rede.hidden = false
      vazio()
      conexao = ligar({
        papel: 'sala',
        turma,
        aoEstadoDaRede: (estado) => {
          rede.dataset.rede = estado
          rede.textContent = estado === 'ligado' ? 'ligado' : 'religando…'
        },
        aoRetrato: desenhar,
      })
    }

    function vazio() {
      palco.innerHTML = '<p class="vazio">Nenhuma chamada agora.</p>'
      atual = null
      ultimoId = null
      ultimoEstado = null
    }

    function desenhar(retrato) {
      const ativas = retrato.chamadas
        .filter((c) => c.estado === 'chamado' || c.estado === 'liberado')
        .sort((a, b) => a.em - b.em)

      const vez = ativas[0]
      if (!vez) {
        vazio()
        return
      }

      if (vez.alunoId !== ultimoId) {
        ultimoId = vez.alunoId
        ultimoEstado = null
        palco.innerHTML = ''

        atual = criarJanelinha({ nome: vez.nome, turma: vez.turma })
        palco.append(atual)

        const liberar = document.createElement('button')
        liberar.className = 'liberar'
        liberar.textContent = 'Liberar saída'
        liberar.onclick = () => conexao.enviar({ tipo: 'liberar', alunoId: vez.alunoId })
        palco.append(liberar)

        const fila = document.createElement('p')
        fila.className = 'fila'
        palco.append(fila)
      }

      if (vez.estado !== ultimoEstado) {
        requestAnimationFrame(() => atual.definirEstado(vez.estado))
        if (vez.estado === 'chamado') tocarAbertura()
        if (vez.estado === 'liberado') tocarEntrega()
        ultimoEstado = vez.estado
      }

      const liberar = palco.querySelector('.liberar')
      if (liberar) liberar.disabled = vez.estado === 'liberado'

      palco.querySelector('.fila').textContent =
        ativas.length > 1 ? `mais ${ativas.length - 1} na fila` : ''
    }
  </script>
</body>
</html>
