<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sala — Janelinhas do Saber</title>
  <link rel="stylesheet" href="../comum/tokens.css">
  <style>
    .entrada { max-width: 420px; margin: 3.5rem auto; padding: 0 var(--e-4); }
    .entrada h2 { font-size: var(--t-titulo); margin: 0 0 var(--e-1); }
    .entrada p { color: var(--tinta-2); margin: 0 0 var(--e-6); font-size: var(--t-corpo); }
    .turma-do-aparelho { font-size: var(--t-nome); font-weight: 600; color: var(--tinta); margin: 0 0 var(--e-2); }
    /* O rodapé é fixo, então o palco termina acima dele. */
    /*
      O palco acompanha a tela até 1600px. Eram 1280 fixos, e num monitor de
      1920 sobravam 640px de papel vazio dos dois lados enquanto o cartão —
      que existe para ser lido do fundo da sala — ficava espremido no meio.
    */
    .palco { padding: var(--e-6) var(--e-6) 5rem; max-width: 1600px; margin: 0 auto; }
    .rodape {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: var(--e-3) var(--e-6); background: var(--papel);
      border-top: 1px solid var(--linha); display: flex; flex-wrap: wrap; gap: var(--e-2) var(--e-6); align-items: center;
      font-size: var(--t-detalhe); font-weight: 600; text-transform: uppercase;
      letter-spacing: var(--tracking-etiqueta); color: var(--tinta-2);
    }
    .rodape .rede { font-size: inherit; }
    .contagem { margin-left: auto; color: var(--tinta); }
    .tela-apaga { color: var(--tinta-2); }
    /*
      Compacto no cabeçalho. Vazado, como todo controle que não é a ação: no
      papel, uma caixa branca pesaria mais que o nome da escola.
    */
    .volume { width: auto; min-width: 8rem; margin: 0; background: transparent; font-weight: 600; }
    /* A faixa leva o sino: é o mesmo ícone da etiqueta de `chamado`. */
    .faixa svg { width: 28px; height: 28px; vertical-align: -6px; margin-right: var(--e-3); fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>

  <!--
    A turma vem do APARELHO, e por isso não há mais o que escolher aqui. O
    botão continua sendo necessário: destravar o áudio e pedir o bloqueio de
    tela exigem um gesto do usuário, e este é o gesto.
  -->
  <div id="entrada" class="entrada">
    <h2>Tela da sala</h2>
    <p class="turma-do-aparelho" id="turmaDoAparelho"></p>
    <p>Você será avisado quando o responsável de um aluno chegar no portão.</p>
    <button class="principal larga" id="entrar">Entrar na sala</button>
  </div>

  <!-- `painel`: a sala é lida do meio da sala, não da mão. -->
  <div id="app" class="painel" hidden>
    <header class="cabecalho">
      <span class="marca-glifo" aria-hidden="true"></span>
      <div>
        <p class="titulo">Janelinhas do Saber</p>
        <p class="subtitulo" id="turmaAtual"></p>
      </div>
      <div class="direita">
        <label class="fora-da-tela" for="volume">Volume do aviso</label>
        <select id="volume" class="volume"></select>
        <button class="fantasma" id="mudo" aria-pressed="false">Som ligado</button>
      </div>
    </header>

    <p class="faixa" id="faixa" hidden></p>

    <button class="faixa aviso" id="avisoSom" aria-live="polite" hidden></button>

    <p class="faixa recusa" id="recusa" role="alert" hidden></p>

    <main class="palco">
      <p class="vazio" id="vazio">Nenhuma chamada agora.</p>
      <div class="grade" id="grade"></div>
    </main>

    <footer class="rodape">
      <span class="rede" id="rede">ligando…</span>
      <span class="tela-apaga" id="telaApaga" hidden>a tela pode apagar sozinha</span>
      <span class="contagem" id="contagem"></span>
    </footer>
  </div>

  <script type="module">
    import { criarCartao } from '../comum/cartao.js'
    import { ligar } from '../comum/ligacao.js'
    import { exigirAparelho } from '../comum/porta.js'
    import {
      destravar,
      tocarAbertura,
      tocarEntrega,
      alternarMudo,
      estaMudo,
      aoFalharSom,
      degraus,
      volumeAtual,
      definirVolume,
    } from '../comum/som.js'
    import { manterTelaAcesa, aoMudarTelaAcesa } from '../comum/tela-acesa.js'
    import { podeSeguir } from '../comum/alerta.js'

    /*
      O código vai para a trilha; a frase fica aqui. Não há razão de saúde:
      seria dado sensível de uma criança (docs/lgpd.md).
    */
    const ROTULO_RAZAO = [
      ['esqueceu-material', 'Esqueceu material'],
      ['nao-saiu-com-o-responsavel', 'Não saiu com o responsável'],
      ['a-escola-reteve', 'A escola reteve'],
      ['outro', 'Outro motivo'],
    ]

    const SINO = ['M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7', 'M13.7 21a2 2 0 0 1-3.4 0']
    function sino() {
      const NS = 'http://www.w3.org/2000/svg'
      const svg = document.createElementNS(NS, 'svg')
      svg.setAttribute('viewBox', '0 0 24 24')
      svg.setAttribute('aria-hidden', 'true')
      for (const d of SINO) {
        const p = document.createElementNS(NS, 'path')
        p.setAttribute('d', d)
        svg.append(p)
      }
      return svg
    }

    const aparelho = await exigirAparelho('sala')
    const turmaDoAparelho = aparelho.turma

    const rotuloTurma = document.getElementById('turmaDoAparelho')
    rotuloTurma.textContent = turmaDoAparelho
      ? `Esta é a tela do ${turmaDoAparelho}.`
      : 'Este aparelho não está autorizado como sala.'

    const botaoMudo = document.getElementById('mudo')
    const rede = document.getElementById('rede')
    const grade = document.getElementById('grade')

    /*
      Envia, e diz na tela quando não deu. Antes, um toque com o WebSocket
      fechado era descartado em silêncio: a professora tocava em "Liberar",
      nada acontecia, e ela concluía que o sistema tinha ignorado.
    */
    function mandar(comando) {
      const ok = conexao.enviar(comando)
      if (!ok) rede.textContent = 'sem conexão agora — tente de novo'
      return ok
    }
    const faixa = document.getElementById('faixa')
    const vazio = document.getElementById('vazio')
    const contagem = document.getElementById('contagem')

    let turma = null
    let conexao = null
    const cartoes = new Map()

    const avisoSom = document.getElementById('avisoSom')

    function desenharMudo() {
      const mudo = estaMudo()
      botaoMudo.textContent = mudo ? 'Som desligado' : 'Som ligado'
      botaoMudo.setAttribute('aria-pressed', String(mudo))
    }
    desenharMudo()

    aoFalharSom((mensagem) => {
      if (mensagem) avisoSom.textContent = mensagem
      avisoSom.hidden = !mensagem
    })
    avisoSom.onclick = () => destravar()

    botaoMudo.onclick = () => {
      alternarMudo()
      desenharMudo()
    }

    const seletorVolume = document.getElementById('volume')
    const ROTULO_VOLUME = { baixo: 'Som baixo', medio: 'Som médio', alto: 'Som alto' }
    for (const degrau of degraus()) {
      const opcao = document.createElement('option')
      opcao.value = degrau
      opcao.textContent = ROTULO_VOLUME[degrau] ?? degrau
      seletorVolume.append(opcao)
    }
    seletorVolume.value = volumeAtual()
    seletorVolume.onchange = () => {
      definirVolume(seletorVolume.value)
      tocarEntrega()
    }

    const telaApaga = document.getElementById('telaApaga')
    aoMudarTelaAcesa((estado) => {
      telaApaga.hidden = estado === 'ativo'
      telaApaga.textContent =
        estado === 'sem-suporte'
          ? 'este navegador deixa a tela apagar'
          : 'a tela pode apagar sozinha'
    })

    document.getElementById('entrar').onclick = () => {
      destravar()
      manterTelaAcesa()
      turma = turmaDoAparelho

      document.getElementById('entrada').hidden = true
      document.getElementById('app').hidden = false
      document.getElementById('turmaAtual').textContent = turma
      document.title = `${turma} — Janelinhas do Saber`

      conexao = ligar({
        aoEstadoDaRede: (estado) => {
          rede.dataset.rede = estado
          rede.textContent = estado === 'ligado' ? 'conectado' : 'reconectando…'
        },
        aoRetrato: desenhar,
        aoRecusa: (recusa) => mostrarRecusa(recusa.motivo),
      })
    }

    const faixaRecusa = document.getElementById('recusa')
    let apagarRecusa = null

    function mostrarRecusa(texto) {
      faixaRecusa.textContent = texto
      faixaRecusa.hidden = false
      clearTimeout(apagarRecusa)
      apagarRecusa = setTimeout(() => { faixaRecusa.hidden = true }, 8000)
    }

    /*
      O motivo do retorno é uma LISTA DE ALVOS, não um <select>.

      Um select esconde as opções atrás de um toque e mostra uma de cada vez;
      a professora, de pé, precisa comparar as quatro e tocar. Cada opção é um
      alvo de 56px. O código continua sendo o que vai para a trilha.
    */
    let contadorRazoes = 0
    function montarRazoes(aoConfirmar) {
      const grupo = `razao-${++contadorRazoes}`
      const volta = document.createElement('div')
      volta.className = 'razoes'
      volta.hidden = true

      const pergunta = document.createElement('p')
      pergunta.className = 'pergunta'
      pergunta.id = `${grupo}-pergunta`
      pergunta.textContent = 'Por que a criança voltou?'

      const opcoes = document.createElement('div')
      opcoes.className = 'opcoes'
      opcoes.setAttribute('role', 'radiogroup')
      opcoes.setAttribute('aria-labelledby', pergunta.id)

      for (const [codigo, rotulo] of ROTULO_RAZAO) {
        const opcao = document.createElement('label')
        opcao.className = 'opcao'
        const marca = document.createElement('input')
        marca.type = 'radio'
        marca.name = grupo
        marca.value = codigo
        /*
          Nenhuma vem marcada. A razão entra na trilha para sempre, e uma razão
          "padrão" seria o sistema respondendo por quem não escolheu — o
          registro diria "esqueceu material" para toda professora que só tocou
          em confirmar. Sem escolha, o confirmar fica desabilitado.
        */
        marca.onchange = () => {
          confirmar.disabled = false
        }
        opcao.append(marca, document.createTextNode(rotulo))
        opcoes.append(opcao)
      }

      const botoes = document.createElement('div')
      botoes.className = 'botoes'

      const confirmar = document.createElement('button')
      confirmar.className = 'principal'
      confirmar.textContent = 'Confirmar: voltou para a sala'
      confirmar.disabled = true
      confirmar.onclick = () => {
        const marcada = opcoes.querySelector('input:checked')
        if (!marcada) return
        aoConfirmar(marcada.value)
        volta.hidden = true
        abrir.hidden = false
      }

      const desistir = document.createElement('button')
      desistir.className = 'fantasma'
      desistir.textContent = 'Não voltou'
      desistir.onclick = () => {
        volta.hidden = true
        abrir.hidden = false
      }

      botoes.append(confirmar, desistir)
      volta.append(pergunta, opcoes, botoes)

      /*
        "Voltou para a sala" é ação SECUNDÁRIA, fora do eixo do botão principal:
        no estado `liberado` o botão principal fica desabilitado, e o gesto
        habitual da professora sobre aquele cartão é um no-op seguro. A volta
        abre a lista de motivos; só o "Confirmar" envia.
      */
      const abrir = document.createElement('button')
      abrir.className = 'fantasma secundaria'
      abrir.textContent = 'Voltou para a sala'
      abrir.onclick = () => {
        abrir.hidden = true
        volta.hidden = false
        // Toda abertura começa sem escolha. E o foco vai para a pergunta, não
        // para o corpo da página: o botão que acabou de ser tocado sumiu.
        for (const marca of opcoes.querySelectorAll('input')) marca.checked = false
        confirmar.disabled = true
        opcoes.querySelector('input')?.focus()
      }

      return { volta, abrir }
    }

    /*
      O primeiro retrato desenha, mas não toca: é a fotografia do que já estava
      acontecendo antes desta tela existir. Som que toca quando nada aconteceu
      ensina a professora a ignorar o som.
    */
    let jaDesenhou = false

    function desenhar(retrato) {
      const primeiro = !jaDesenhou
      jaDesenhou = true

      const ativas = retrato.chamadas
        .filter((c) => c.estado !== 'entregue')
        .sort((a, b) => a.desde - b.desde)

      const presentes = new Set(ativas.map((c) => c.alunoId))
      for (const [id, cartao] of cartoes) {
        if (!presentes.has(id)) {
          cartao.remove()
          cartoes.delete(id)
        }
      }

      for (const chamada of ativas) {
        let cartao = cartoes.get(chamada.alunoId)

        if (!cartao) {
          cartao = criarCartao({ nome: chamada.nome, turma: chamada.turma })
          const botao = document.createElement('button')
          botao.className = 'principal'
          botao.textContent = 'Liberar saída'
          botao.onclick = async () => {
            /*
              Desabilita ENQUANTO pergunta. Um toque duplo — comum num tablet
              — abria duas caixas de restrição e mandava dois "liberar"; o
              segundo voltava como recusa na tela da professora. O próximo
              retrato reabilita conforme o estado.
            */
            botao.disabled = true
            const seguir = await podeSeguir({
              alunoId: chamada.alunoId,
              nome: chamada.nome,
              papel: 'sala',
              turma,
              acao: 'liberar a saída',
            })
            const mandou = seguir && mandar({ tipo: 'liberar', alunoId: chamada.alunoId })
            if (!mandou) botao.disabled = false
          }
          cartao.acrescentar(botao)

          const { volta, abrir } = montarRazoes((razao) =>
            mandar({ tipo: 'retornar', alunoId: chamada.alunoId, razao }),
          )
          cartao.acrescentar(abrir)
          cartao.acrescentar(volta)

          cartao.__botao = botao
          cartao.__volta = volta
          cartao.__abrir = abrir
          cartao.__estado = null
          cartoes.set(chamada.alunoId, cartao)
          grade.append(cartao)
          if (!primeiro) tocarAbertura()
        }

        if (chamada.estado !== cartao.__estado) {
          cartao.definirEstado(chamada.estado)
          if (chamada.estado === 'liberado' && !primeiro) tocarEntrega()
          cartao.__estado = chamada.estado
        }
        cartao.__botao.disabled = chamada.estado !== 'chamado'
        cartao.__botao.textContent =
          chamada.estado === 'liberado'
            ? 'Aguardando no portão'
            : chamada.estado === 'retorno'
              ? 'Aguardando a portaria chamar de novo'
              : 'Liberar saída'

        // A volta só existe enquanto a criança está liberada e ainda não saiu.
        const podeVoltar = chamada.estado === 'liberado'
        cartao.__abrir.hidden = !podeVoltar || !cartao.__volta.hidden
        if (!podeVoltar) cartao.__volta.hidden = true
      }

      /*
        A ordem é por `desde`, e vale sempre — não só na criação. "Chamar de
        novo" reinicia o `desde`, e a criança que voltou do retorno precisa
        descer para o fim da fila, como a portaria já faz. Só move quem está
        fora do lugar: o cartão sob o dedo continua sendo o mesmo nó.
      */
      let anterior = null
      for (const chamada of ativas) {
        const no = cartoes.get(chamada.alunoId)
        const esperado = anterior === null ? grade.firstChild : anterior.nextSibling
        if (no !== esperado) grade.insertBefore(no, esperado)
        anterior = no
      }

      const aguardando = ativas.filter((c) => c.estado === 'chamado').length
      vazio.hidden = ativas.length > 0
      faixa.hidden = aguardando === 0
      faixa.replaceChildren(
        sino(),
        document.createTextNode(
          aguardando === 1
            ? 'Responsável chegou. Toque em liberar saída.'
            : `${aguardando} responsáveis chegaram. Toque em liberar saída.`,
        ),
      )
      contagem.textContent = ativas.length > 0 ? `${ativas.length} em saída` : ''
    }
  </script>
</body>
</html>
