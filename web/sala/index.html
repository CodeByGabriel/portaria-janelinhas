<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sala — Janelinhas do Saber</title>
  <link rel="stylesheet" href="../comum/tokens.css">
  <style>
    .entrada { max-width: 420px; margin: 3.5rem auto; padding: 0 1.15rem; }
    .entrada h2 { font-size: var(--t-titulo); font-weight: 600; margin: 0 0 0.3rem; }
    .entrada p { color: var(--tinta-media); margin: 0 0 1.4rem; font-size: var(--t-corpo); }
    .entrada label {
      display: block; font-size: var(--t-etiqueta); font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--tinta-fraca); margin-bottom: 0.4rem;
    }
    .entrada select { margin-bottom: 1rem; }
    /* A turma lembrada é um palpite anunciado, não uma decisão tomada. */
    .lembrada {
      margin: -0.5rem 0 1rem;
      font-size: var(--t-detalhe);
      color: var(--estado-chamado);
      font-weight: 500;
    }
    /*
      O rodapé é fixo, então o palco precisa terminar acima dele.

      Sem isto o último cartão passava POR BAIXO do rodapé — e com a variante
      Painel, que deixou os cartões mais altos, o que sumia era o botão: ficava
      invisível e alcançável só rolando às cegas.
    */
    .palco { padding: 1.15rem 1.15rem 5rem; max-width: 900px; margin: 0 auto; }
    .cartao button { width: 100%; }
    .rodape {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 0.5rem 1.15rem; background: var(--superficie);
      border-top: 1px solid var(--borda); display: flex; gap: 1rem; align-items: center;
    }
    .contagem { font-size: var(--t-detalhe); color: var(--tinta-media); margin-left: auto; }
    .tela-apaga { font-size: var(--t-detalhe); color: var(--estado-chamado); font-weight: 500; }
    /* Compacto no cabeçalho, mas ainda dentro do alvo de 44px do `select`. */
    /*
      Compacto no cabeçalho, mas ainda dentro do alvo de 44px do `select`.
      Fundo translúcido em vez de branco sólido: no cabeçalho verde, uma caixa
      branca pesa mais que o nome da escola.
    */
    .volume {
      width: auto; min-width: 7.5rem; margin: 0;
      background: rgba(255, 255, 255, 0.14);
      color: var(--tinta-clara);
      border-color: rgba(255, 255, 255, 0.45);
      font-size: var(--t-detalhe);
    }
    .volume option { color: var(--tinta); }
    .recusa {
      background: var(--estado-retorno-fundo);
      border-bottom: 1px solid var(--estado-retorno);
      color: var(--estado-retorno);
      font-weight: 600;
    }
    /* A volta para a sala é ação secundária: não disputa o eixo do botão que
       libera a criança. Ver o comentário em desenhar(). */
    .cartao .secundaria {
      width: auto;
      margin: 0.5rem auto 0;
      display: block;
      font-size: var(--t-detalhe);
    }
    .razoes { margin-top: 0.75rem; border-top: 1px solid var(--borda); padding-top: 0.7rem; }
    /* Nome de razão é longo; sem isto o `select` corta no meio da palavra. */
    /* Padding menor: no Painel o rótulo mais longo cortava a última letra no
       estado fechado. A altura continua nos 44px, que é o que importa. */
    .razoes select {
      margin: 0 0 0.45rem; width: 100%;
      font-size: var(--t-detalhe); padding-left: 0.55rem; padding-right: 0.4rem;
    }
  </style>
</head>
<body>

  <div id="entrada" class="entrada">
    <h2>Tela da sala</h2>
    <p>Escolha a turma. Você será avisado quando o responsável de um aluno chegar no portão.</p>
    <label for="turma">Turma</label>
    <select id="turma"></select>
    <!--
      A turma lembrada aparece PRÉ-SELECIONADA e anunciada, nunca aplicada
      sozinha. Entrar na sala errada é ver a criança de outra turma sumir da
      tela sem explicação — e não ver a da sua. Enquanto não houver login, o
      toque em "Entrar" é a confirmação.
    -->
    <p class="lembrada" id="lembrada" hidden></p>
    <button class="principal larga" id="entrar">Entrar na sala</button>
  </div>

  <!--
    `painel`: a sala é lida do meio da sala, não da mão.

    O aparelho fica apoiado na mesa ou preso na parede, com vinte crianças em
    pé na frente. Os tokens são os mesmos da portaria; muda só a escala.
  -->
  <div id="app" class="painel" hidden>
    <header class="cabecalho">
      <span class="marca-glifo" aria-hidden="true"></span>
      <div>
        <p class="titulo">Janelinhas do Saber</p>
        <p class="subtitulo" id="turmaAtual"></p>
      </div>
      <div class="direita">
        <!--
          Três degraus, não um cursor deslizante. Quem mexe nisto é uma
          professora de pé, com a turma esperando, num tablet: três alvos
          grandes acertam de primeira, um cursor exige mira e produz
          "quase inaudível" por engano — a mesma falha do mudo, sem nada
          na tela dizendo.
        -->
        <label class="fora-da-tela" for="volume">Volume do aviso</label>
        <select id="volume" class="volume"></select>
        <button class="fantasma" id="mudo" aria-pressed="false">Som ligado</button>
      </div>
    </header>

    <p class="faixa" id="faixa" hidden></p>

    <!--
      Aviso de som interrompido.

      Fica FORA da faixa de "N responsáveis chegaram" de propósito: as duas
      podem estar valendo ao mesmo tempo, e é justamente quando as duas valem
      que o aviso importa — tem gente esperando no portão e a sala não ouviu.
      É um botão, não um texto, porque reativar áudio exige gesto do usuário;
      um aviso que só informa deixaria a professora sem o que fazer.
    -->
    <button class="faixa aviso" id="avisoSom" aria-live="polite" hidden></button>

    <!--
      Recusa do servidor. Fica separada do aviso de som porque as duas podem
      valer ao mesmo tempo e dizem coisas diferentes: uma é "não te ouvi", a
      outra é "não fiz o que você pediu".
    -->
    <p class="faixa recusa" id="recusa" role="alert" hidden></p>

    <main class="palco">
      <p class="vazio" id="vazio">Nenhuma chamada agora.</p>
      <div class="grade" id="grade"></div>
    </main>

    <footer class="rodape">
      <span class="rede" id="rede">ligando…</span>
      <!--
        Só aparece quando a tela PODE apagar. Bloqueio funcionando é o
        esperado e não merece pixel; bloqueio ausente é uma coisa que a
        professora pode resolver na configuração do aparelho.
      -->
      <span class="tela-apaga" id="telaApaga" hidden>a tela pode apagar sozinha</span>
      <span class="contagem" id="contagem"></span>
    </footer>
  </div>

  <script type="module">
    import { criarCartao } from '../comum/cartao.js'
    import { ligar } from '../comum/ligacao.js'
    import {
      destravar,
      tocarAbertura,
      tocarEntrega,
      alternarMudo,
      estaMudo,
      aoFalharSom,
      degraus,
      volumeAtual,
      definirVolume,
    } from '../comum/som.js'
    import { manterTelaAcesa, aoMudarTelaAcesa } from '../comum/tela-acesa.js'
    import { podeSeguir } from '../comum/alerta.js'

    const TURMA_LEMBRADA = 'janelinhas:turma'

    /*
      O código vai para a trilha; a frase fica aqui.

      Renomear um rótulo na tela não pode reescrever o passado — e a trilha não
      tem caminho de correção, então o que entra fica os 90 dias. Por isso o
      servidor só aceita os códigos, e a lista viva está em `src/estados.ts`.

      Não há razão de saúde: seria dado sensível de uma criança, agrupável por
      aluno ao longo do trimestre, e `docs/lgpd.md` já proíbe usar a trilha para
      avaliar aluno. O detalhe clínico fica no livro de ocorrência da escola.
    */
    const ROTULO_RAZAO = [
      ['esqueceu-material', 'Esqueceu material'],
      ['nao-saiu-com-o-responsavel', 'Não saiu com o responsável'],
      ['a-escola-reteve', 'A escola reteve'],
      ['outro', 'Outro motivo'],
    ]

    const TURMAS = [
      ['Educação Infantil', ['Pré 1', 'Pré 2']],
      ['Fundamental I', ['1º ano', '2º ano', '3º ano', '4º ano', '5º ano']],
      ['Fundamental II', ['6º ano', '7º ano', '8º ano', '9º ano']],
    ]

    const seletor = document.getElementById('turma')
    for (const [segmento, turmas] of TURMAS) {
      const grupo = document.createElement('optgroup')
      grupo.label = segmento
      for (const t of turmas) {
        const opcao = document.createElement('option')
        opcao.value = t
        opcao.textContent = t
        grupo.append(opcao)
      }
      seletor.append(grupo)
    }
    const TODAS_AS_TURMAS = TURMAS.flatMap(([, t]) => t)

    function turmaGuardada() {
      try {
        const t = localStorage.getItem(TURMA_LEMBRADA)
        // Valida contra a lista: uma turma renomeada ou um valor adulterado no
        // armazenamento deixaria o seletor num estado que não existe.
        return TODAS_AS_TURMAS.includes(t) ? t : null
      } catch {
        return null
      }
    }

    /*
      A URL manda sobre o que foi lembrado.

      Um link com `?turma=` é alguém dizendo qual sala é esta agora — a memória
      do aparelho é só o palpite da última vez.
    */
    const daUrl = new URLSearchParams(location.search).get('turma')
    const lembrada = turmaGuardada()
    const aviso = document.getElementById('lembrada')

    if (daUrl) {
      seletor.value = daUrl
    } else if (lembrada) {
      seletor.value = lembrada
      aviso.textContent = `Última turma usada neste aparelho: ${lembrada}. Confira antes de entrar.`
      aviso.hidden = false
    }

    const botaoMudo = document.getElementById('mudo')
    const rede = document.getElementById('rede')
    const grade = document.getElementById('grade')
    const faixa = document.getElementById('faixa')
    const vazio = document.getElementById('vazio')
    const contagem = document.getElementById('contagem')

    let turma = null
    let conexao = null
    const cartoes = new Map()

    /*
      O rótulo carrega o estado e `aria-pressed` também.

      É redundante de propósito. Trocar o rótulo por um nome fixo ("Silenciar")
      e deixar só o aria-pressed dizer o estado quebraria a 2.5.3 do WCAG para
      quem comanda por voz, que precisa falar o texto que está vendo.
    */
    const avisoSom = document.getElementById('avisoSom')

    function desenharMudo() {
      const mudo = estaMudo()
      botaoMudo.textContent = mudo ? 'Som desligado' : 'Som ligado'
      botaoMudo.setAttribute('aria-pressed', String(mudo))
    }
    desenharMudo()

    /*
      O som pode parar sozinho depois do primeiro gesto — aba em segundo plano,
      ligação, tela bloqueada. Sem isto a sala continuava desenhando o cartão e
      nada mais: a professora só descobria pelo responsável reclamando no portão.
    */
    aoFalharSom((mensagem) => {
      // O texto ANTES de mostrar: uma região aria-live que aparece já com o
      // conteúdo é anunciada; preenchida depois de aparecer, às vezes não.
      if (mensagem) avisoSom.textContent = mensagem
      avisoSom.hidden = !mensagem
    })
    avisoSom.onclick = () => destravar()

    botaoMudo.onclick = () => {
      alternarMudo()
      desenharMudo()
    }

    const seletorVolume = document.getElementById('volume')
    // O codigo do degrau e interno; o que a professora le e uma palavra.
    const ROTULO_VOLUME = { baixo: 'Som baixo', medio: 'Som médio', alto: 'Som alto' }
    for (const degrau of degraus()) {
      const opcao = document.createElement('option')
      opcao.value = degrau
      opcao.textContent = ROTULO_VOLUME[degrau] ?? degrau
      seletorVolume.append(opcao)
    }
    seletorVolume.value = volumeAtual()
    seletorVolume.onchange = () => {
      definirVolume(seletorVolume.value)
      // Toca uma vez para ela ouvir o que escolheu. Escolher volume sem
      // referência é escolher no escuro, e o erro só aparece na hora errada.
      tocarEntrega()
    }

    /*
      A tela da sala fica minutos parada de propósito: ela só muda quando um
      responsável chega no portão. É exatamente aí que o tablet decide apagar —
      e com a tela apagada o som também não sai, porque o navegador suspende o
      áudio junto. Os dois canais caem ao mesmo tempo.
    */
    const telaApaga = document.getElementById('telaApaga')
    aoMudarTelaAcesa((estado) => {
      telaApaga.hidden = estado === 'ativo'
      telaApaga.textContent =
        estado === 'sem-suporte'
          ? 'este navegador deixa a tela apagar'
          : 'a tela pode apagar sozinha'
    })

    document.getElementById('entrar').onclick = () => {
      destravar()
      manterTelaAcesa()
      turma = seletor.value
      try {
        localStorage.setItem(TURMA_LEMBRADA, turma)
      } catch {
        /* sem armazenamento: vale só para esta sessão */
      }
      document.getElementById('entrada').hidden = true
      document.getElementById('app').hidden = false
      document.getElementById('turmaAtual').textContent = turma
      document.title = `${turma} — Janelinhas do Saber`

      conexao = ligar({
        papel: 'sala',
        turma,
        aoEstadoDaRede: (estado) => {
          rede.dataset.rede = estado
          rede.textContent = estado === 'ligado' ? 'conectado' : 'reconectando…'
        },
        aoRetrato: desenhar,
        /*
          A sala nunca teve canal de recusa.

          `ligacao.js` chama `aoRecusa?.(dado)` — sem o retorno, toda recusa
          enviada a sala sumia. Era quase inofensivo enquanto a unica acao dela
          era `liberar`, porque o retrato seguinte desmentia a tela. `retornar`
          e a acao cuja falha significa crianca num lugar e registro em outro:
          a professora aperta "voltou", o servidor recusa, e sem isto ela nao
          fica sabendo.
        */
        aoRecusa: (recusa) => mostrarRecusa(recusa.motivo),
      })
    }

    /*
      O primeiro retrato desenha, mas não toca.

      Ele é a fotografia do que já estava acontecendo antes desta tela existir —
      um F5 no meio da saída, ou a reconexão depois de o wifi cair. Sem esta
      guarda, recarregar com quatro crianças na fila disparava quatro sinos de
      uma vez, e nenhum deles correspondia a alguém que acabou de chegar.

      Som que toca quando nada aconteceu ensina a professora a ignorar o som.
    */
    const faixaRecusa = document.getElementById('recusa')
    let apagarRecusa = null

    function mostrarRecusa(texto) {
      faixaRecusa.textContent = texto
      faixaRecusa.hidden = false
      clearTimeout(apagarRecusa)
      apagarRecusa = setTimeout(() => { faixaRecusa.hidden = true }, 8000)
    }

    let jaDesenhou = false

    function desenhar(retrato) {
      const primeiro = !jaDesenhou
      jaDesenhou = true

      // `retorno` entra: a criança voltou para esta sala e a professora precisa
      // continuar vendo o caso aberto até a portaria fechá-lo.
      const ativas = retrato.chamadas
        .filter((c) => c.estado !== 'entregue')
        .sort((a, b) => a.desde - b.desde)

      const presentes = new Set(ativas.map((c) => c.alunoId))
      for (const [id, cartao] of cartoes) {
        if (!presentes.has(id)) {
          cartao.remove()
          cartoes.delete(id)
        }
      }

      for (const chamada of ativas) {
        let cartao = cartoes.get(chamada.alunoId)

        if (!cartao) {
          cartao = criarCartao({ nome: chamada.nome, turma: chamada.turma })
          const botao = document.createElement('button')
          botao.className = 'principal'
          botao.textContent = 'Liberar saída'
          botao.onclick = async () => {
            /*
              Liberar é a confirmação da professora — o único evento que este
              sistema existe para proteger. Se há restrição registrada, ela
              precisa aparecer aqui, e não só na portaria: quem conhece a
              criança e a família é quem está na sala.
            */
            const seguir = await podeSeguir({
              alunoId: chamada.alunoId,
              nome: chamada.nome,
              papel: 'sala',
              turma,
              acao: 'liberar a saída',
            })
            if (seguir) conexao.enviar({ tipo: 'liberar', alunoId: chamada.alunoId })
          }
          cartao.acrescentar(botao)

          /*
            "Voltou para a sala" é ação SECUNDÁRIA, fora do eixo do botão
            principal.

            No estado `liberado` o botão principal fica desabilitado com
            "Aguardando no portão": o gesto habitual da professora sobre aquele
            cartão é um no-op seguro. Pôr a volta ali transformaria a mesma
            área num botão que rebobina o estado — e o efeito colateral cai na
            porteira, do outro lado da escola.
          */
          const volta = document.createElement('div')
          volta.className = 'razoes'
          volta.hidden = true

          const porque = document.createElement('select')
          porque.setAttribute('aria-label', 'Por que a criança voltou')
          for (const [codigo, rotulo] of ROTULO_RAZAO) {
            const o = document.createElement('option')
            o.value = codigo
            o.textContent = rotulo
            porque.append(o)
          }

          const botaoVolta = document.createElement('button')
          botaoVolta.className = 'secundaria'
          botaoVolta.textContent = 'Voltou para a sala'
          botaoVolta.onclick = () =>
            conexao.enviar({
              tipo: 'retornar',
              alunoId: chamada.alunoId,
              razao: porque.value,
            })

          volta.append(porque, botaoVolta)
          cartao.acrescentar(volta)

          cartao.__botao = botao
          cartao.__volta = volta
          cartao.__estado = null
          cartoes.set(chamada.alunoId, cartao)
          grade.append(cartao)
          if (!primeiro) tocarAbertura()
        }

        if (chamada.estado !== cartao.__estado) {
          cartao.definirEstado(chamada.estado)
          if (chamada.estado === 'liberado' && !primeiro) tocarEntrega()
          cartao.__estado = chamada.estado
        }
        /*
          Em `retorno`, a professora não pode liberar de novo: alguém precisa
          reconfirmar que há um adulto no portão, e quem enxerga o portão é a
          portaria. O botão diz isso em vez de sumir — um botão que some leva a
          professora a achar que perdeu a criança de vista.
        */
        cartao.__botao.disabled = chamada.estado !== 'chamado'
        cartao.__botao.textContent =
          chamada.estado === 'liberado'
            ? 'Aguardando no portão'
            : chamada.estado === 'retorno'
              ? 'Aguardando a portaria chamar de novo'
              : 'Liberar saída'

        // A volta só existe enquanto a criança está liberada e ainda não saiu.
        cartao.__volta.hidden = chamada.estado !== 'liberado'
      }

      const aguardando = ativas.filter((c) => c.estado === 'chamado').length
      vazio.hidden = ativas.length > 0
      faixa.hidden = aguardando === 0
      faixa.textContent =
        aguardando === 1
          ? 'Responsável chegou. Toque em liberar saída.'
          : `${aguardando} responsáveis chegaram. Toque em liberar saída.`
      contagem.textContent = ativas.length > 0 ? `${ativas.length} em saída` : ''
    }
  </script>
</body>
</html>
