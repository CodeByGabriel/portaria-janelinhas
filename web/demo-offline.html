/*
  Janelinhas do Saber — "Pátio", refinado.

  Direção: QUADRO DE AVISOS DA SECRETARIA, EM PAPEL QUENTE, LIDO DO FUNDO DA SALA.

  O que mudou em relação ao Pátio anterior, e por quê:
  - sombra em cartão morre; hairline de 1px no lugar. Cartão branco sobre papel
    já se destaca por superfície; sombra era o segundo sinal para a mesma coisa,
    e é a marca do "protótipo de IA" que o dono apontou.
  - a pílula de estado morre. O estado vira ícone + rótulo na cor do estado,
    sem caixa nem fundo tintado. Cinco fundos pastel eram cor sem trabalho.
  - o cabeçalho deixa de ser verde cheio. Verde cheio é a ÚNICA ação preenchida
    da tela; gasto num cabeçalho que não faz nada, sobrava para o botão a mesma
    cor de algo que não é botão.
  - `liberado` deixa de ser verde: colidia com a cor da ação (mesmo matiz para
    quem vê tudo, ΔE 16 sob deuteranopia). Cor de ação e cor de estado não
    podem se parecer.

  Contrastes anotados são WCAG 2.2 contra --papel e --cartao. src/contraste.test.ts
  lê este arquivo e trava os pares.

  Os nomes antigos (--fundo, --superficie, --marca, --tinta-media…) continuam
  como apelidos no fim do :root, para nenhuma tela quebrar no meio da migração.
  Apagar os apelidos quando a última referência sumir.
*/

:root {
  /* ---------- superfícies ---------- */

  /*
    Papel, não branco. Um degrau menos amarelo que o #FBF7EF anterior: sob sol
    de 17h o creme forte puxava a terracota de `chamado` para ocre — a mesma
    direção em que a deuteranopia já a empurra.
  */
  --papel: #F7F3EC;
  --cartao: #FFFFFF;
  --destaque: #EEE8DD;   /* fundo de campo, caixa de importação, hover de botão */

  /* ---------- tinta ---------- */

  /*
    Uma tinta, três degraus. Não há cinzas inventados: os dois secundários são
    a tinta a 70% e 45% compostos sobre o papel, achatados em hex para o teste
    de contraste conseguir ler.
      --tinta    15,6 papel / 17,3 cartão
      --tinta-2   6,1 papel /  6,6 cartão   (texto secundário)
      --tinta-3   3,2 cartão — só NÃO-TEXTO: borda de campo, retrato tracejado
    O 60% do Notion foi medido e recusado: 4,38 sobre o papel, reprova.
  */
  --tinta: #1E1A16;
  --tinta-2: #5F5B56;
  --tinta-3: #8F8B87;
  --tinta-clara: #FFFFFF;

  /* Hairline no lugar de sombra. A forte é para campo de formulário, que
     precisa de 3:1 como componente (WCAG 1.4.11). */
  --linha: rgba(30, 26, 22, 0.08);
  --linha-forte: var(--tinta-3);

  /* ---------- ação: uma só, preenchida ---------- */

  /*
    Verde-mata do Pátio. Fica porque é a marca da escola E porque, muito
    escuro, não briga com nenhum estado: 8,24 sobre papel; branco sobre ele 9,11.
    Só `button.principal` usa este preenchimento. Tudo o mais é vazado.
  */
  --acao: #14532D;
  --acao-pressionada: #0E3D21;

  /* ---------- estados ---------- */

  /*
    Nenhum destes aparece sozinho. Quatro canais, sempre: cor + rótulo + ícone
    + desenho da faixa. web/comum/cartao.js monta o conjunto.

                         papel   cartão  |  ΔE deuteranopia / protanopia
    aguardando  #6F675F   5,02    5,55   |  nunca aparece em tela ao vivo
    chamado     #B5441C   4,99    5,51   |  vs liberado 64/48 · vs retorno 80/73
    liberado    #0F6E78   5,39    5,96   |  vs entregue 36/38 · vs retorno 22/34
    retorno     #4A1E5C  11,64   12,80   |  vs entregue 26/22
    entregue    #2F4A9C   7,36    8,14   |

    liberado/retorno a 22 é o par mais fraco e não há quinta cor que resolva:
    sob deuteranopia sobram o eixo azul-amarelo e a luminosidade, e `chamado`
    já ocupa o lado quente. É exatamente onde o ícone (porta vs. U) e a faixa
    (dupla vs. pontilhada grossa) carregam a distinção.
  */
  --estado-aguardando: #6F675F;
  --estado-chamado: #B5441C;
  --estado-liberado: #0F6E78;
  --estado-retorno: #4A1E5C;
  --estado-entregue: #2F4A9C;

  /*
    Restrição não é estado: é interrupção. Vinho escuro, longe da terracota em
    luminosidade (o vermelho anterior colapsava com ela sob deuteranopia).
    8,2 papel / 9,05 cartão.
  */
  --alerta: #8B1E2D;

  /*
    Desabilitado com par próprio, NUNCA opacity: opacity compunha texto e fundo
    contra a página e caía a 2,12. Este par dá 8,66 — "Aguardando no portão" é
    o que confirma à professora que ela já fez a parte dela.
  */
  --apagado-fundo: #E4DED3;
  --apagado-tinta: #3D3833;

  /* ---------- tipografia ---------- */

  /*
    Dois extremos no mesmo sistema: nome lido a metros na sala e rótulo de 12px
    na portaria. Degraus com papel, não com número bonito.

    O nome no painel é ESTRUTURA: Instrument Sans 700, 64px, entrelinha 0,98,
    tracking 0. Custo zero de bytes — a variável já cobre 700. Tracking 0 e não
    negativo: em 700 as hastes colidem; não positivo: isso é para condensadas.

    Fraunces fica onde estava — nome da escola e título de caixa. O subset de 44
    glifos não escreve nome de criança e expandi-lo custaria ~25 KB do teto.
  */
  --fonte-ui: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --fonte-voz: 'Fraunces', Georgia, 'Times New Roman', serif;

  --t-etiqueta: 0.75rem;       /* 12  caixa alta, +0.08em, 600 — seção, grupo, rodapé */
  --t-detalhe: 0.875rem;       /* 14  turma, cronômetro, dica */
  --t-corpo: 1rem;             /* 16  padrão, botão */
  --t-nome: 1.125rem;          /* 18  nome na linha, 600 */
  --t-titulo: 1.25rem;         /* 20  Fraunces 600 — título de tela e de caixa */
  --t-numero: 1.5rem;          /* 24  placar da importação; turma no painel */
  --t-estado-painel: 1.375rem; /* 22  etiqueta, faixa e botão do painel */
  --t-painel: 4rem;            /* 64  nome da criança no painel, 700, 0,98 */

  --linha-apertada: 0.98;
  --linha-titulo: 1.2;
  --linha-corpo: 1.5;

  --tracking-etiqueta: 0.08em;
  --tracking-nome: -0.005em;
  --tracking-titulo: -0.01em;

  /* ---------- medidas ---------- */

  /* Base 4: 4 8 12 16 20 24 32 48 64. */
  --e-1: 4px; --e-2: 8px; --e-3: 12px; --e-4: 16px; --e-5: 20px;
  --e-6: 24px; --e-8: 32px; --e-12: 48px; --e-16: 64px;

  /*
    Dois raios, e a regra: 8 para o que se toca ou é pequeno (botão, campo,
    linha, retrato pequeno); 12 para o que contém (cartão, caixa). Nada
    redondo: a pílula morreu com a etiqueta.
  */
  --canto: 8px;
  --canto-g: 12px;

  /* 44px é o nível AAA (WCAG 2.5.5). Vale para TODO controle, não só botão. */
  --toque-min: 44px;

  /* Retrato reservado e vazio. Mesma caixa que recebe a foto de matrícula. */
  --retrato-linha: 44px;
  --retrato-painel: 112px;

  /* ---------- movimento ---------- */

  /*
    Discreto: um cartão que chega na sala tem que ser percebido sem roubar a
    aula. Nada de bounce, nada de scale. O som já é o alarme; o movimento só
    diz onde olhar.
  */
  --dur-toque: 120ms;
  --dur-base: 180ms;
  --dur-entrada: 320ms;
  --dur-faixa: 240ms;
  --curva: cubic-bezier(0.2, 0, 0, 1);
  --transicao: var(--dur-base) var(--curva);

  /* ---------- apelidos do Pátio anterior (apagar quando ninguém mais usar) ---------- */
  --fundo: var(--papel);
  --superficie: var(--cartao);
  --superficie-2: var(--destaque);
  --borda: var(--linha);
  --borda-forte: var(--linha-forte);
  --tinta-media: var(--tinta-2);
  --tinta-fraca: var(--tinta-2);
  --marca: var(--acao);
  --marca-escura: var(--acao-pressionada);
  --marca-clara: var(--destaque);
  --marca-borda: var(--linha-forte);
  --alerta-fundo: var(--destaque);
  --chamado-tinta: var(--estado-chamado);
  --liberado-tinta: var(--estado-liberado);
}

/* ---------- base ---------- */

* { box-sizing: border-box; }

/*
  `hidden` tem que ganhar de qualquer `display`. O atributo esconde pela folha
  do navegador, a de menor prioridade; qualquer `display` nosso vencia e a
  faixa de aviso ficou como uma barra vazia atravessada na tela.
*/
[hidden] { display: none !important; }

.fora-da-tela {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--papel);
  color: var(--tinta);
  font-family: var(--fonte-ui);
  font-size: var(--t-corpo);
  line-height: var(--linha-corpo);
  -webkit-font-smoothing: antialiased;
}

ul { list-style: none; padding: 0; margin: 0; }

/* ---------- cabeçalho: papel, não verde ---------- */

/*
  Embrulha em vez de empurrar: em 320px o glifo, o nome da escola e os
  controles de som não cabem numa linha, e o bloco da direita desce inteiro.
*/
.cabecalho {
  background: var(--papel);
  color: var(--tinta);
  padding: var(--e-3) var(--e-4);
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--e-2) var(--e-3);
  border-bottom: 1px solid var(--linha);
}

/* O glifo de janela é o único verde fora do botão: traço, 24px, marca. */
.cabecalho .marca-glifo {
  width: 24px; height: 24px; flex: none; position: relative;
  border: 2px solid var(--acao); border-radius: 3px;
}
.cabecalho .marca-glifo::before,
.cabecalho .marca-glifo::after { content: ''; position: absolute; background: var(--acao); }
.cabecalho .marca-glifo::before { left: 50%; top: 2px; bottom: 2px; width: 2px; transform: translateX(-50%); }
.cabecalho .marca-glifo::after { top: 50%; left: 2px; right: 2px; height: 2px; transform: translateY(-50%); }

.cabecalho .titulo {
  font-family: var(--fonte-voz);
  font-size: var(--t-titulo);
  font-weight: 600;
  letter-spacing: var(--tracking-titulo);
  line-height: var(--linha-titulo);
  margin: 0;
}
.cabecalho .subtitulo { font-size: var(--t-detalhe); color: var(--tinta-2); margin: 0; line-height: 1.3; }
.cabecalho .direita { margin-left: auto; display: flex; align-items: center; gap: var(--e-2); }

/* ---------- faixa de chamada (a manchete da sala) ---------- */

/*
  O único lugar em que uma cor de estado vira FUNDO. A professora levanta os
  olhos por um segundo: a barra terracota cheia com texto branco (5,51) é o
  que ela vê. Não é decoração; é o sinal.
*/
.faixa {
  background: var(--estado-chamado);
  color: var(--tinta-clara);
  padding: var(--e-3) var(--e-4);
  font-size: var(--t-corpo);
  font-weight: 600;
  margin: 0;
  animation: faixa-entra var(--dur-faixa) var(--curva);
}

/*
  Aviso de som interrompido: luminância, não matiz. Barra escura com texto
  claro, que não empresta a cor de nenhum estado e salta em qualquer simulação
  de daltonismo. É <button> porque reativar áudio exige gesto.
*/
.faixa.aviso {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  border-radius: 0;
  background: var(--tinta);
  color: var(--tinta-clara);
  font-size: var(--t-corpo);
  font-weight: 600;
  padding: var(--e-3) var(--e-4);
  cursor: pointer;
}

/* Recusa do servidor: não é estado de aluno, é o sistema dizendo que não fez. */
.faixa.recusa {
  background: var(--cartao);
  color: var(--alerta);
  border-bottom: 2px solid var(--alerta);
}

@keyframes faixa-entra { from { opacity: 0; } to { opacity: 1; } }
@keyframes cartao-entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- tipografia aplicada ---------- */

/* Fraunces SÓ aqui: título de tela, nome da escola, título de caixa. A fonte
   foi recortada aos glifos que estas frases escrevem. */
.titulo,
.entrada h2,
.porta h2,
dialog h2 {
  font-family: var(--fonte-voz);
  font-weight: 600;
  line-height: var(--linha-titulo);
  letter-spacing: var(--tracking-titulo);
}

/* Etiqueta de seção: caixa alta pede respiro entre letras. */
.secao,
.grupo,
.entrada label,
.porta label,
summary {
  font-size: var(--t-etiqueta);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: var(--tracking-etiqueta);
  color: var(--tinta-2);
}

/* Números que mudam sozinhos alinham por baixo e não empurram o texto ao lado. */
.contagem,
.contagem-secao,
.espera,
.placar .valor,
.grupo .quantos,
.secao .quantos { font-variant-numeric: tabular-nums; }

/* ---------- etiqueta de estado: ícone + rótulo, sem caixa ---------- */

.etiqueta {
  display: inline-flex;
  align-items: center;
  gap: 0.4em;
  max-width: 100%;
  font-size: var(--t-detalhe);
  font-weight: 600;
  color: var(--tinta-2);
}
.etiqueta svg {
  width: 1.15em; height: 1.15em; flex: none;
  fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
}
.etiqueta[data-estado='aguardando'] { color: var(--estado-aguardando); }
.etiqueta[data-estado='chamado']    { color: var(--estado-chamado); }
.etiqueta[data-estado='liberado']   { color: var(--estado-liberado); }
.etiqueta[data-estado='retorno']    { color: var(--estado-retorno); }
.etiqueta[data-estado='entregue']   { color: var(--estado-entregue); }

/* ---------- cartão do aluno ---------- */

/*
  Uma linha larga, não uma coluna. O painel é lido do meio da sala: retrato à
  esquerda, nome como estrutura no centro, estado e ação à direita. Em tela
  estreita (oficina no celular) as três colunas viram pilha.
*/
.cartao {
  background: var(--cartao);
  border: 1px solid var(--linha);
  border-radius: var(--canto-g);
  padding: var(--e-4);
  display: grid;
  grid-template-columns: var(--retrato-linha) minmax(0, 1fr);
  gap: var(--e-3) var(--e-4);
  align-items: center;
  animation: cartao-entra var(--dur-entrada) var(--curva);
}

.cartao .foto {
  width: var(--retrato-linha);
  height: var(--retrato-linha);
  border-radius: var(--canto);
  overflow: hidden;
  background: var(--destaque);
  border: 1px solid var(--linha);
  flex: none;
}

/*
  A foto que ainda não existe. O espaço fica reservado — mesma caixa — para o
  dia em que a escola subir as fotos de matrícula não mexer em layout nenhum.
  Vazio DIGNO: contorno tracejado na tinta fraca, sem inicial, sem avatar.
*/
.foto[data-sem-foto] {
  border: 1.5px dashed var(--tinta-3);
  background: transparent;
}

.cartao .foto img,
.cartao .foto svg { width: 100%; height: 100%; display: block; object-fit: cover; }

.cartao .nome {
  font-size: var(--t-nome);
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: var(--tracking-nome);
  margin: 0;
  /* Só age quando uma palavra sozinha não cabe na linha; nunca antes. */
  overflow-wrap: break-word;
}
.cartao .turma { font-size: var(--t-detalhe); color: var(--tinta-2); margin: 0; }
.cartao .lugar-etiqueta { grid-column: 1 / -1; }
.cartao > button, .cartao .razoes { grid-column: 1 / -1; }

/* ---------- linha compacta (listas da portaria) ---------- */

/*
  Duas linhas internas de propósito: retrato + nome em cima; etiqueta + ação
  embaixo. Um nome longo nunca disputa espaço com o botão, e o botão nunca
  encolhe — encolher um botão chamado "Entregar" é pior que descê-lo.
*/
.linha {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--e-2) var(--e-3);
  padding: var(--e-3) var(--e-3) var(--e-3) var(--e-4);
  background: var(--cartao);
  border: 1px solid var(--linha);
  border-radius: var(--canto);
  margin-bottom: var(--e-2);
}

.linha > button,
.linha .duasAcoes,
.linha > .etiqueta { margin-left: auto; flex: none; }
.linha > .etiqueta { margin-left: 0; }

.linha .foto {
  width: var(--retrato-linha);
  height: var(--retrato-linha);
  border-radius: 6px;
  overflow: hidden;
  background: var(--destaque);
  border: 1px solid var(--linha);
  flex: none;
}
.linha .foto img,
.linha .foto svg { width: 100%; height: 100%; display: block; object-fit: cover; }

.linha .nome {
  flex: 1 1 8rem;
  min-width: 0;
  font-size: var(--t-nome);
  font-weight: 600;
  letter-spacing: var(--tracking-nome);
  line-height: 1.25;
}

.linha .detalhe {
  display: block;
  font-size: var(--t-detalhe);
  font-weight: 400;
  color: var(--tinta-2);
  letter-spacing: 0;
}
.linha .espera:not(:empty)::before { content: ' · '; }

/* Quebra forçada: etiqueta e ação sempre na segunda linha. */
.linha .quebra { flex-basis: 100%; height: 0; margin: 0; }

/* ---------- faixa lateral de estado ---------- */

/*
  O quarto canal. Cada estado tem um DESENHO próprio de traço, que sobrevive a
  qualquer simulação porque não depende de cor:

    aguardando  3px pontilhado  — traço fino e interrompido, o estado quieto
    chamado     6px sólido      — a barra cheia, o único que pede ação agora
    liberado    6px duplo       — duas barras, "passou por duas mãos"
    retorno     6px pontilhado  — pontilhado grosso, distinto do aguardando
                                  pela espessura
    entregue    6px tracejado   — traço largo e interrompido, ciclo fechado

  Fica DEPOIS de .cartao e .linha: as duas declaram `border` no atalho, e o
  atalho reescreve border-left-width. O teste de regressão lê estilo e
  espessura em longhand, então longhand fica.
*/
.cartao,
.linha {
  border-left-width: 6px;
  border-left-style: solid;
  border-left-color: var(--linha);
}

.cartao[data-estado='aguardando'],
.linha[data-estado='aguardando'] {
  border-left-color: var(--estado-aguardando);
  border-left-style: dotted;
  border-left-width: 3px;
}
.cartao[data-estado='chamado'],
.linha[data-estado='chamado'] {
  border-left-color: var(--estado-chamado);
  border-left-style: solid;
}
.cartao[data-estado='liberado'],
.linha[data-estado='liberado'] {
  border-left-color: var(--estado-liberado);
  border-left-style: double;
}
.cartao[data-estado='entregue'],
.linha[data-estado='entregue'] {
  border-left-color: var(--estado-entregue);
  border-left-style: dashed;
}
.cartao[data-estado='retorno'],
.linha[data-estado='retorno'] {
  border-left-color: var(--estado-retorno);
  border-left-style: dotted;
}

/* ---------- variante Painel ---------- */

/*
  A sala não é um app de celular: é um painel. Os TOKENS são os mesmos; muda só
  a escala. O nome vira estrutura: 64px, 700, entrelinha 0,98.
*/
.painel .cabecalho { padding: var(--e-4) var(--e-6); }
.painel .cabecalho .marca-glifo { width: 28px; height: 28px; }
.painel .cabecalho .subtitulo {
  font-size: var(--t-numero);
  font-weight: 600;
  color: var(--tinta);
  line-height: var(--linha-titulo);
}

.painel .faixa {
  font-size: var(--t-estado-painel);
  padding: var(--e-4) var(--e-6);
  line-height: var(--linha-titulo);
}

.painel .cartao {
  grid-template-columns: var(--retrato-painel) minmax(0, 1fr) minmax(280px, 320px);
  gap: var(--e-6);
  padding: var(--e-5) var(--e-6);
}
.painel .cartao .foto { width: var(--retrato-painel); height: var(--retrato-painel); }
.painel .cartao .nome {
  font-size: var(--t-painel);
  font-weight: 700;
  line-height: var(--linha-apertada);
  letter-spacing: 0;
  margin-bottom: var(--e-2);
  text-wrap: balance;
}
.painel .cartao .turma { font-size: var(--t-numero); }

/* Coluna da direita: etiqueta em cima, botão embaixo, volta por último. */
.painel .cartao .lugar-etiqueta,
.painel .cartao > button,
.painel .cartao .razoes { grid-column: 3; }
.painel .cartao .lugar-etiqueta { display: flex; justify-content: flex-end; }
.painel .cartao .etiqueta { font-size: var(--t-estado-painel); }
.painel .cartao > button { min-height: 56px; font-size: var(--t-nome); width: 100%; }

/* Em painel estreito (tablet em pé) a coluna da direita desce para baixo do nome. */
@media (max-width: 900px) {
  .painel .cartao { grid-template-columns: var(--retrato-painel) minmax(0, 1fr); }
  .painel .cartao .lugar-etiqueta,
  .painel .cartao > button,
  .painel .cartao .razoes { grid-column: 1 / -1; }
  .painel .cartao .lugar-etiqueta { justify-content: flex-start; }
  .painel .cartao .nome { font-size: 2.75rem; }
}

/*
  Em celular (320–480px) a coluna do nome ao lado do retrato de 112px fica com
  menos de 100px: "Magalhães" em 44px mede 227px e vazava a página inteira.
  Aqui o retrato sobe e o nome ocupa a largura toda. É mecanismo de caber, não
  escolha de estilo — o tamanho volta ao do painel assim que houver espaço.
*/
@media (max-width: 480px) {
  .painel .cartao { grid-template-columns: minmax(0, 1fr); }
  .painel .cartao .nome { font-size: 2.25rem; }
}

/* ---------- motivo do retorno (sala) ---------- */

/*
  Lista fechada em ALVOS, não em <select>: a professora compara e toca, não
  navega. Quatro opções em grade de dois, cada uma com 56px de altura.
*/
.razoes {
  border-top: 1px solid var(--linha);
  padding-top: var(--e-4);
  margin-top: var(--e-2);
  display: flex;
  flex-direction: column;
  gap: var(--e-3);
}
.razoes .pergunta { margin: 0; font-size: var(--t-nome); font-weight: 600; }
/*
  minmax(0, 1fr), e não 1fr: `1fr` sozinho é minmax(auto, 1fr), e o "auto"
  deixa "Não saiu com o responsável" ditar a largura mínima da coluna — em
  320px a grade media 302px num cartão de 218 e empurrava a página inteira
  para 356px. Em celular a grade vira uma coluna só: quatro alvos empilhados.
*/
.razoes .opcoes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--e-2); }
@media (max-width: 480px) {
  .razoes .opcoes { grid-template-columns: minmax(0, 1fr); }
}
.razoes .opcao {
  display: flex; align-items: center; gap: var(--e-2);
  min-height: 56px; padding: var(--e-2) var(--e-3);
  border: 1px solid var(--linha-forte); border-radius: var(--canto);
  font-size: var(--t-corpo); font-weight: 600; cursor: pointer;
}
.razoes .opcao input { width: 20px; height: 20px; min-height: 0; margin: 0; accent-color: var(--acao); flex: none; }
.razoes .opcao:has(input:checked) { border: 2px solid var(--acao); background: var(--papel); }
.razoes .botoes { display: flex; gap: var(--e-2); }
.razoes .botoes button { flex: 1; }
.painel .razoes .opcao { font-size: var(--t-nome); }

/* ---------- caixas: entrega e restrição ---------- */

/*
  Sem sombra também aqui: o escurecimento do fundo já separa a caixa da tela.
  Uma borda hairline e o raio de contêiner bastam.
*/
.entrega,
.restricao {
  border: 1px solid var(--linha);
  border-radius: var(--canto-g);

<script>

/* ===== web/comum/estados.js ===== */
/*
  A mesma maquina de estados de src/estados.ts, em JavaScript, para o modo
  demo funcionar sem servidor.

  As duas copias tem que mudar juntas — e agora existe teste cobrando isso
  (`src/paridade.test.ts`), porque "tem que" escrito num comentario nao para
  ninguem. Com a copia atrasada, a demonstracao na frente da escola mostra um
  produto diferente do que sera entregue, ou o botao lanca TransicaoInvalida ao
  vivo.

  MAPA usa Object.create(null) pelo mesmo motivo do original: com objeto
  literal comum, MAPA['aguardando']['constructor'] resolve na cadeia de
  prototipo, devolve a funcao Object (truthy) e atravessa a maquina inteira.
*/

const ACOES = ['chamar', 'liberar', 'entregar', 'cancelar', 'retornar', 'encerrar']

const DONO = {
  chamar: 'portaria',
  liberar: 'sala',
  entregar: 'portaria',
  cancelar: 'portaria',
  retornar: 'sala',
  encerrar: 'portaria',
}

/*
  As razoes do retorno. Codigos, nao frases — o rotulo que a tela mostra pode
  ser renomeado sem reescrever o passado.
*/
const RAZOES_RETORNO = [
  'esqueceu-material',
  'nao-saiu-com-o-responsavel',
  'a-escola-reteve',
  'outro',
]

function ehRazaoRetorno(valor) {
  return typeof valor === 'string' && RAZOES_RETORNO.includes(valor)
}

function ehAcao(valor) {
  return typeof valor === 'string' && ACOES.includes(valor)
}

class TransicaoInvalida extends Error {
  constructor(de, acao) {
    super(`nao e possivel "${acao}" a partir de "${de}"`)
    this.name = 'TransicaoInvalida'
    this.de = de
    this.acao = acao
  }
}

class AcaoNaoPermitida extends Error {
  constructor(acao, papel) {
    super(`"${acao}" e da ${DONO[acao]}, nao da ${papel}`)
    this.name = 'AcaoNaoPermitida'
    this.acao = acao
    this.papel = papel
  }
}

const MAPA = Object.assign(Object.create(null), {
  aguardando: Object.assign(Object.create(null), { chamar: 'chamado' }),
  chamado: Object.assign(Object.create(null), { liberar: 'liberado', cancelar: 'aguardando' }),
  liberado: Object.assign(Object.create(null), { entregar: 'entregue', retornar: 'retorno' }),
  retorno: Object.assign(Object.create(null), { chamar: 'chamado', encerrar: 'aguardando' }),
})

function proximo(de, acao) {
  if (!ehAcao(acao)) throw new TransicaoInvalida(de, acao)
  const destino = MAPA[de]?.[acao]
  if (typeof destino !== 'string') throw new TransicaoInvalida(de, acao)
  return destino
}

function exigirDono(acao, papel) {
  if (!ehAcao(acao)) throw new TransicaoInvalida('aguardando', acao)
  if (DONO[acao] !== papel) throw new AcaoNaoPermitida(acao, papel)
}


/* ===== web/comum/cartao.js ===== */

/*
  Os dois formatos em que um aluno aparece.

  Nada aqui usa innerHTML com o nome: nome vem de planilha colada pela
  secretaria, e interpolar isso em template transforma um nome com marcacao em
  codigo executando na tela. textContent nao interpreta marcacao.

  REGRA DOS ESTADOS. Nenhum estado se apresenta so por cor. Cada um traz
  quatro canais ao mesmo tempo:

    cor      — token --estado-*, todos medidos contra as superficies
    rotulo   — texto em portugues corrido, nunca jargao
    icone    — silhueta distinta a 24px, para quem nao distingue matiz
    faixa    — desenho proprio do traco lateral (o CSS cuida, via data-estado)

  O componente monta o conjunto. A tela nao escolhe partes dele — foi assim
  que `aguardando` acabou sem rotulo nenhum, comunicado apenas pela AUSENCIA
  da etiqueta.
*/

const ROTULO = {
  aguardando: 'aguardando',
  chamado: 'responsável chegou',
  liberado: 'liberado',
  entregue: 'entregue',
  retorno: 'retornou à sala',
}

/*
  Icones desenhados a mao, em SVG inline. Sem biblioteca e sem CDN.

  Cada silhueta diz o que o estado E, nao o que ele parece:
    aguardando  relogio          — o estado quieto, em aula
    chamado     sino             — alguem chegou
    liberado    porta com seta   — a crianca SAIU da sala (antes era um check,
                                   e check e "concluido"; concluido e entregue)
    retorno     seta em U        — voltou
    entregue    check duplo      — passou por duas maos, ciclo fechado
*/
const ICONE = {
  aguardando: ['M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z', 'M12 7v5l3 2'],
  chamado: ['M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7', 'M13.7 21a2 2 0 0 1-3.4 0'],
  liberado: ['M4 3h9v18H4z', 'M15 12h6M18 9l3 3-3 3'],
  retorno: ['M20 20v-6a4 4 0 0 0-4-4H4', 'M8 6 4 10l4 4'],
  entregue: ['M2.5 12.5l5 5L18 7', 'M11 17.5l1 1L22 8'],
}

const NS = 'http://www.w3.org/2000/svg'

function icone(estado) {
  const tracos = ICONE[estado]
  if (!tracos) return null
  const svg = document.createElementNS(NS, 'svg')
  svg.setAttribute('viewBox', '0 0 24 24')
  svg.setAttribute('aria-hidden', 'true')
  for (const d of tracos) {
    const caminho = document.createElementNS(NS, 'path')
    caminho.setAttribute('d', d)
    svg.append(caminho)
  }
  return svg
}

/*
  O lugar da foto, vazio ate a escola trazer as fotos de matricula.

  O ESPACO CONTINUA RESERVADO: um lugar vazio hoje e a mesma caixa que recebe
  a foto amanha. Vazio digno — contorno tracejado, sem inicial, sem avatar.
  `aria-hidden`: e decoracao ate ter conteudo.
*/
function foto(_nome, classe) {
  const caixa = document.createElement('div')
  caixa.className = classe
  caixa.dataset.semFoto = 'sim'
  caixa.setAttribute('aria-hidden', 'true')
  return caixa
}

/** Etiqueta completa: icone + rotulo + cor, os tres sempre juntos. Sem caixa. */
function etiquetaDe(texto, estado) {
  const span = document.createElement('span')
  span.className = 'etiqueta'
  if (estado) {
    span.dataset.estado = estado
    const glifo = icone(estado)
    if (glifo) span.append(glifo)
  }
  span.append(document.createTextNode(texto))
  return span
}

function etiquetaDoEstado(estado) {
  const texto = ROTULO[estado]
  if (!texto) return null
  return etiquetaDe(texto, estado)
}

/**
 * Cartao. Na sala (variante .painel) e uma linha larga: retrato, nome como
 * estrutura, estado e acao a direita. Fora do painel vira compacto.
 */
function criarCartao({ nome, turma }) {
  const raiz = document.createElement('article')
  raiz.className = 'cartao'
  raiz.dataset.estado = 'aguardando'

  const nomeEl = document.createElement('p')
  nomeEl.className = 'nome'
  nomeEl.textContent = nome

  const turmaEl = document.createElement('p')
  turmaEl.className = 'turma'
  turmaEl.textContent = turma

  const textos = document.createElement('div')
  textos.append(nomeEl, turmaEl)

  const lugarDaEtiqueta = document.createElement('div')
  lugarDaEtiqueta.className = 'lugar-etiqueta'

  raiz.append(foto(nome, 'foto'), textos, lugarDaEtiqueta)

  raiz.definirEstado = (estado) => {
    raiz.dataset.estado = estado
    lugarDaEtiqueta.replaceChildren()
    const etiqueta = etiquetaDoEstado(estado)
    if (etiqueta) lugarDaEtiqueta.append(etiqueta)
  }
  raiz.definirEstado('aguardando')

  raiz.acrescentar = (no) => {
    raiz.append(no)
    return raiz
  }

  return raiz
}

/**
 * Linha compacta. E o que a portaria percorre com o polegar, no celular.
 *
 * Duas linhas internas: retrato + nome em cima; etiqueta + acao embaixo.
 * A quebra e um elemento de propósito (flex-basis: 100%): um nome longo nunca
 * disputa espaco com o botao, e o botao nunca encolhe.
 */
function criarLinha({ nome, turma, estado }) {
  const raiz = document.createElement('li')
  raiz.className = 'linha'
  if (estado) raiz.dataset.estado = estado

  const bloco = document.createElement('div')
  bloco.className = 'nome'
  bloco.append(document.createTextNode(nome))

  const detalhe = document.createElement('span')
  detalhe.className = 'detalhe'

  const turmaEl = document.createElement('span')
  turmaEl.className = 'turma-da-linha'
  turmaEl.textContent = turma

  const espera = document.createElement('span')
  espera.className = 'espera'

  detalhe.append(turmaEl, espera)
  bloco.append(detalhe)

  raiz.append(foto(nome, 'foto'), bloco)

  const etiqueta = estado ? etiquetaDoEstado(estado) : null
  if (etiqueta) {
    const quebra = document.createElement('span')
    quebra.className = 'quebra'
    quebra.setAttribute('aria-hidden', 'true')
    raiz.append(quebra, etiqueta)
  }

  return raiz
}


/* ===== web/comum/som.js ===== */
/*
  Som sintetizado. Nenhum arquivo de audio no repositorio: funciona offline
  e nao pesa.

  O navegador nao toca audio antes do primeiro gesto do usuario. Por isso
  destravar() precisa ser chamado de dentro de um clique — senao a primeira
  chamada da apresentacao sai muda, que e exatamente o momento que precisa
  funcionar.

  E DEPOIS DO PRIMEIRO GESTO O CONTEXTO PODE SUSPENDER DE NOVO. Aba em segundo
  plano, chamada telefonica, tela bloqueada, economia de bateria: o sistema
  suspende, e a versao anterior deste arquivo so testava `!contexto`. O objeto
  continuava existindo, entao tocarAbertura() executava inteira, agendava as
  notas num contexto parado, e nao saia som — sem nada na tela dizendo isso.
  A professora ficava esperando um aviso que nunca vinha, com o responsavel
  parado no portao.

  Este modulo nao toca no DOM: quem quiser avisar registra um retorno em
  `aoFalharSom`. Assim ele continua servindo a sala, a portaria e a demo, que
  desenham o aviso cada uma do seu jeito.
*/

const CHAVE_MUDO = 'janelinhas:mudo'
const CHAVE_VOLUME = 'janelinhas:volume'

/*
  Tres degraus, nao um controle continuo.

  Quem mexe nisto e uma professora de pe, com a turma esperando, num tablet.
  Tres alvos grandes acertam de primeira; um cursor deslizante exige mira e
  produz "quase inaudivel" por engano — que e a mesma falha que o mudo, so que
  sem nada na tela dizendo.
*/
const VOLUMES = { baixo: 0.45, medio: 1, alto: 1.8 }
const VOLUME_PADRAO = 'medio'

let contexto = null
let mudo = mudoGuardado()
let volume = volumeGuardado()
let avisar = () => {}

/*
  localStorage lanca excecao em aba anonima com armazenamento bloqueado, e o
  padrao de falha aqui e SOM LIGADO: um app que emudece sozinho por causa de
  uma configuracao de privacidade e pior que um que fala demais.
*/
function mudoGuardado() {
  try {
    return localStorage.getItem(CHAVE_MUDO) === 'sim'
  } catch {
    return false
  }
}

function guardarMudo(valor) {
  try {
    localStorage.setItem(CHAVE_MUDO, valor ? 'sim' : 'nao')
  } catch {
    /* sem armazenamento: vale so para esta sessao */
  }
}

function volumeGuardado() {
  try {
    const v = localStorage.getItem(CHAVE_VOLUME)
    // Valida contra os degraus conhecidos: valor adulterado ou de uma versao
    // antiga viraria NaN no ganho, e o oscilador falha em silencio.
    return v && v in VOLUMES ? v : VOLUME_PADRAO
  } catch {
    return VOLUME_PADRAO
  }
}

/** Devolve os degraus disponiveis, na ordem, para a tela montar o controle. */
function degraus() {
  return Object.keys(VOLUMES)
}

function volumeAtual() {
  return volume
}

function definirVolume(degrau) {
  if (!(degrau in VOLUMES)) return volume
  volume = degrau
  try {
    localStorage.setItem(CHAVE_VOLUME, degrau)
  } catch {
    /* sem armazenamento: vale so para esta sessao */
  }
  return volume
}

/** Aplica o degrau escolhido ao ganho base de cada toque. */
function volumeDe(base) {
  return base * (VOLUMES[volume] ?? 1)
}

/**
 * Registra quem recebe o aviso de que o som nao saiu.
 * Chamado com uma mensagem quando falha, e com null quando volta a funcionar.
 */
function aoFalharSom(retorno) {
  avisar = typeof retorno === 'function' ? retorno : () => {}
}

const AVISO_SUSPENSO = 'O som foi interrompido pelo aparelho. Toque aqui para reativar.'

function destravar() {
  if (!contexto) {
    const Contexto = window.AudioContext || window.webkitAudioContext
    if (!Contexto) {
      avisar('Este navegador não toca som.')
      return
    }
    contexto = new Contexto()
    /*
      A unica notificacao CONFIAVEL de que o contexto voltou.

      Ver o comentario de acordar(): a promessa do resume() nao serve para
      saber quando ele volta, porque ela pode nunca resolver. O statechange
      dispara de verdade quando o navegador libera o audio — inclusive quando
      a liberacao vem de um gesto em outro lugar da tela, que a promessa
      daquela chamada especifica jamais veria.
    */
    contexto.onstatechange = () => {
      avisar(contexto.state === 'running' ? null : AVISO_SUSPENSO)
    }
  }
  acordar()
}

/*
  Tenta acordar o contexto e RESPONDE NA HORA se ele nao estiver rodando.

  A primeira versao disto fazia `contexto.resume().then(conferir, avisar)`, o
  que parecia certo e nao era: no Chrome, resume() num contexto sem ativacao do
  usuario devolve uma promessa que fica PENDENTE — nao resolve nem rejeita, e
  espera indefinidamente por um gesto. Nenhum dos dois ramos rodava, nenhum
  aviso aparecia, e a tela ficava exatamente tao calada quanto antes da
  correcao. A verificacao em `ferramentas/telas.mjs` pegou isso.

  Por isso o estado e lido de forma sincrona e o aviso sai imediatamente. O
  resume continua sendo tentado, e quem desfaz o aviso e o onstatechange.

  Devolve se o som pode sair agora.
*/
function acordar() {
  if (!contexto) return false
  if (contexto.state === 'running') {
    avisar(null)
    return true
  }
  avisar(AVISO_SUSPENSO)
  try {
    contexto.resume().catch(() => {})
  } catch {
    /* alguns navegadores lancam em vez de rejeitar */
  }
  return false
}

function estaMudo() {
  return mudo
}

function alternarMudo() {
  mudo = !mudo
  guardarMudo(mudo)
  /*
    Silenciar tem que apagar o aviso de som interrompido.

    Sem isto a tela ficava dizendo "toque aqui para reativar" depois de a
    professora ter desligado o som de proposito — o app insistindo em consertar
    algo que ela acabou de escolher. E ao religar o aviso volta se o problema
    ainda existir, em vez de ela achar que voltou e nao voltar.
  */
  if (mudo) avisar(null)
  else acordar()
  return mudo
}

function nota(frequencia, atraso, duracao, volume) {
  const comeco = contexto.currentTime + atraso
  const osc = contexto.createOscillator()
  const ganho = contexto.createGain()
  osc.type = 'triangle'
  osc.frequency.setValueAtTime(frequencia, comeco)
  ganho.gain.setValueAtTime(0.0001, comeco)
  ganho.gain.exponentialRampToValueAtTime(volume, comeco + 0.025)
  ganho.gain.exponentialRampToValueAtTime(0.0001, comeco + duracao)
  osc.connect(ganho).connect(contexto.destination)
  osc.start(comeco)
  osc.stop(comeco + duracao + 0.05)
}

/*
  Toca, ou diz por que nao tocou.

  Nao ha caminho em que esta funcao termine sem som E sem aviso — era isso que
  acontecia antes, quando a guarda era `if (mudo || !contexto) return`: depois
  do primeiro gesto o objeto existe para sempre, entao a guarda passava, as
  notas eram agendadas num contexto parado, e a sala ficava muda sem sinal.

  Quando o contexto nao esta rodando as notas NAO sao agendadas para depois:
  `nota()` marca o comeco a partir de `currentTime`, que num contexto parado
  nao anda, e um toque que sai tres minutos atrasado chama a professora para
  uma crianca que ja saiu. Melhor o aviso na tela.
*/
function tocar(notas) {
  if (mudo) return
  if (!contexto) {
    avisar('O som ainda não foi ligado nesta tela. Toque aqui para ligar.')
    return
  }
  if (!acordar()) return
  for (const n of notas) nota(...n)
}

/*
  Os dois toques, e por que sao estes.

  Faixa util numa sala com criancas falando: 600 Hz a 2 kHz. Abaixo disso o som
  se perde no ruido de fundo de vinte vozes; acima fica estridente e cansa quem
  ouve dezenas de vezes por tarde. A versao anterior punha a entrega em 392 Hz e
  0,16 s — grave demais para atravessar a sala, e tao curta que se confundia com
  um estalo do proprio tablet.

  Fundamental + quinta justa, sempre. E o intervalo que soa resolvido sem soar
  melodia: nao vira musiquinha que a turma imita, e nao vira alarme. E, por ser
  consonante, duas chamadas quase simultaneas nao produzem batimento aspero.

    abertura  E5 659,25 + B5 987,77   sobe: alguem chegou
    entrega   B5 987,77 + E5 659,25   desce: fechou

  As duas usam as MESMAS duas notas, em ordem trocada. A sala aprende um par de
  sons, nao quatro, e a direcao carrega o significado.

  Duracao total entre 250 ms e 1 s: menos que isso nao registra com barulho de
  fundo, mais que isso ainda esta tocando quando a professora ja olhou.
*/
const ABERTURA = [
  [659.25, 0, 0.32],
  [987.77, 0.14, 0.42],
]

const ENTREGA = [
  [987.77, 0, 0.2],
  [659.25, 0.1, 0.3],
]

/** Duas notas subindo. Alguem chegou no portao. */
function tocarAbertura() {
  tocar(ABERTURA.map(([f, a, d]) => [f, a, d, volumeDe(0.16)]))
}

/** As mesmas duas notas, descendo. O ciclo fechou. */
function tocarEntrega() {
  tocar(ENTREGA.map(([f, a, d]) => [f, a, d, volumeDe(0.12)]))
}

/* ===== web/demo/index.html ===== */



    const TURMA = '4º ano'
    const ALUNOS = [
      { id: 'd1', nome: 'Maria Cecília Rocha', turma: TURMA },
      { id: 'd2', nome: 'Anthony Peçanha', turma: TURMA },
      { id: 'd3', nome: 'Isabela Furtado', turma: TURMA },
      { id: 'd4', nome: 'Lorenzo Sampaio', turma: TURMA },
      { id: 'd5', nome: "Maria Sant'Ana", turma: TURMA },
      { id: 'd6', nome: 'Ravi Bacelar', turma: TURMA },
    ]

    const chamadas = new Map()
    const cartoes = new Map()
    let relogio = 0

    function aplicar(alunoId, acao, papel) {
      const aluno = ALUNOS.find((a) => a.id === alunoId)
      const anterior = chamadas.get(alunoId)
      exigirDono(acao, papel)
      const de = anterior?.estado ?? 'aguardando'
      const para = proximo(de, acao)
      relogio++
      if (para === 'aguardando' || para === 'entregue') chamadas.delete(alunoId)
      else
        chamadas.set(alunoId, {
          ...aluno,
          alunoId,
          estado: para,
          desde: anterior?.desde ?? relogio,
          em: relogio,
        })
      desenhar()
    }

    function botao(texto, principal, aoTocar) {
      const b = document.createElement('button')
      b.textContent = texto
      if (principal) b.className = 'principal'
      b.onclick = () => {
        destravar()
        aoTocar()
      }
      return b
    }

    function desenhar() {
      const ativas = [...chamadas.values()].sort((a, b) => a.desde - b.desde)

      const ul = document.getElementById('ativas')
      ul.innerHTML = ''
      document.getElementById('nenhuma').hidden = ativas.length > 0
      for (const c of ativas) {
        const li = criarLinha({ nome: c.nome, turma: c.turma, estado: c.estado })
        if (c.estado === 'chamado') {
          li.append(botao('Cancelar', false, () => aplicar(c.alunoId, 'cancelar', 'portaria')))
        }
        if (c.estado === 'liberado') {
          li.append(botao('Entregar', true, () => aplicar(c.alunoId, 'entregar', 'portaria')))
        }
        ul.append(li)
      }

      desenharCadastro()

      const grade = document.getElementById('grade')
      const presentes = new Set(ativas.map((c) => c.alunoId))
      for (const [id, cartao] of cartoes) {
        if (!presentes.has(id)) {
          cartao.remove()
          cartoes.delete(id)
        }
      }

      for (const c of ativas) {
        let cartao = cartoes.get(c.alunoId)
        if (!cartao) {
          cartao = criarCartao({ nome: c.nome, turma: c.turma })
          const liberar = botao('Liberar saída', true, () =>
            aplicar(c.alunoId, 'liberar', 'sala'),
          )
          cartao.acrescentar(liberar)
          cartao.__botao = liberar
          cartao.__estado = null
          cartoes.set(c.alunoId, cartao)
          grade.append(cartao)
          tocarAbertura()
        }
        if (c.estado !== cartao.__estado) {
          cartao.definirEstado(c.estado)
          if (c.estado === 'liberado') tocarEntrega()
          cartao.__estado = c.estado
        }
        cartao.__botao.disabled = c.estado === 'liberado'
        cartao.__botao.textContent =
          c.estado === 'liberado' ? 'Aguardando no portão' : 'Liberar saída'
      }

      document.getElementById('vazio').hidden = ativas.length > 0
    }

    function desenharCadastro() {
      const cadastro = document.getElementById('cadastro')
      cadastro.innerHTML = ''
      for (const aluno of ALUNOS) {
        const li = criarLinha({ nome: aluno.nome, turma: aluno.turma })
        if (chamadas.has(aluno.id)) li.append(etiquetaDe('em saída'))
        else li.append(botao('Chamar', true, () => aplicar(aluno.id, 'chamar', 'portaria')))
        cadastro.append(li)
      }
    }

    desenhar()
