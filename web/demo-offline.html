<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo offline — Janelinhas do Saber</title>
<style>
/*
  Janelinhas do Saber — a linguagem visual.

  O nome da escola e a mecanica: cada crianca e uma janelinha de moldura de
  madeira. Fechada, os vidros sao foscos e ninguem ve quem esta atras. Chamada,
  os batentes giram para fora e revelam o retrato.

  As cores marcadas com --_todo dependem da marca real da escola, que nao
  conhecemos: conteudo/institucional/ ainda e todo TODO(visita).
*/

:root {
  --moldura: #a85f18;
  --moldura-clara: #c98338;
  --moldura-escura: #6f3d0c;
  --peitoril: #8a4d13;

  --vidro: #dce9f3;
  --vidro-fundo: #eef5fa;
  --vidro-fosco: #c0cfda;

  --entregue: #2f7d55;
  --entregue-claro: #d8ece1;
  --aviso: #a3521f;

  --tinta: #2c1e11;
  --tinta-suave: #6f5943;
  --papel: #fdf8f0;
  --papel-fundo: #f6ecdd;

  --abertura: 380ms;
  --curva: cubic-bezier(0.34, 1.16, 0.64, 1);
  --canto: 10px;

  --_todo-marca-primaria: var(--moldura);
  --_todo-marca-secundaria: var(--vidro);
}

/* ---------- a janelinha ---------- */

.janelinha {
  width: 100%;
  text-align: center;
}

.caixilho {
  position: relative;
  aspect-ratio: 1;
  border: 12px solid var(--moldura);
  border-bottom-width: 16px;
  border-radius: 6px;
  background: var(--vidro-fundo);
  overflow: hidden;
  perspective: 900px;
  box-shadow: inset 0 0 0 2px var(--moldura-escura);
}

.retrato {
  position: absolute;
  inset: 2%;
  display: grid;
  place-items: center;
}

.retrato svg {
  width: 100%;
  height: 100%;
}

/* os dois batentes que giram para fora */
.batente {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 50%;
  background: var(--vidro-fosco);
  border: 5px solid var(--moldura-clara);
  box-sizing: border-box;
  display: grid;
  grid-template-rows: 1fr 1fr;
  gap: 5px;
  padding: 5px;
  transition: transform var(--abertura) var(--curva);
  backface-visibility: hidden;
}

.batente span {
  background: var(--vidro);
  border-radius: 3px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
}

.esquerdo {
  left: 0;
  transform-origin: left center;
}

.direito {
  right: 0;
  transform-origin: right center;
}

/*
  Aberta: os batentes giram para DENTRO do vao, afastando-se do observador.

  O sinal importa. Girando para fora (sinal oposto), a perspectiva aproxima a
  borda livre do observador e infla o batente ate ele ocupar um terco do vao,
  espremendo a crianca no meio. Verificado no navegador.

  88 graus, e nao 90: a 90 o batente some por completo e a janela deixa de
  parecer uma janela. A lasca que sobra e o que da a leitura de profundidade.
*/
.janelinha[data-estado='chamado'] .esquerdo,
.janelinha[data-estado='liberado'] .esquerdo,
.janelinha[data-estado='entregue'] .esquerdo {
  transform: rotateY(88deg);
}

.janelinha[data-estado='chamado'] .direito,
.janelinha[data-estado='liberado'] .direito,
.janelinha[data-estado='entregue'] .direito {
  transform: rotateY(-88deg);
}

/* liberada: a moldura confirma que a professora ja autorizou */
.janelinha[data-estado='liberado'] .caixilho {
  border-color: var(--entregue);
  box-shadow: inset 0 0 0 2px #1e5c3c;
}

.janelinha[data-estado='entregue'] .caixilho {
  border-color: var(--entregue);
  opacity: 0.55;
}

.nome {
  font-weight: 600;
  color: var(--tinta);
  margin: 0.7rem 0 0;
  line-height: 1.2;
}

.turma {
  color: var(--tinta-suave);
  margin: 0.15rem 0 0;
  font-size: 0.9rem;
}

.selo {
  display: inline-block;
  margin-top: 0.4rem;
  padding: 0.15rem 0.6rem;
  border-radius: 999px;
  font-size: 0.78rem;
  background: var(--entregue-claro);
  color: #1e5c3c;
}

@media (prefers-reduced-motion: reduce) {
  .batente {
    transition: none;
  }
}


    body {
      margin: 0; min-height: 100vh; background: var(--papel); color: var(--tinta);
      font-family: system-ui, -apple-system, sans-serif;
      display: grid; grid-template-columns: 1fr 1fr;
    }
    section { padding: 1.5rem 1.4rem 2.5rem; }
    section + section { border-left: 3px dashed var(--vidro-fosco); background: var(--papel-fundo); }
    h1 {
      font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--tinta-suave); margin: 0 0 0.2rem;
    }
    .sub { font-size: 0.8rem; color: var(--tinta-suave); margin: 0 0 1.2rem; }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex; align-items: center; gap: 0.7rem; padding: 0.5rem 0.1rem;
      border-bottom: 1px solid var(--vidro-fosco);
    }
    .moldurinha {
      width: 40px; height: 40px; flex: none; border: 3px solid var(--moldura);
      border-radius: 4px; overflow: hidden; background: var(--vidro-fundo);
    }
    .moldurinha svg { width: 100%; height: 100%; display: block; }
    .nome { flex: 1; font-size: 0.92rem; line-height: 1.3; }
    .detalhe { font-size: 0.76rem; color: var(--tinta-suave); }
    button {
      font: inherit; font-size: 0.88rem; padding: 0.35rem 0.75rem; border-radius: 7px;
      border: 2px solid var(--moldura); background: var(--papel);
      color: var(--tinta); cursor: pointer; flex: none;
    }
    button:hover { background: var(--papel-fundo); }
    button.principal { background: var(--moldura); color: #fff; border-color: var(--moldura-escura); }
    .palco { display: grid; place-items: center; min-height: 62vh; text-align: center; }
    .palco > div { width: min(84%, 300px); }
    .vazio { color: var(--tinta-suave); }
    .liberar {
      background: var(--moldura); color: #fff; border-color: var(--moldura-escura);
      width: 100%; margin-top: 1rem; padding: 0.75rem; font-size: 1rem;
    }
    .semrede {
      position: fixed; bottom: 0.8rem; right: 1rem; font-size: 0.76rem;
      color: var(--tinta-suave); background: var(--papel); padding: 0.2rem 0.6rem;
      border-radius: 999px; border: 1px solid var(--vidro-fosco);
    }
    .fila { color: var(--tinta-suave); font-size: 0.85rem; margin: 0.7rem 0 0; }
  
</style>
</head>
<body>
<section>
    <h1>Portaria</h1>
    <p class="sub">o responsável chegou no portão</p>
    <ul id="cadastro"></ul>
    <h1 style="margin-top:1.8rem">Em saída</h1>
    <ul id="ativas"></ul>
    <p class="vazio" id="nenhuma" style="font-size:0.85rem">Ninguém em saída agora.</p>
  </section>

  <section>
    <h1>Sala — Jardim II</h1>
    <p class="sub">a professora libera</p>
    <div class="palco" id="palco"><p class="vazio">Nenhuma chamada agora.</p></div>
  </section>

  <p class="semrede">modo demo · sem rede</p>
<script>

/* ===== web/comum/estados.js ===== */
/*
  A mesma maquina de estados de src/estados.ts, em JavaScript, para o modo
  demo funcionar sem servidor. As duas copias tem que mudar juntas.

  MAPA usa Object.create(null) pelo mesmo motivo do original: com objeto
  literal comum, MAPA['aguardando']['constructor'] resolve na cadeia de
  prototipo, devolve a funcao Object (truthy) e atravessa a maquina inteira.
*/

const ACOES = ['chamar', 'liberar', 'entregar', 'cancelar']

const DONO = {
  chamar: 'portaria',
  liberar: 'sala',
  entregar: 'portaria',
  cancelar: 'portaria',
}

function ehAcao(valor) {
  return typeof valor === 'string' && ACOES.includes(valor)
}

class TransicaoInvalida extends Error {
  constructor(de, acao) {
    super(`nao e possivel "${acao}" a partir de "${de}"`)
    this.name = 'TransicaoInvalida'
    this.de = de
    this.acao = acao
  }
}

class AcaoNaoPermitida extends Error {
  constructor(acao, papel) {
    super(`"${acao}" e da ${DONO[acao]}, nao da ${papel}`)
    this.name = 'AcaoNaoPermitida'
    this.acao = acao
    this.papel = papel
  }
}

const MAPA = Object.assign(Object.create(null), {
  aguardando: Object.assign(Object.create(null), { chamar: 'chamado' }),
  chamado: Object.assign(Object.create(null), { liberar: 'liberado', cancelar: 'aguardando' }),
  liberado: Object.assign(Object.create(null), { entregar: 'entregue' }),
})

function proximo(de, acao) {
  if (!ehAcao(acao)) throw new TransicaoInvalida(de, acao)
  const destino = MAPA[de]?.[acao]
  if (typeof destino !== 'string') throw new TransicaoInvalida(de, acao)
  return destino
}

function exigirDono(acao, papel) {
  if (!ehAcao(acao)) throw new TransicaoInvalida('aguardando', acao)
  if (DONO[acao] !== papel) throw new AcaoNaoPermitida(acao, papel)
}


/* ===== web/comum/dom.js ===== */
/*
  Construcao de DOM sem innerHTML.

  Nome de crianca chega de planilha colada pela secretaria. Interpolar isso
  num template de innerHTML transforma um nome como <img src=x onerror=...>
  em codigo executando na tela da portaria. textContent nao interpreta
  marcacao — o nome aparece literal, que e o comportamento certo.

  O analisador de importacao tambem recusa < e >, mas defesa que depende de
  uma camada so e defesa que ja falhou uma vez.
*/

/** Uma linha de duas alturas: nome em cima, detalhe menor embaixo. */
function linhaDupla(principal, detalhe) {
  const caixa = document.createElement('div')
  caixa.className = 'nome'

  caixa.append(document.createTextNode(principal))
  caixa.append(document.createElement('br'))

  const span = document.createElement('span')
  span.className = 'detalhe'
  span.textContent = detalhe
  caixa.append(span)

  return caixa
}

/** Uma etiqueta com estado, para pendurar ao lado do nome. */
function marca(texto, estado) {
  const span = document.createElement('span')
  span.className = 'marca'
  if (estado) span.dataset.estado = estado
  span.textContent = texto
  return span
}


/* ===== web/comum/avatar.js ===== */
/*
  Retrato ilustrado deterministico, derivado do nome.

  Nao geramos rosto fotorrealista de crianca. Estas ilustracoes sao
  geometricas de proposito: leem como desenho, nunca como foto. Em producao,
  a escola sobe a foto que ja tem na matricula, sob o consentimento que a
  fase de conformidade definir.
*/

const PELES = ['#f6d9c0', '#eabd99', '#cd9263', '#a26a42', '#71482a']
const CABELOS = ['#2b1b12', '#4a2c1a', '#7b4b23', '#c98b3a', '#171717', '#8d5524']
const ROUPAS = ['#2f6f9f', '#2f7d55', '#a1441f', '#6a4b8f', '#b4671a', '#38799a']

function digerir(texto) {
  let h = 2166136261
  for (let i = 0; i < texto.length; i++) {
    h ^= texto.charCodeAt(i)
    h = Math.imul(h, 16777619)
  }
  return Math.abs(h)
}

const PENTEADOS = [
  // franja reta
  (c) => `<path d="M25 44a25 25 0 0 1 50 0v3q-25-12-50 0z" fill="${c}"/>`,
  // cabelo comprido dos dois lados
  (c) =>
    `<path d="M25 46a25 25 0 0 1 50 0v26q-6 4-8-2l-2-22q-15 7-30 0l-2 22q-2 6-8 2z" fill="${c}"/>`,
  // cachinhos
  (c) =>
    `<g fill="${c}"><circle cx="34" cy="27" r="9"/><circle cx="50" cy="22" r="10"/>` +
    `<circle cx="66" cy="27" r="9"/><circle cx="27" cy="38" r="8"/><circle cx="73" cy="38" r="8"/></g>`,
]

function retratoDe(nome) {
  const h = digerir(nome)
  const pele = PELES[h % PELES.length]
  const cabelo = CABELOS[Math.floor(h / 7) % CABELOS.length]
  const roupa = ROUPAS[Math.floor(h / 13) % ROUPAS.length]
  const penteado = PENTEADOS[Math.floor(h / 31) % PENTEADOS.length]
  const sardas = Math.floor(h / 53) % 3 === 0

  const ns = 'http://www.w3.org/2000/svg'
  const svg = document.createElementNS(ns, 'svg')
  svg.setAttribute('viewBox', '0 0 100 100')
  svg.setAttribute('role', 'img')
  svg.setAttribute('aria-label', `Retrato ilustrado de ${nome}`)
  svg.innerHTML = `
    <circle cx="50" cy="50" r="50" fill="${roupa}" opacity="0.14"/>
    <path d="M20 100a30 30 0 0 1 60 0z" fill="${roupa}"/>
    <path d="M42 68h16v10H42z" fill="${pele}"/>
    <circle cx="50" cy="47" r="25" fill="${pele}"/>
    ${penteado(cabelo)}
    <circle cx="41" cy="49" r="2.8" fill="#2c1e11"/>
    <circle cx="59" cy="49" r="2.8" fill="#2c1e11"/>
    <circle cx="34" cy="55" r="4" fill="#e8908a" opacity="0.45"/>
    <circle cx="66" cy="55" r="4" fill="#e8908a" opacity="0.45"/>
    ${
      sardas
        ? `<g fill="#a9724c" opacity="0.6"><circle cx="43" cy="57" r="0.9"/>` +
          `<circle cx="46" cy="59" r="0.9"/><circle cx="54" cy="59" r="0.9"/>` +
          `<circle cx="57" cy="57" r="0.9"/></g>`
        : ''
    }
    <path d="M43 60q7 6 14 0" stroke="#2c1e11" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  `
  return svg
}


/* ===== web/comum/janelinha.js ===== */

const ROTULO = {
  aguardando: '',
  chamado: 'responsável chegou',
  liberado: 'saída liberada',
  entregue: 'entregue',
}

/**
 * Cria uma janelinha. Comeca fechada: os batentes cobrem o retrato e
 * ninguem ve quem esta atras ate a crianca ser chamada.
 */
function criarJanelinha({ nome, turma }) {
  const raiz = document.createElement('div')
  raiz.className = 'janelinha'
  raiz.dataset.estado = 'aguardando'

  const caixilho = document.createElement('div')
  caixilho.className = 'caixilho'

  const retrato = document.createElement('div')
  retrato.className = 'retrato'
  retrato.append(retratoDe(nome))

  const esquerdo = document.createElement('div')
  esquerdo.className = 'batente esquerdo'
  esquerdo.innerHTML = '<span></span><span></span>'

  const direito = document.createElement('div')
  direito.className = 'batente direito'
  direito.innerHTML = '<span></span><span></span>'

  caixilho.append(retrato, esquerdo, direito)

  const rotuloNome = document.createElement('p')
  rotuloNome.className = 'nome'
  rotuloNome.textContent = nome

  const rotuloTurma = document.createElement('p')
  rotuloTurma.className = 'turma'
  rotuloTurma.textContent = turma

  const selo = document.createElement('span')
  selo.className = 'selo'
  selo.hidden = true

  raiz.append(caixilho, rotuloNome, rotuloTurma, selo)

  raiz.definirEstado = (estado) => {
    raiz.dataset.estado = estado
    const texto = ROTULO[estado] ?? ''
    selo.textContent = texto
    selo.hidden = texto === ''
  }

  return raiz
}


/* ===== web/comum/som.js ===== */
/*
  Som sintetizado. Nenhum arquivo de audio no repositorio: funciona offline
  e nao pesa.

  O navegador nao toca audio antes do primeiro gesto do usuario. Por isso
  destravar() precisa ser chamado de dentro de um clique — senao a primeira
  chamada da apresentacao sai muda, que e exatamente o momento que precisa
  funcionar.
*/

let contexto = null
let mudo = false

function destravar() {
  if (!contexto) {
    const Contexto = window.AudioContext || window.webkitAudioContext
    if (!Contexto) return
    contexto = new Contexto()
  }
  if (contexto.state === 'suspended') contexto.resume()
}

function estaMudo() {
  return mudo
}

function alternarMudo() {
  mudo = !mudo
  return mudo
}

function nota(frequencia, atraso, duracao, volume) {
  const comeco = contexto.currentTime + atraso
  const osc = contexto.createOscillator()
  const ganho = contexto.createGain()
  osc.type = 'triangle'
  osc.frequency.setValueAtTime(frequencia, comeco)
  ganho.gain.setValueAtTime(0.0001, comeco)
  ganho.gain.exponentialRampToValueAtTime(volume, comeco + 0.025)
  ganho.gain.exponentialRampToValueAtTime(0.0001, comeco + duracao)
  osc.connect(ganho).connect(contexto.destination)
  osc.start(comeco)
  osc.stop(comeco + duracao + 0.05)
}

/** Duas notas quentes, subindo. A janelinha abriu. */
function tocarAbertura() {
  if (mudo || !contexto) return
  nota(587.33, 0, 0.34, 0.16)
  nota(880.0, 0.15, 0.46, 0.13)
}

/** Toque seco e curto. O ciclo fechou. */
function tocarEntrega() {
  if (mudo || !contexto) return
  nota(392.0, 0, 0.16, 0.11)
}

/* ===== web/demo/index.html ===== */





    const ALUNOS = [
      { id: 'd1', nome: 'Thaís Gonçalves', turma: 'Jardim II' },
      { id: 'd2', nome: 'João Conceição', turma: 'Jardim II' },
      { id: 'd3', nome: 'Lara Mendonça', turma: 'Jardim II' },
      { id: 'd4', nome: 'Ravi Bacelar', turma: 'Jardim II' },
      { id: 'd5', nome: 'Íris Pacheco', turma: 'Jardim II' },
      { id: 'd6', nome: 'Théo Marçal', turma: 'Jardim II' },
    ]

    const chamadas = new Map()
    let relogio = 0
    let atual = null, ultimoId = null, ultimoEstado = null

    function aplicar(alunoId, acao, papel) {
      const aluno = ALUNOS.find((a) => a.id === alunoId)
      const anterior = chamadas.get(alunoId)
      exigirDono(acao, papel)
      const de = anterior?.estado ?? 'aguardando'
      const para = proximo(de, acao)
      relogio++
      if (para === 'aguardando' || para === 'entregue') chamadas.delete(alunoId)
      else chamadas.set(alunoId, {
        ...aluno, alunoId, estado: para,
        desde: anterior?.desde ?? relogio, em: relogio,
      })
      desenhar()
    }

    function moldurinha(nome) {
      const c = document.createElement('div')
      c.className = 'moldurinha'
      c.append(retratoDe(nome))
      return c
    }

    function botao(texto, principal, aoTocar) {
      const b = document.createElement('button')
      b.textContent = texto
      if (principal) b.className = 'principal'
      b.onclick = () => { destravar(); aoTocar() }
      return b
    }

    function desenhar() {
      const ativas = [...chamadas.values()].sort((a, b) => a.desde - b.desde)

      const ul = document.getElementById('ativas')
      ul.innerHTML = ''
      document.getElementById('nenhuma').hidden = ativas.length > 0
      for (const c of ativas) {
        const li = document.createElement('li')
        li.append(moldurinha(c.nome))
        li.append(linhaDupla(c.nome, c.estado))
        if (c.estado === 'chamado') {
          li.append(botao('Cancelar', false, () => aplicar(c.alunoId, 'cancelar', 'portaria')))
        }
        if (c.estado === 'liberado') {
          li.append(botao('Entregar', true, () => aplicar(c.alunoId, 'entregar', 'portaria')))
        }
        ul.append(li)
      }

      desenharCadastro()

      const palco = document.getElementById('palco')
      const vez = ativas[0]
      if (!vez) {
        palco.innerHTML = '<p class="vazio">Nenhuma chamada agora.</p>'
        atual = null; ultimoId = null; ultimoEstado = null
        return
      }

      if (vez.alunoId !== ultimoId) {
        ultimoId = vez.alunoId
        ultimoEstado = null
        palco.innerHTML = ''
        const caixa = document.createElement('div')
        atual = criarJanelinha({ nome: vez.nome, turma: vez.turma })
        atual.definirEstado('aguardando')
        const liberar = botao('Liberar saída', false, () => aplicar(vez.alunoId, 'liberar', 'sala'))
        liberar.className = 'liberar'
        const fila = document.createElement('p')
        fila.className = 'fila'
        caixa.append(atual, liberar, fila)
        palco.append(caixa)
      }

      if (vez.estado !== ultimoEstado) {
        requestAnimationFrame(() => atual.definirEstado(vez.estado))
        if (vez.estado === 'chamado') tocarAbertura()
        if (vez.estado === 'liberado') tocarEntrega()
        ultimoEstado = vez.estado
      }

      const liberar = palco.querySelector('.liberar')
      if (liberar) liberar.disabled = vez.estado === 'liberado'
      palco.querySelector('.fila').textContent =
        ativas.length > 1 ? `mais ${ativas.length - 1} na fila` : ''
    }

    function desenharCadastro() {
      const cadastro = document.getElementById('cadastro')
      cadastro.innerHTML = ''
      for (const aluno of ALUNOS) {
        const li = document.createElement('li')
        li.append(moldurinha(aluno.nome))
        li.append(linhaDupla(aluno.nome, aluno.turma))
        if (chamadas.has(aluno.id)) {
          const marca = document.createElement('span')
          marca.className = 'detalhe'
          marca.textContent = 'em saída'
          li.append(marca)
        } else {
          li.append(botao('Chamar', true, () => aplicar(aluno.id, 'chamar', 'portaria')))
        }
        cadastro.append(li)
      }
    }

    desenhar()
  
</script>
