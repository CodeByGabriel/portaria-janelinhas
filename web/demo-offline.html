<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo offline — Janelinhas do Saber</title>
<style>
/*
  Janelinhas do Saber — sistema visual.

  Institucional, nao lúdico. A escola vai do Pré 1 ao 9º ano: uma interface
  de madeira e vidrinho fala com o Pré e constrange o Fundamental II, e a
  professora usa isto quarenta vezes por dia. Verde institucional, cartoes
  brancos, tipografia limpa, densidade de informacao.

  O nome da escola aparece como marca, nao como textura: um glifo discreto
  de janela no cabecalho. Identidade sem fantasia.

  As cores marcadas com --_todo dependem da marca real da escola, que ainda
  nao conhecemos: conteudo/institucional/ e todo TODO(visita).
*/

:root {
  /* marca */
  --marca: #0e6b45;
  --marca-escura: #0a5436;
  --marca-clara: #e4f1ea;
  --marca-borda: #b9dcc9;

  /* superficies */
  --fundo: #f4f6f5;
  --superficie: #ffffff;
  --superficie-2: #eef1ef;
  --borda: #dfe4e1;
  --borda-forte: #c3ccc7;

  /* texto */
  --tinta: #16211c;
  --tinta-media: #4a5852;
  /*
    Era #78857f: 3,54 sobre o fundo e 3,85 sobre o cartao — reprovava o
    minimo de 4,5 do WCAG 1.4.3. Carrega a turma no cartao, o detalhe na
    linha e o aviso de truncamento da busca, entao nao e texto decorativo.
  */
  --tinta-fraca: #5f6b66;
  --tinta-clara: #ffffff;

  /*
    ESTADOS.

    Regra de uso: nenhum destes tokens aparece sozinho. Cada estado se
    apresenta por quatro canais ao mesmo tempo — cor, icone, rotulo textual e
    faixa lateral. O componente monta o conjunto (web/comum/cartao.js); a tela
    nao escolhe.

    Todos os pares foram medidos: cada cor passa 4,5 como texto sobre o fundo
    e sobre o cartao, e passa 3,0 como faixa. src/contraste.test.ts trava isso.
  */
  --estado-aguardando: #736c67;
  --estado-chamado: #c2410c;
  --estado-liberado: #15803d;
  --estado-entregue: #1d4ed8;
  --estado-retorno: #86198f;

  --estado-aguardando-fundo: #f7f6f5;
  --estado-chamado-fundo: #fef6e9;
  --estado-liberado-fundo: #f2f9f5;
  --estado-entregue-fundo: #e7edfc;
  --estado-retorno-fundo: #f8e9f8;

  --alerta: #a4302a;
  --alerta-fundo: #fbeceb;

  /* Botao desabilitado: par proprio, nunca opacity. Ver a regra la embaixo. */
  --apagado-fundo: #dfe4e1;
  --apagado-tinta: #3f4b45;

  /* nomes antigos, mantidos para nao quebrar telas que ainda os usam */
  --chamado-fundo: var(--estado-chamado-fundo);
  --chamado-borda: #f0d4a3;
  --chamado-tinta: var(--estado-chamado);
  --liberado-fundo: var(--estado-liberado-fundo);
  --liberado-borda: var(--marca-borda);
  --liberado-tinta: var(--estado-liberado);

  /* medidas */
  --canto: 8px;
  --canto-g: 12px;
  /*
    Alvo de toque. 44px e o nivel AAA (WCAG 2.5.5), acima do minimo AA de 24.
    A baseline mediu 6 de 9 acoes primarias em 40,1px, e o summary da
    importacao em 18,7 — abaixo ate do minimo AA.
  */
  --toque-min: 44px;
  --transicao: 180ms cubic-bezier(0.2, 0, 0.2, 1);
  --sombra: 0 1px 2px rgba(22, 33, 28, 0.06), 0 1px 3px rgba(22, 33, 28, 0.04);
  --sombra-alta: 0 2px 4px rgba(22, 33, 28, 0.08), 0 4px 12px rgba(22, 33, 28, 0.06);

  --_todo-marca-primaria: var(--marca);
}

/* ---------- base ---------- */

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--fundo);
  color: var(--tinta);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ---------- cabecalho institucional ---------- */

.cabecalho {
  background: var(--marca);
  color: var(--tinta-clara);
  padding: 0.85rem 1.15rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.cabecalho .marca-glifo {
  width: 26px;
  height: 26px;
  flex: none;
  border: 2px solid currentColor;
  border-radius: 3px;
  position: relative;
  opacity: 0.95;
}

.cabecalho .marca-glifo::before,
.cabecalho .marca-glifo::after {
  content: '';
  position: absolute;
  background: currentColor;
}

.cabecalho .marca-glifo::before {
  left: 50%;
  top: 2px;
  bottom: 2px;
  width: 2px;
  transform: translateX(-50%);
}

.cabecalho .marca-glifo::after {
  top: 50%;
  left: 2px;
  right: 2px;
  height: 2px;
  transform: translateY(-50%);
}

.cabecalho .titulo {
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  margin: 0;
  line-height: 1.25;
}

.cabecalho .subtitulo {
  font-size: 0.8rem;
  opacity: 0.82;
  margin: 0;
  line-height: 1.3;
}

.cabecalho .direita {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

/* ---------- faixa de chamada (a manchete da sala) ---------- */

.faixa {
  background: var(--chamado-fundo);
  border-bottom: 1px solid var(--chamado-borda);
  color: var(--chamado-tinta);
  padding: 0.7rem 1.15rem;
  font-size: 0.95rem;
  font-weight: 500;
}

/*
  Aviso de som interrompido.

  E um <button> porque reativar audio exige gesto do usuario: um aviso que so
  informasse deixaria a professora sabendo do problema e sem o que fazer. Mas
  ocupa a largura toda como faixa, e nao parece um botao de acao comum, porque
  nao e uma escolha dela — e o aparelho avisando que falhou.

  Se destaca por LUMINANCIA, nao por matiz: barra escura com texto claro, entre
  faixas palidas. Nao empresta a cor de nenhum estado de aluno — `chamado` fica
  logo acima e ficariam iguais; `retorno` chega na Fase 1 e o significado dele
  e outro. E, por ser inversao e nao cor, continua saltando em qualquer
  simulacao de daltonismo.

  Herda de `button` o min-height de 44px, entao ja nasce dentro do alvo AAA.
*/
.faixa.aviso {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  border-radius: 0;
  background: var(--tinta);
  color: var(--tinta-clara);
  font-size: 0.95rem;
  font-weight: 600;
  padding: 0.7rem 1.15rem;
  cursor: pointer;
}

/* ---------- cartao do aluno ---------- */

.cartao {
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-radius: var(--canto-g);
  padding: 1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 0.7rem;
  box-shadow: var(--sombra);
  transition: box-shadow var(--transicao), border-color var(--transicao);
}

.cartao .foto {
  width: 96px;
  height: 96px;
  border-radius: var(--canto);
  overflow: hidden;
  background: var(--superficie-2);
  border: 1px solid var(--borda);
  flex: none;
}

.cartao .foto svg { width: 100%; height: 100%; display: block; }

.cartao .nome {
  font-size: 1.02rem;
  font-weight: 600;
  line-height: 1.25;
  margin: 0;
}

.cartao .turma {
  font-size: 0.85rem;
  color: var(--tinta-fraca);
  margin: 0;
}

/* ---------- linha compacta (listas da portaria) ---------- */

.linha {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  padding: 0.7rem 0.9rem;
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-radius: var(--canto);
  margin-bottom: 0.5rem;
}

.linha .foto {
  width: 44px;
  height: 44px;
  border-radius: 6px;
  overflow: hidden;
  background: var(--superficie-2);
  border: 1px solid var(--borda);
  flex: none;
}

.linha .foto svg { width: 100%; height: 100%; display: block; }

.linha .nome {
  flex: 1;
  min-width: 0;
  font-weight: 500;
  line-height: 1.3;
}

.linha .detalhe {
  display: block;
  font-size: 0.8rem;
  font-weight: 400;
  color: var(--tinta-fraca);
}


/* ---------- faixa lateral de estado ---------- */

/*
  O quarto canal, junto de cor, icone e rotulo.

  A primeira versao deste bloco so trocava a COR da faixa, e o comentario
  afirmava que quem nao distingue matiz ainda leria a posicao e a espessura.
  Era falso: as cinco faixas tinham a mesma posicao e a mesma espessura. A
  captura em `docs/prints/fase-0/deuteranopia/sala.png` mostra o resultado —
  a faixa verde de `liberado` e a terracota de `chamado` viram o mesmo oliva,
  lado a lado, e a faixa nao separa nada. Nao era um quarto canal; era o
  primeiro canal desenhado maior.

  Agora cada estado tem um DESENHO proprio de traco, que sobrevive a qualquer
  simulacao porque nao depende de cor nenhuma:

    aguardando  3px pontilhado  — traco fino e interrompido, o estado quieto
    chamado     6px solido      — a barra cheia, o unico que pede acao agora
    liberado    6px duplo       — duas barras, "passou por duas maos"
    entregue    6px tracejado   — traco largo e interrompido, ciclo fechado
    retorno     6px pontilhado  — pontilhado grosso, distinto do aguardando
                                  pela espessura

  A cor continua ali por cima, e continua util para quem a enxerga: a faixa
  usa a cor cheia do estado, que passa 3:1 como nao-texto, contra 1,43 da
  borda de 1px que existia antes.

  Fica DEPOIS de .cartao e .linha de proposito: as duas declaram `border` no
  atalho, e o atalho reescreve border-left-width. Colocado antes, este bloco
  era silenciosamente anulado.
*/
.cartao,
.linha {
  border-left-width: 6px;
  border-left-style: solid;
  border-left-color: var(--borda);
}

.cartao[data-estado='aguardando'],
.linha[data-estado='aguardando'] {
  border-left-color: var(--estado-aguardando);
  border-left-style: dotted;
  border-left-width: 3px;
}
.cartao[data-estado='chamado'],
.linha[data-estado='chamado'] {
  border-left-color: var(--estado-chamado);
  border-left-style: solid;
}
.cartao[data-estado='liberado'],
.linha[data-estado='liberado'] {
  border-left-color: var(--estado-liberado);
  border-left-style: double;
}
.cartao[data-estado='entregue'],
.linha[data-estado='entregue'] {
  border-left-color: var(--estado-entregue);
  border-left-style: dashed;
}
.cartao[data-estado='retorno'],
.linha[data-estado='retorno'] {
  border-left-color: var(--estado-retorno);
  border-left-style: dotted;
}

/* ---------- etiqueta de estado ---------- */


.etiqueta {
  display: inline-block;
  padding: 0.13rem 0.55rem;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.01em;
  background: var(--superficie-2);
  color: var(--tinta-media);
  border: 1px solid var(--borda);
  white-space: nowrap;
}

.etiqueta[data-estado='aguardando'] {
  background: var(--estado-aguardando-fundo);
  color: var(--estado-aguardando);
  border-color: var(--estado-aguardando);
}

.etiqueta[data-estado='chamado'] {
  background: var(--estado-chamado-fundo);
  color: var(--estado-chamado);
  border-color: var(--estado-chamado);
}

.etiqueta[data-estado='liberado'] {
  background: var(--estado-liberado-fundo);
  color: var(--estado-liberado);
  border-color: var(--estado-liberado);
}

.etiqueta[data-estado='entregue'] {
  background: var(--estado-entregue-fundo);
  color: var(--estado-entregue);
  border-color: var(--estado-entregue);
}

.etiqueta[data-estado='retorno'] {
  background: var(--estado-retorno-fundo);
  color: var(--estado-retorno);
  border-color: var(--estado-retorno);
}

/* O icone vive dentro da etiqueta e herda a cor do estado. */
.etiqueta svg {
  width: 0.95em;
  height: 0.95em;
  vertical-align: -0.15em;
  margin-right: 0.3em;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---------- controles ---------- */

button {
  font: inherit;
  font-size: 0.92rem;
  font-weight: 500;
  min-height: var(--toque-min);
  padding: 0.5rem 0.9rem;
  border-radius: var(--canto);
  border: 1px solid var(--borda-forte);
  background: var(--superficie);
  color: var(--tinta);
  cursor: pointer;
  transition: background var(--transicao), border-color var(--transicao);
}

button:hover:not(:disabled) { background: var(--superficie-2); }
button:active:not(:disabled) { transform: translateY(1px); }

button.principal {
  background: var(--marca);
  border-color: var(--marca-escura);
  color: var(--tinta-clara);
}

button.principal:hover:not(:disabled) { background: var(--marca-escura); }

button.larga { width: 100%; padding: 0.7rem; font-size: 1rem; }

button.fantasma {
  background: transparent;
  border-color: transparent;
  color: inherit;
}

button.fantasma:hover:not(:disabled) { background: rgba(255, 255, 255, 0.14); }

/*
  Desabilitado com par proprio, NUNCA com opacity.

  A versao anterior usava opacity: 0.45 no elemento inteiro, o que compunha
  texto E fundo contra a pagina e derrubava o contraste para 2,12 — menos da
  metade do minimo. E era justamente o estado "Aguardando no portao", o que
  confirma a professora que ela ja fez a parte dela.

  Fica DEPOIS de .principal e .fantasma de proposito. Colocado antes, tinha a
  mesma especificidade que elas e perdia por ordem: o botao desabilitado
  continuava verde-cheio na tela, e o teste de tokens nao pegava porque ele
  mede as cores declaradas, nao qual regra vence a cascata. Quem pegou foi
  olhar o print.
*/
button:disabled,
button.principal:disabled,
button.fantasma:disabled,
button.larga:disabled {
  background: var(--apagado-fundo);
  color: var(--apagado-tinta);
  border-color: var(--borda-forte);
  cursor: default;
}

input[type='text'],
input:not([type]),
select,
textarea {
  font: inherit;
  width: 100%;
  padding: 0.65rem 0.8rem;
  border-radius: var(--canto);
  border: 1px solid var(--borda-forte);
  background: var(--superficie);
  color: var(--tinta);
}

input:focus,
select:focus,
textarea:focus {
  outline: 2px solid var(--marca);
  outline-offset: -1px;
  border-color: var(--marca);
}

/* ---------- estrutura ---------- */

.conteudo { padding: 1.15rem; max-width: 560px; margin: 0 auto; }

.secao {
  font-size: 0.78rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--tinta-fraca);
  margin: 1.6rem 0 0.6rem;
}

.secao:first-of-type { margin-top: 0; }

.vazio {
  color: var(--tinta-fraca);
  font-size: 0.92rem;
  padding: 0.8rem 0;
}

.grade {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 0.9rem;
}

.rede {
  font-size: 0.78rem;
  color: var(--tinta-fraca);
}

.rede[data-rede='desligado'] { color: var(--alerta); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}


    .colunas { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100vh - 58px); }
    .coluna { padding: 1.15rem; }
    .coluna + .coluna { border-left: 1px solid var(--borda); background: #fafbfa; }
    .rotulo {
      font-size: 0.78rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--tinta-fraca); margin: 0 0 0.15rem;
    }
    .explica { font-size: 0.85rem; color: var(--tinta-media); margin: 0 0 1rem; }
    ul { list-style: none; padding: 0; margin: 0; }
    .grade { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .cartao button { width: 100%; }
    .selo {
      position: fixed; bottom: 0.9rem; right: 1rem; font-size: 0.75rem;
      color: var(--tinta-fraca); background: var(--superficie);
      border: 1px solid var(--borda); border-radius: 999px; padding: 0.2rem 0.7rem;
    }
  
</style>
</head>
<body>
<header class="cabecalho">
    <span class="marca-glifo" aria-hidden="true"></span>
    <div>
      <p class="titulo">Janelinhas do Saber</p>
      <p class="subtitulo">Demonstração — portaria e sala lado a lado</p>
    </div>
  </header>

  <div class="colunas">
    <section class="coluna">
      <p class="rotulo">Portaria</p>
      <p class="explica">O responsável chegou no portão.</p>
      <ul id="cadastro"></ul>

      <p class="secao">Em saída</p>
      <ul id="ativas"></ul>
      <p class="vazio" id="nenhuma">Ninguém em saída agora.</p>
    </section>

    <section class="coluna">
      <p class="rotulo">Sala — 4º ano</p>
      <p class="explica">A professora confirma a saída.</p>
      <p class="vazio" id="vazio">Nenhuma chamada agora.</p>
      <div class="grade" id="grade"></div>
    </section>
  </div>

  <p class="selo">modo demonstração · sem rede</p>
<script>

/* ===== web/comum/estados.js ===== */
/*
  A mesma maquina de estados de src/estados.ts, em JavaScript, para o modo
  demo funcionar sem servidor. As duas copias tem que mudar juntas.

  MAPA usa Object.create(null) pelo mesmo motivo do original: com objeto
  literal comum, MAPA['aguardando']['constructor'] resolve na cadeia de
  prototipo, devolve a funcao Object (truthy) e atravessa a maquina inteira.
*/

const ACOES = ['chamar', 'liberar', 'entregar', 'cancelar']

const DONO = {
  chamar: 'portaria',
  liberar: 'sala',
  entregar: 'portaria',
  cancelar: 'portaria',
}

function ehAcao(valor) {
  return typeof valor === 'string' && ACOES.includes(valor)
}

class TransicaoInvalida extends Error {
  constructor(de, acao) {
    super(`nao e possivel "${acao}" a partir de "${de}"`)
    this.name = 'TransicaoInvalida'
    this.de = de
    this.acao = acao
  }
}

class AcaoNaoPermitida extends Error {
  constructor(acao, papel) {
    super(`"${acao}" e da ${DONO[acao]}, nao da ${papel}`)
    this.name = 'AcaoNaoPermitida'
    this.acao = acao
    this.papel = papel
  }
}

const MAPA = Object.assign(Object.create(null), {
  aguardando: Object.assign(Object.create(null), { chamar: 'chamado' }),
  chamado: Object.assign(Object.create(null), { liberar: 'liberado', cancelar: 'aguardando' }),
  liberado: Object.assign(Object.create(null), { entregar: 'entregue' }),
})

function proximo(de, acao) {
  if (!ehAcao(acao)) throw new TransicaoInvalida(de, acao)
  const destino = MAPA[de]?.[acao]
  if (typeof destino !== 'string') throw new TransicaoInvalida(de, acao)
  return destino
}

function exigirDono(acao, papel) {
  if (!ehAcao(acao)) throw new TransicaoInvalida('aguardando', acao)
  if (DONO[acao] !== papel) throw new AcaoNaoPermitida(acao, papel)
}


/* ===== web/comum/avatar.js ===== */
/*
  Retrato ilustrado deterministico, derivado do nome.

  Nao geramos rosto fotorrealista de aluno. Estas ilustracoes sao planas e
  geometricas de proposito: leem como marcador de posicao de um sistema, nao
  como foto nem como desenho infantil. A escola vai do Pré 1 ao 9º ano, e um
  bonequinho de bochecha rosada constrange um aluno de 14 anos.

  Em producao, a escola sobe a foto que ja tem na matricula, sob o
  consentimento que a fase de conformidade definir.
*/

const PELES = ['#f0d5be', '#e2b591', '#c58d63', '#9c6b45', '#6d4830']
const CABELOS = ['#2a211c', '#4b3524', '#7a5636', '#a8763f', '#1a1a1a', '#8d6a4f']
const FUNDOS = ['#e7eeea', '#e9ecef', '#eceae4', '#e6edf1', '#eeeaef']

function digerir(texto) {
  let h = 2166136261
  for (let i = 0; i < texto.length; i++) {
    h ^= texto.charCodeAt(i)
    h = Math.imul(h, 16777619)
  }
  return Math.abs(h)
}

/** Tres silhuetas de cabelo. Sem franja fofa, sem cachinho: forma, nao personagem. */
const CABECAS = [
  (c) => `<path d="M27 45a23 23 0 0 1 46 0v4H27z" fill="${c}"/>`,
  (c) =>
    `<path d="M27 47a23 23 0 0 1 46 0v22q-5 3-6-2l-1-19q-16 6-32 0l-1 19q-1 5-6 2z" fill="${c}"/>`,
  (c) => `<path d="M28 44a22 22 0 0 1 44 0v3q-22-9-44 0z" fill="${c}"/>`,
]

function retratoDe(nome) {
  const h = digerir(nome)
  const pele = PELES[h % PELES.length]
  const cabelo = CABELOS[Math.floor(h / 7) % CABELOS.length]
  const fundo = FUNDOS[Math.floor(h / 13) % FUNDOS.length]
  const cabeca = CABECAS[Math.floor(h / 31) % CABECAS.length]

  const ns = 'http://www.w3.org/2000/svg'
  const svg = document.createElementNS(ns, 'svg')
  svg.setAttribute('viewBox', '0 0 100 100')
  svg.setAttribute('role', 'img')
  svg.setAttribute('aria-label', `Retrato ilustrado de ${nome}`)

  /*
    innerHTML aqui e seguro e precisa continuar sendo: TUDO que entra no
    template vem das constantes acima (PELES, CABELOS, FUNDOS, CABECAS).
    O nome do aluno — unico dado que vem de fora — entra por setAttribute,
    que nao interpreta marcacao.

    Se algum dia um valor de fora precisar entrar neste SVG, ele NAO vem por
    aqui: monte o no com createElementNS.
  */
  svg.innerHTML = `
    <rect width="100" height="100" fill="${fundo}"/>
    <path d="M18 100a32 26 0 0 1 64 0z" fill="#5a6b63"/>
    <path d="M43 70h14v9H43z" fill="${pele}"/>
    <ellipse cx="50" cy="48" rx="22" ry="24" fill="${pele}"/>
    ${cabeca(cabelo)}
    <circle cx="42" cy="50" r="2.4" fill="#222b27"/>
    <circle cx="58" cy="50" r="2.4" fill="#222b27"/>
    <path d="M44 60q6 4 12 0" stroke="#222b27" stroke-width="2" fill="none" stroke-linecap="round"/>
  `
  return svg
}


/* ===== web/comum/cartao.js ===== */

/*
  Os dois formatos em que um aluno aparece.

  Nada aqui usa innerHTML com o nome: nome vem de planilha colada pela
  secretaria, e interpolar isso em template transforma um nome com marcacao em
  codigo executando na tela. textContent nao interpreta marcacao.

  REGRA DOS ESTADOS. Nenhum estado se apresenta so por cor. Cada um traz
  quatro canais ao mesmo tempo:

    cor      — token --estado-*, todos medidos contra as superficies
    rotulo   — texto em portugues corrido, nunca jargao
    icone    — forma distinta, para quem nao distingue matiz
    faixa    — posicao e espessura na lateral (o CSS cuida, via data-estado)

  O componente monta o conjunto. A tela nao escolhe partes dele — foi assim
  que `aguardando` acabou sem rotulo nenhum, comunicado apenas pela AUSENCIA
  da etiqueta.
*/

const ROTULO = {
  aguardando: 'aguardando',
  chamado: 'responsável chegou',
  liberado: 'liberado',
  entregue: 'entregue',
  retorno: 'retornou à sala',
}

/*
  Icones desenhados a mao, em SVG inline.

  Sem biblioteca e sem CDN: o app tem que subir com o cabo da escola
  desconectado, e uma fonte de icone remota seria a unica dependencia externa
  do projeto inteiro. Cada glifo e um punhado de tracos num viewBox de 24.
*/
const ICONE = {
  aguardando: ['M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z', 'M12 7v5l3 2'],
  chamado: ['M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7', 'M13.7 21a2 2 0 0 1-3.4 0'],
  liberado: ['M20 6 9 17l-5-5'],
  entregue: ['M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8', 'M17 16l4-4-4-4', 'M21 12H10'],
  retorno: ['M9 14 4 9l5-5', 'M4 9h11a5 5 0 0 1 0 10h-4'],
}

const NS = 'http://www.w3.org/2000/svg'

function icone(estado) {
  const tracos = ICONE[estado]
  if (!tracos) return null
  const svg = document.createElementNS(NS, 'svg')
  svg.setAttribute('viewBox', '0 0 24 24')
  svg.setAttribute('aria-hidden', 'true')
  for (const d of tracos) {
    const caminho = document.createElementNS(NS, 'path')
    caminho.setAttribute('d', d)
    svg.append(caminho)
  }
  return svg
}

function foto(nome, classe) {
  const caixa = document.createElement('div')
  caixa.className = classe
  caixa.append(retratoDe(nome))
  return caixa
}

/** Etiqueta completa: icone + rotulo + cor, os tres sempre juntos. */
function etiquetaDe(texto, estado) {
  const span = document.createElement('span')
  span.className = 'etiqueta'
  if (estado) {
    span.dataset.estado = estado
    const glifo = icone(estado)
    if (glifo) span.append(glifo)
  }
  span.append(document.createTextNode(texto))
  return span
}

/** Monta a etiqueta a partir do estado, com o rotulo que lhe pertence. */
function etiquetaDoEstado(estado) {
  const texto = ROTULO[estado]
  if (!texto) return null
  return etiquetaDe(texto, estado)
}

/**
 * Cartao grande. E o que a professora ve do fundo da sala: rosto grande,
 * nome legivel, estado inequivoco.
 */
function criarCartao({ nome, turma }) {
  const raiz = document.createElement('article')
  raiz.className = 'cartao'
  raiz.dataset.estado = 'aguardando'

  const nomeEl = document.createElement('p')
  nomeEl.className = 'nome'
  nomeEl.textContent = nome

  const turmaEl = document.createElement('p')
  turmaEl.className = 'turma'
  turmaEl.textContent = turma

  const textos = document.createElement('div')
  textos.append(nomeEl, turmaEl)

  const lugarDaEtiqueta = document.createElement('div')
  lugarDaEtiqueta.className = 'lugar-etiqueta'

  raiz.append(foto(nome, 'foto'), textos, lugarDaEtiqueta)

  raiz.definirEstado = (estado) => {
    raiz.dataset.estado = estado
    lugarDaEtiqueta.replaceChildren()
    const etiqueta = etiquetaDoEstado(estado)
    if (etiqueta) lugarDaEtiqueta.append(etiqueta)
  }
  raiz.definirEstado('aguardando')

  raiz.acrescentar = (no) => {
    raiz.append(no)
    return raiz
  }

  return raiz
}

/** Linha compacta. E o que a portaria percorre com o polegar, no celular. */
function criarLinha({ nome, turma, estado }) {
  const raiz = document.createElement('li')
  raiz.className = 'linha'
  // Alimenta a faixa lateral do CSS. Sem isto a linha fica sem o quarto canal.
  if (estado) raiz.dataset.estado = estado

  const bloco = document.createElement('div')
  bloco.className = 'nome'
  bloco.append(document.createTextNode(nome))

  const detalhe = document.createElement('span')
  detalhe.className = 'detalhe'
  detalhe.textContent = turma
  bloco.append(detalhe)

  raiz.append(foto(nome, 'foto'), bloco)

  const etiqueta = estado ? etiquetaDoEstado(estado) : null
  if (etiqueta) raiz.append(etiqueta)

  return raiz
}


/* ===== web/comum/som.js ===== */
/*
  Som sintetizado. Nenhum arquivo de audio no repositorio: funciona offline
  e nao pesa.

  O navegador nao toca audio antes do primeiro gesto do usuario. Por isso
  destravar() precisa ser chamado de dentro de um clique — senao a primeira
  chamada da apresentacao sai muda, que e exatamente o momento que precisa
  funcionar.

  E DEPOIS DO PRIMEIRO GESTO O CONTEXTO PODE SUSPENDER DE NOVO. Aba em segundo
  plano, chamada telefonica, tela bloqueada, economia de bateria: o sistema
  suspende, e a versao anterior deste arquivo so testava `!contexto`. O objeto
  continuava existindo, entao tocarAbertura() executava inteira, agendava as
  notas num contexto parado, e nao saia som — sem nada na tela dizendo isso.
  A professora ficava esperando um aviso que nunca vinha, com o responsavel
  parado no portao.

  Este modulo nao toca no DOM: quem quiser avisar registra um retorno em
  `aoFalharSom`. Assim ele continua servindo a sala, a portaria e a demo, que
  desenham o aviso cada uma do seu jeito.
*/

const CHAVE_MUDO = 'janelinhas:mudo'

let contexto = null
let mudo = mudoGuardado()
let avisar = () => {}

/*
  localStorage lanca excecao em aba anonima com armazenamento bloqueado, e o
  padrao de falha aqui e SOM LIGADO: um app que emudece sozinho por causa de
  uma configuracao de privacidade e pior que um que fala demais.
*/
function mudoGuardado() {
  try {
    return localStorage.getItem(CHAVE_MUDO) === 'sim'
  } catch {
    return false
  }
}

function guardarMudo(valor) {
  try {
    localStorage.setItem(CHAVE_MUDO, valor ? 'sim' : 'nao')
  } catch {
    /* sem armazenamento: vale so para esta sessao */
  }
}

/**
 * Registra quem recebe o aviso de que o som nao saiu.
 * Chamado com uma mensagem quando falha, e com null quando volta a funcionar.
 */
function aoFalharSom(retorno) {
  avisar = typeof retorno === 'function' ? retorno : () => {}
}

const AVISO_SUSPENSO = 'O som foi interrompido pelo aparelho. Toque aqui para reativar.'

function destravar() {
  if (!contexto) {
    const Contexto = window.AudioContext || window.webkitAudioContext
    if (!Contexto) {
      avisar('Este navegador não toca som.')
      return
    }
    contexto = new Contexto()
    /*
      A unica notificacao CONFIAVEL de que o contexto voltou.

      Ver o comentario de acordar(): a promessa do resume() nao serve para
      saber quando ele volta, porque ela pode nunca resolver. O statechange
      dispara de verdade quando o navegador libera o audio — inclusive quando
      a liberacao vem de um gesto em outro lugar da tela, que a promessa
      daquela chamada especifica jamais veria.
    */
    contexto.onstatechange = () => {
      avisar(contexto.state === 'running' ? null : AVISO_SUSPENSO)
    }
  }
  acordar()
}

/*
  Tenta acordar o contexto e RESPONDE NA HORA se ele nao estiver rodando.

  A primeira versao disto fazia `contexto.resume().then(conferir, avisar)`, o
  que parecia certo e nao era: no Chrome, resume() num contexto sem ativacao do
  usuario devolve uma promessa que fica PENDENTE — nao resolve nem rejeita, e
  espera indefinidamente por um gesto. Nenhum dos dois ramos rodava, nenhum
  aviso aparecia, e a tela ficava exatamente tao calada quanto antes da
  correcao. A verificacao em `ferramentas/telas.mjs` pegou isso.

  Por isso o estado e lido de forma sincrona e o aviso sai imediatamente. O
  resume continua sendo tentado, e quem desfaz o aviso e o onstatechange.

  Devolve se o som pode sair agora.
*/
function acordar() {
  if (!contexto) return false
  if (contexto.state === 'running') {
    avisar(null)
    return true
  }
  avisar(AVISO_SUSPENSO)
  try {
    contexto.resume().catch(() => {})
  } catch {
    /* alguns navegadores lancam em vez de rejeitar */
  }
  return false
}

function estaMudo() {
  return mudo
}

function alternarMudo() {
  mudo = !mudo
  guardarMudo(mudo)
  /*
    Silenciar tem que apagar o aviso de som interrompido.

    Sem isto a tela ficava dizendo "toque aqui para reativar" depois de a
    professora ter desligado o som de proposito — o app insistindo em consertar
    algo que ela acabou de escolher. E ao religar o aviso volta se o problema
    ainda existir, em vez de ela achar que voltou e nao voltar.
  */
  if (mudo) avisar(null)
  else acordar()
  return mudo
}

function nota(frequencia, atraso, duracao, volume) {
  const comeco = contexto.currentTime + atraso
  const osc = contexto.createOscillator()
  const ganho = contexto.createGain()
  osc.type = 'triangle'
  osc.frequency.setValueAtTime(frequencia, comeco)
  ganho.gain.setValueAtTime(0.0001, comeco)
  ganho.gain.exponentialRampToValueAtTime(volume, comeco + 0.025)
  ganho.gain.exponentialRampToValueAtTime(0.0001, comeco + duracao)
  osc.connect(ganho).connect(contexto.destination)
  osc.start(comeco)
  osc.stop(comeco + duracao + 0.05)
}

/*
  Toca, ou diz por que nao tocou.

  Nao ha caminho em que esta funcao termine sem som E sem aviso — era isso que
  acontecia antes, quando a guarda era `if (mudo || !contexto) return`: depois
  do primeiro gesto o objeto existe para sempre, entao a guarda passava, as
  notas eram agendadas num contexto parado, e a sala ficava muda sem sinal.

  Quando o contexto nao esta rodando as notas NAO sao agendadas para depois:
  `nota()` marca o comeco a partir de `currentTime`, que num contexto parado
  nao anda, e um toque que sai tres minutos atrasado chama a professora para
  uma crianca que ja saiu. Melhor o aviso na tela.
*/
function tocar(notas) {
  if (mudo) return
  if (!contexto) {
    avisar('O som ainda não foi ligado nesta tela. Toque aqui para ligar.')
    return
  }
  if (!acordar()) return
  for (const n of notas) nota(...n)
}

/** Duas notas quentes, subindo. A janelinha abriu. */
function tocarAbertura() {
  tocar([
    [587.33, 0, 0.34, 0.16],
    [880.0, 0.15, 0.46, 0.13],
  ])
}

/** Toque seco e curto. O ciclo fechou. */
function tocarEntrega() {
  tocar([[392.0, 0, 0.16, 0.11]])
}

/* ===== web/demo/index.html ===== */



    const TURMA = '4º ano'
    const ALUNOS = [
      { id: 'd1', nome: 'Maria Cecília Rocha', turma: TURMA },
      { id: 'd2', nome: 'Anthony Peçanha', turma: TURMA },
      { id: 'd3', nome: 'Isabela Furtado', turma: TURMA },
      { id: 'd4', nome: 'Lorenzo Sampaio', turma: TURMA },
      { id: 'd5', nome: "Maria Sant'Ana", turma: TURMA },
      { id: 'd6', nome: 'Ravi Bacelar', turma: TURMA },
    ]

    const chamadas = new Map()
    const cartoes = new Map()
    let relogio = 0

    function aplicar(alunoId, acao, papel) {
      const aluno = ALUNOS.find((a) => a.id === alunoId)
      const anterior = chamadas.get(alunoId)
      exigirDono(acao, papel)
      const de = anterior?.estado ?? 'aguardando'
      const para = proximo(de, acao)
      relogio++
      if (para === 'aguardando' || para === 'entregue') chamadas.delete(alunoId)
      else
        chamadas.set(alunoId, {
          ...aluno,
          alunoId,
          estado: para,
          desde: anterior?.desde ?? relogio,
          em: relogio,
        })
      desenhar()
    }

    function botao(texto, principal, aoTocar) {
      const b = document.createElement('button')
      b.textContent = texto
      if (principal) b.className = 'principal'
      b.onclick = () => {
        destravar()
        aoTocar()
      }
      return b
    }

    function desenhar() {
      const ativas = [...chamadas.values()].sort((a, b) => a.desde - b.desde)

      const ul = document.getElementById('ativas')
      ul.innerHTML = ''
      document.getElementById('nenhuma').hidden = ativas.length > 0
      for (const c of ativas) {
        const li = criarLinha({ nome: c.nome, turma: c.turma, estado: c.estado })
        if (c.estado === 'chamado') {
          li.append(botao('Cancelar', false, () => aplicar(c.alunoId, 'cancelar', 'portaria')))
        }
        if (c.estado === 'liberado') {
          li.append(botao('Entregar', true, () => aplicar(c.alunoId, 'entregar', 'portaria')))
        }
        ul.append(li)
      }

      desenharCadastro()

      const grade = document.getElementById('grade')
      const presentes = new Set(ativas.map((c) => c.alunoId))
      for (const [id, cartao] of cartoes) {
        if (!presentes.has(id)) {
          cartao.remove()
          cartoes.delete(id)
        }
      }

      for (const c of ativas) {
        let cartao = cartoes.get(c.alunoId)
        if (!cartao) {
          cartao = criarCartao({ nome: c.nome, turma: c.turma })
          const liberar = botao('Liberar saída', true, () =>
            aplicar(c.alunoId, 'liberar', 'sala'),
          )
          cartao.acrescentar(liberar)
          cartao.__botao = liberar
          cartao.__estado = null
          cartoes.set(c.alunoId, cartao)
          grade.append(cartao)
          tocarAbertura()
        }
        if (c.estado !== cartao.__estado) {
          cartao.definirEstado(c.estado)
          if (c.estado === 'liberado') tocarEntrega()
          cartao.__estado = c.estado
        }
        cartao.__botao.disabled = c.estado === 'liberado'
        cartao.__botao.textContent =
          c.estado === 'liberado' ? 'Aguardando no portão' : 'Liberar saída'
      }

      document.getElementById('vazio').hidden = ativas.length > 0
    }

    function desenharCadastro() {
      const cadastro = document.getElementById('cadastro')
      cadastro.innerHTML = ''
      for (const aluno of ALUNOS) {
        const li = criarLinha({ nome: aluno.nome, turma: aluno.turma })
        if (chamadas.has(aluno.id)) li.append(etiquetaDe('em saída'))
        else li.append(botao('Chamar', true, () => aplicar(aluno.id, 'chamar', 'portaria')))
        cadastro.append(li)
      }
    }

    desenhar()
  
</script>
