/*
  Janelinhas do Saber — sistema visual.

  Institucional, nao lúdico. A escola vai do Pré 1 ao 9º ano: uma interface
  de madeira e vidrinho fala com o Pré e constrange o Fundamental II, e a
  professora usa isto quarenta vezes por dia. Verde institucional, cartoes
  brancos, tipografia limpa, densidade de informacao.

  O nome da escola aparece como marca, nao como textura: um glifo discreto
  de janela no cabecalho. Identidade sem fantasia.

  As cores marcadas com --_todo dependem da marca real da escola, que ainda
  nao conhecemos: conteudo/institucional/ e todo TODO(visita).
*/

/*
  Tipografia da direcao "Patio".

  Duas fontes, self-hosted, servidas pelo proprio Worker. Nao ha CDN em runtime
  nem em desenvolvimento: o wifi de uma escola cai, e um app de saida que
  depende de fonts.googleapis.com para desenhar o nome de uma crianca e um app
  que escolhe o pior momento para falhar.

  FRAUNCES 600 escreve exclusivamente o cabecalho e os titulos. E uma serifada
  com contraste alto, que da a um app de portaria o peso de uma placa de escola
  em vez de um painel de aeroporto — e a escola vai do Pré 1 ao 9º ano, entao a
  identidade nao pode parecer infantil.

  Ela vem SUBSETADA aos 44 caracteres que o cabecalho escreve
  (`ferramentas/subsetar-fontes.mjs`): 35 KB viraram 10 KB. Trinta e cinco
  quilobytes para desenhar uma frase que nunca muda seria a maior linha do
  orcamento de peso, e a menos util.

  INSTRUMENT SANS escreve todo o resto, e NAO e subsetada por amostra: ela
  desenha nome de crianca, e nome de crianca vem de planilha. Recortar pelos
  glifos que a semente usa daria um retangulo vazio no lugar do "Ø" de alguem
  no dia em que a escola importasse a lista de verdade. Fonte de corpo se
  recorta por INTERVALO, e o subset "latin" ja cobre o portugues inteiro,
  inclusive o "º" de "1º ano".

  Foi escolhida em vez do Inter Tight por um motivo especifico: Inter e a fonte
  que virou marca do visual generico de interface gerada por IA, e esta escola
  precisa parecer uma escola.

  `font-display: swap` em ambas: o texto aparece na fonte de sistema e troca
  quando a fonte chega. Numa tela onde alguem espera o nome de uma crianca,
  texto invisivel por 3 segundos e pior que texto na fonte errada por 300 ms.
*/

:root {
  /*
    Escala tipografica, por PAPEL e nao por tamanho.

    Antes havia dezoito tamanhos distintos espalhados pelos arquivos, cinco
    deles a menos de meio pixel um do outro — 0,78rem, 0,8rem e 0,82rem sao a
    mesma coisa para qualquer olho, e existiam so porque cada tela foi escrita
    num dia diferente. Diferenca que ninguem percebe nao comunica nada; so
    impede que a proxima pessoa saiba qual usar.

    Sete degraus, cada um a pelo menos 12% do vizinho, e cada um com um
    trabalho. O nome diz o trabalho, entao a proxima pessoa escolhe pelo que
    esta escrevendo e nao pelo que parece bonito.
  */
  --t-etiqueta: 0.79rem;   /* caixa alta, contagem, rodape */
  --t-detalhe: 0.888rem;   /* turma, dica, corte da busca */
  --t-corpo: 1rem;         /* o padrao */
  --t-nome: 1.125rem;      /* nome na linha, texto da restricao */
  --t-titulo: 1.266rem;    /* titulo de tela e de caixa */
  --t-numero: 1.424rem;    /* o valor no placar da importacao */
  --t-painel: 2rem;        /* variante Painel: lido do fundo da sala */

  /* Entrelinha: apertada em titulo, folgada em texto corrido. */
  --linha-titulo: 1.2;
  --linha-corpo: 1.5;

  /* Caixa alta precisa de respiro entre letras; caixa baixa nao. */
  --tracking-etiqueta: 0.07em;

    /* marca */
  --marca: #0e6b45;
  --marca-escura: #0a5436;
  --marca-clara: #e4f1ea;
  --marca-borda: #b9dcc9;

  /* superficies */
  --fundo: #f4f6f5;
  --superficie: #ffffff;
  --superficie-2: #eef1ef;
  --borda: #dfe4e1;
  --borda-forte: #c3ccc7;

  /* texto */
  --tinta: #16211c;
  --tinta-media: #4a5852;
  /*
    Era #78857f: 3,54 sobre o fundo e 3,85 sobre o cartao — reprovava o
    minimo de 4,5 do WCAG 1.4.3. Carrega a turma no cartao, o detalhe na
    linha e o aviso de truncamento da busca, entao nao e texto decorativo.
  */
  --tinta-fraca: #5f6b66;
  --tinta-clara: #ffffff;

  /*
    ESTADOS.

    Regra de uso: nenhum destes tokens aparece sozinho. Cada estado se
    apresenta por quatro canais ao mesmo tempo — cor, icone, rotulo textual e
    faixa lateral. O componente monta o conjunto (web/comum/cartao.js); a tela
    nao escolhe.

    Todos os pares foram medidos: cada cor passa 4,5 como texto sobre o fundo
    e sobre o cartao, e passa 3,0 como faixa. src/contraste.test.ts trava isso.
  */
  --estado-aguardando: #736c67;
  --estado-chamado: #c2410c;
  --estado-liberado: #15803d;
  --estado-entregue: #1d4ed8;
  --estado-retorno: #86198f;

  --estado-aguardando-fundo: #f7f6f5;
  --estado-chamado-fundo: #fef6e9;
  --estado-liberado-fundo: #f2f9f5;
  --estado-entregue-fundo: #e7edfc;
  --estado-retorno-fundo: #f8e9f8;

  --alerta: #a4302a;
  --alerta-fundo: #fbeceb;

  /* Botao desabilitado: par proprio, nunca opacity. Ver a regra la embaixo. */
  --apagado-fundo: #dfe4e1;
  --apagado-tinta: #3f4b45;

  /* nomes antigos, mantidos para nao quebrar telas que ainda os usam */
  --chamado-fundo: var(--estado-chamado-fundo);
  --chamado-borda: #f0d4a3;
  --chamado-tinta: var(--estado-chamado);
  --liberado-fundo: var(--estado-liberado-fundo);
  --liberado-borda: var(--marca-borda);
  --liberado-tinta: var(--estado-liberado);

  /* medidas */
  --canto: 8px;
  --canto-g: 12px;
  /*
    Alvo de toque. 44px e o nivel AAA (WCAG 2.5.5), acima do minimo AA de 24.
    A baseline mediu 6 de 9 acoes primarias em 40,1px, e o summary da
    importacao em 18,7 — abaixo ate do minimo AA.
  */
  --toque-min: 44px;
  --transicao: 180ms cubic-bezier(0.2, 0, 0.2, 1);
  --sombra: 0 1px 2px rgba(22, 33, 28, 0.06), 0 1px 3px rgba(22, 33, 28, 0.04);
  --sombra-alta: 0 2px 4px rgba(22, 33, 28, 0.08), 0 4px 12px rgba(22, 33, 28, 0.06);

  --_todo-marca-primaria: var(--marca);
}

/* ---------- base ---------- */

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--fundo);
  color: var(--tinta);
  /*
    A pilha SEMPRE termina numa fonte de sistema. Se o woff2 nao chegar — rede
    da escola, cache limpo, arquivo movido — o app continua legivel em vez de
    cair para um serifado de navegador que ninguem escolheu.
  */
  font-family: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ---------- cabecalho institucional ---------- */

/*
  `hidden` tem que ganhar de qualquer `display`.

  O atributo `hidden` esconde por `display: none` vindo da folha do navegador —
  que e a de MENOR prioridade que existe. Qualquer regra nossa que declare
  `display` na mesma elemento vence, e o elemento fica permanentemente visivel
  com o atributo `hidden` ali, dizendo o contrario.

  Foi o que aconteceu com a faixa de aviso de som: `.faixa.aviso { display:
  block }` anulou o `hidden`, e a tela ficou com uma barra preta vazia
  atravessada nela. As verificacoes automaticas nao pegaram porque leem a
  PROPRIEDADE `el.hidden`, que continuava correta — a tela e que mentia.
  Quem pegou foi olhar o print, de novo.

  `!important` aqui e o uso legitimo: e uma regra de plataforma, nao de estilo,
  e ela existe justamente para nao ser sobrescrita por descuido.
*/
[hidden] {
  display: none !important;
}

/*
  Rotulo que so o leitor de tela alcanca.

  Nao usa `display: none` nem `visibility: hidden`: os dois tiram o elemento
  da arvore de acessibilidade tambem, e ai o campo fica sem nome nenhum. O
  recorte de 1px e a forma que continua sendo lida.
*/
.fora-da-tela {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

/*
  O cabecalho embrulha, em vez de empurrar o conteudo para fora da tela.

  Em 320px — o iPhone SE, que ainda esta em muita mao — o glifo, o nome da
  escola, o seletor de som e o botao de mudo somavam 360px numa tela de 320. O
  resultado nao era so feio: `.direita` saia para fora do lado direito, e o
  botao de mudo ficava inalcancavel sem descobrir que dava para arrastar a
  pagina de lado. Ninguem descobre.

  `flex-wrap` mais `margin-left: auto` no bloco da direita: enquanto cabe, ele
  fica encostado na direita como sempre; quando nao cabe, desce inteiro para a
  linha de baixo em vez de vazar.
*/
.cabecalho {
  background: var(--marca);
  color: var(--tinta-clara);
  padding: 0.85rem 1.15rem;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem 0.75rem;
}

.cabecalho .marca-glifo {
  width: 26px;
  height: 26px;
  flex: none;
  border: 2px solid currentColor;
  border-radius: 3px;
  position: relative;
  opacity: 0.95;
}

.cabecalho .marca-glifo::before,
.cabecalho .marca-glifo::after {
  content: '';
  position: absolute;
  background: currentColor;
}

.cabecalho .marca-glifo::before {
  left: 50%;
  top: 2px;
  bottom: 2px;
  width: 2px;
  transform: translateX(-50%);
}

.cabecalho .marca-glifo::after {
  top: 50%;
  left: 2px;
  right: 2px;
  height: 2px;
  transform: translateY(-50%);
}

.cabecalho .titulo {
  font-size: var(--t-corpo);
  font-weight: 600;
  letter-spacing: 0.01em;
  margin: 0;
  line-height: 1.25;
}

.cabecalho .subtitulo {
  font-size: var(--t-detalhe);
  opacity: 0.82;
  margin: 0;
  line-height: 1.3;
}

.cabecalho .direita {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

/* ---------- faixa de chamada (a manchete da sala) ---------- */

.faixa {
  background: var(--chamado-fundo);
  border-bottom: 1px solid var(--chamado-borda);
  color: var(--chamado-tinta);
  padding: 0.7rem 1.15rem;
  font-size: var(--t-corpo);
  font-weight: 500;
}

/*
  Aviso de som interrompido.

  E um <button> porque reativar audio exige gesto do usuario: um aviso que so
  informasse deixaria a professora sabendo do problema e sem o que fazer. Mas
  ocupa a largura toda como faixa, e nao parece um botao de acao comum, porque
  nao e uma escolha dela — e o aparelho avisando que falhou.

  Se destaca por LUMINANCIA, nao por matiz: barra escura com texto claro, entre
  faixas palidas. Nao empresta a cor de nenhum estado de aluno — `chamado` fica
  logo acima e ficariam iguais; `retorno` chega na Fase 1 e o significado dele
  e outro. E, por ser inversao e nao cor, continua saltando em qualquer
  simulacao de daltonismo.

  Herda de `button` o min-height de 44px, entao ja nasce dentro do alvo AAA.
*/
.faixa.aviso {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  border-radius: 0;
  background: var(--tinta);
  color: var(--tinta-clara);
  font-size: var(--t-corpo);
  font-weight: 600;
  padding: 0.7rem 1.15rem;
  cursor: pointer;
}

/*
  Caixa de restricao.

  Vermelho-magenta e escuro de proposito: nao se parece com nada mais no app,
  porque nao e mais uma etapa do fluxo — e uma interrupcao. E o texto da
  anotacao vem grande, porque a pessoa esta de pe, com fila esperando, e vai ler
  em dois segundos ou nao vai ler.
*/
.restricao {
  border: 0;
  border-radius: var(--canto);
  padding: 1.3rem 1.4rem 1.15rem;
  max-width: 34rem;
  width: calc(100vw - 2rem);
  background: var(--superficie);
  border-top: 6px solid var(--alerta);
  box-shadow: 0 18px 50px rgb(0 0 0 / 0.28);
  color: var(--tinta);
}

.restricao::backdrop {
  background: rgb(20 16 14 / 0.55);
}

.restricao h2 {
  margin: 0 0 0.35rem;
  font-size: var(--t-nome);
  font-weight: 700;
  color: var(--alerta);
}

.restricao .quem {
  margin: 0 0 0.9rem;
  font-size: var(--t-detalhe);
  color: var(--tinta-media);
}

.restricao .texto {
  margin: 0 0 1.3rem;
  font-size: var(--t-nome);
  line-height: 1.45;
  font-weight: 500;
}

.restricao .botoes {
  display: flex;
  gap: 0.6rem;
  flex-wrap: wrap;
}

.restricao .botoes button { flex: 1 1 10rem; }

/*
  A marca de que existe restricao, na lista e na busca.

  Aparece ANTES de qualquer acao, para a pessoa saber que a caixa vem — nao
  para substitui-la. Texto e simbolo juntos, como todo estado deste app.
*/
.marca-restricao {
  color: var(--alerta);
  font-weight: 700;
}
/* O ponto separa da turma; sem ele a marca colava ("Pré 2! restrição"). */
.marca-restricao::before { content: " · ! "; }

/* ---------- tipografia aplicada ---------- */

/*
  O Fraunces aparece SO aqui.

  Titulo de tela, nome da escola e titulo de caixa. Em qualquer outro lugar ele
  seria decoracao — e ele nao tem os glifos: a fonte foi recortada aos 44
  caracteres que estas frases escrevem.
*/
.titulo,
.entrada h2,
.restricao h2 {
  font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
  font-weight: 600;
  line-height: var(--linha-titulo);
  letter-spacing: -0.01em;
}

/*
  Etiqueta de secao: caixa alta, e por isso precisa de respiro entre letras.

  Caixa alta sem tracking le pior que caixa baixa — as maiusculas tem largura
  parecida e o olho perde a fronteira das palavras. Meio ponto percentual
  resolve, e so vale para maiusculas.
*/
.secao,
.grupo,
.entrada label {
  font-size: var(--t-etiqueta);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: var(--tracking-etiqueta);
}

/*
  Numeros em colunas alinham por baixo.

  Contagem, cronometro e placar mudam sozinhos na tela. Com largura variavel de
  digito, "9" e "11" empurram o texto ao lado a cada tique — movimento que
  ninguem pediu, na tela onde alguem espera uma crianca.
*/
.contagem,
.contagem-secao,
.espera,
.placar .valor,
.grupo .quantos {
  font-variant-numeric: tabular-nums;
}

/* ---------- variante Painel ---------- */

/*
  A sala nao e um app de celular: e um painel.

  A professora nao esta com o aparelho na mao. Ele fica apoiado na mesa ou preso
  na parede, e ela olha do meio da sala, com vinte criancas em pe. O que importa
  ali e o nome ser lido a tres metros — nao caber mais cartoes na tela.

  Os TOKENS sao os mesmos; muda so a escala. Uma segunda paleta ou um segundo
  conjunto de estados seria duas verdades sobre a mesma crianca, e a hora em que
  elas divergissem seria a hora errada.
*/
.painel .cartao .nome {
  font-size: var(--t-painel);
  line-height: var(--linha-titulo);
  font-weight: 600;
  letter-spacing: -0.015em;
}

.painel .cartao .turma {
  font-size: var(--t-nome);
}

.painel .cartao .etiqueta {
  font-size: var(--t-nome);
  padding: 0.4rem 0.85rem;
}

.painel .cartao .etiqueta svg {
  width: 1.15em;
  height: 1.15em;
}

.painel .cartao button {
  font-size: var(--t-nome);
  min-height: 3.5rem;
}

/* A faixa de aviso tambem e lida de longe. */
.painel .faixa {
  font-size: var(--t-nome);
}

/* ---------- caixa de entrega ---------- */

/*
  Escolher a quem entregar e uma LISTA DE PESSOAS, nao um seletor.

  Um `select` esconde as opcoes atras de um toque e mostra uma de cada vez —
  e a porteira precisa comparar o que le com quem esta na frente dela. Aqui
  cada adulto e uma linha grande, com nome, vinculo e telefone visiveis ao
  mesmo tempo.
*/
.entrega {
  border: 0;
  border-radius: var(--canto);
  padding: 1.2rem 1.2rem 1rem;
  max-width: 30rem;
  width: calc(100vw - 2rem);
  background: var(--superficie);
  border-top: 6px solid var(--marca);
  box-shadow: 0 18px 50px rgb(0 0 0 / 0.28);
  color: var(--tinta);
}

.entrega::backdrop { background: rgb(20 16 14 / 0.55); }

.entrega h2 {
  margin: 0 0 0.15rem;
  font-size: var(--t-titulo);
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 600;
}

.entrega .quem {
  margin: 0 0 1rem;
  font-size: var(--t-nome);
  font-weight: 600;
  color: var(--tinta-media);
}

.quem-pode { display: flex; flex-direction: column; gap: 0.5rem; }

.responsavel {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.1rem;
  width: 100%;
  text-align: left;
  padding: 0.7rem 0.9rem;
}

.responsavel .nome { font-weight: 600; font-size: var(--t-nome); }
.responsavel .detalhe { font-size: var(--t-detalhe); color: var(--tinta-fraca); }

/*
  O impedido aparece, e aparece DIFERENTE.

  Ele nao pode ser tocado, mas precisa ser visto: some-lo faria a porteira
  concluir que aquele adulto nao foi cadastrado, quando o que existe e uma
  decisao de que ele nao pode levar. "Nao consta" e "nao pode" pedem condutas
  opostas.
*/
.responsavel.impedido {
  background: var(--alerta-fundo);
  border-color: var(--alerta);
  color: var(--alerta);
}
.responsavel.impedido .detalhe { color: var(--alerta); font-weight: 700; }

.irmaos { display: flex; flex-direction: column; gap: 0.5rem; }
.irmaos p { margin: 0 0 0.2rem; font-size: var(--t-detalhe); color: var(--tinta-media); }

.irmao {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.55rem 0.9rem;
  border: 1px solid var(--borda-forte);
  border-radius: var(--canto);
  min-height: var(--toque-min);
  font-size: var(--t-detalhe);
}

.irmao input { width: 1.15rem; height: 1.15rem; min-height: 0; margin: 0; }

.entrega .botoes { display: flex; gap: 0.6rem; margin-top: 0.9rem; }
.entrega .botoes button { flex: 1; }

/* ---------- porta de entrada do aparelho ---------- */

/*
  A porta cobre a tela inteira e nao tem como ser dispensada.

  Nao e um aviso que a pessoa fecha: enquanto o aparelho nao esta autorizado
  nao ha tela nenhuma por baixo, porque desenhar a lista e depois descobrir
  que ninguem pode ve-la seria mostrar nome de crianca a quem o servidor vai
  recusar em seguida.
*/
.porta {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: var(--fundo);
  padding: 3rem 1.15rem;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

/*
  O fundo cobre a TELA; a largura de leitura limita o CONTEUDO.

  A primeira versao punha `max-width` na propria caixa fixa, e o resultado era
  o cabecalho verde da pagina aparecendo nas beiradas, por tras da porta — uma
  tela que a pessoa nao pode usar, espiando por baixo de outra que ela precisa
  usar. Cobrir tudo e o ponto: enquanto o aparelho nao esta autorizado, nao ha
  aplicacao por baixo.
*/
.porta > * {
  width: 100%;
  max-width: 26rem;
  margin-inline: auto;
}

.porta h2 {
  font-family: 'Fraunces', Georgia, serif;
  font-size: var(--t-titulo);
  font-weight: 600;
  margin: 0;
}

.porta p {
  color: var(--tinta-media);
  font-size: var(--t-detalhe);
  margin: 0 0 0.6rem;
}

.porta label {
  font-size: var(--t-etiqueta);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: var(--tracking-etiqueta);
  color: var(--tinta-fraca);
}

.porta input { margin-bottom: 0.6rem; }

.porta-erro {
  color: var(--alerta);
  font-weight: 600;
  font-size: var(--t-detalhe);
  margin: 0 0 0.6rem;
}

/*
  A tarja do modo demonstracao.

  Fixa no topo, acima de tudo, inclusive da porta: um servidor com tokens
  conhecidos que nao anuncia isso e uma armadilha esperando alguem confundi-lo
  com producao. Ela nao se fecha.
*/
.tarja-demo {
  /*
    `sticky`, e nao `fixed`.

    Fixa, ela saia do fluxo e era preciso compensar com margem em cada tela —
    e a compensacao errava assim que o texto quebrava em duas linhas, cortando
    o nome da escola no cabecalho. Sticky ocupa o espaco que usa, seja qual for
    a altura, e continua visivel ao rolar.
  */
  position: sticky;
  top: 0;
  z-index: 30;
  margin: 0;
  padding: 0.4rem 0.9rem;
  background: var(--alerta);
  color: var(--tinta-clara);
  font-size: var(--t-etiqueta);
  font-weight: 700;
  letter-spacing: 0.02em;
  text-align: center;
}



/* ---------- cartao do aluno ---------- */

.cartao {
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-radius: var(--canto-g);
  padding: 1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 0.7rem;
  box-shadow: var(--sombra);
  transition: box-shadow var(--transicao), border-color var(--transicao);
}

.cartao .foto {
  width: 96px;
  height: 96px;
  border-radius: var(--canto);
  overflow: hidden;
  background: var(--superficie-2);
  border: 1px solid var(--borda);
  flex: none;
}

/*
  A foto que ainda nao existe.

  O espaco fica reservado — mesma caixa, mesma altura — para que o dia em que a
  escola subir as fotos de matricula nao mexa em layout nenhum: o cartao nao
  muda de tamanho, a linha nao reflui, nada precisa ser redesenhado.

  Vazio DISCRETO, e nao um buraco. Um contorno tracejado leve diz "aqui vem uma
  foto" sem competir com o nome, que hoje e a unica coisa que identifica a
  crianca. Um placeholder chamativo roubaria atencao do que importa agora.
*/
.foto[data-sem-foto] {
  border-style: dashed;
  border-color: var(--borda-forte);
  background: var(--superficie-2);
}

.cartao .foto img,
.cartao .foto svg { width: 100%; height: 100%; display: block; object-fit: cover; }

.cartao .nome {
  font-size: var(--t-nome);
  font-weight: 600;
  line-height: 1.25;
  margin: 0;
}

.cartao .turma {
  font-size: var(--t-detalhe);
  color: var(--tinta-fraca);
  margin: 0;
}

/* ---------- linha compacta (listas da portaria) ---------- */

/*
  A linha embrulha quando nao cabe, em vez de atropelar.

  A versao anterior era uma fila rigida de quatro pecas — retrato, nome,
  etiqueta e acao. Num celular de 430px isso nunca coube: a etiqueta subia por
  cima do nome ("Maitê Salgado" atras de "responsável chegou") e a acao
  transbordava para fora da tela. O print da portaria mostrava isso desde
  sempre; foi o estado `retorno`, que tem DUAS acoes, que tornou impossivel
  continuar nao vendo.

  `flex-wrap` mais uma quebra forcada antes da acao: o retrato e o nome ficam
  na primeira linha, a etiqueta e o botao descem juntos quando precisam. Nada
  de media query, porque o gatilho nao e a largura da tela — e o tamanho do
  nome, que varia por crianca.
*/
.linha {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem 0.8rem;
  padding: 0.7rem 0.9rem;
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-radius: var(--canto);
  margin-bottom: 0.5rem;
}

/*
  A acao vai para o fim da propria linha quando a linha embrulha.

  `margin-left: auto` empurra para a direita enquanto cabe tudo junto, e
  `flex: none` impede que o botao encolha ate ficar ilegivel — encolher um
  botao chamado "Entregar" e pior do que baixa-lo uma linha.
*/
.linha > button,
.linha .duasAcoes {
  margin-left: auto;
  flex: none;
}

.linha .foto {
  width: 44px;
  height: 44px;
  border-radius: 6px;
  overflow: hidden;
  background: var(--superficie-2);
  border: 1px solid var(--borda);
  flex: none;
}

.linha .foto img,
.linha .foto svg { width: 100%; height: 100%; display: block; object-fit: cover; }

.linha .nome {
  /* `flex: 1` com base 8rem: cresce quando sobra espaco, e quebra a linha
     inteira antes de espremer o nome de uma crianca ate o corte. */
  flex: 1 1 8rem;
  min-width: 0;
  font-weight: 500;
  line-height: 1.3;
}

.linha .detalhe {
  display: block;
  font-size: var(--t-detalhe);
  font-weight: 400;
  color: var(--tinta-fraca);
}

/* O ponto so aparece quando ha os dois lados; sem ele a linha comecaria com
   um separador solto enquanto o cronometro ainda nao foi escrito. */
.linha .espera:not(:empty)::before { content: " · "; }
.linha .espera { font-variant-numeric: tabular-nums; }


/* ---------- faixa lateral de estado ---------- */

/*
  O quarto canal, junto de cor, icone e rotulo.

  A primeira versao deste bloco so trocava a COR da faixa, e o comentario
  afirmava que quem nao distingue matiz ainda leria a posicao e a espessura.
  Era falso: as cinco faixas tinham a mesma posicao e a mesma espessura. A
  captura em `docs/prints/fase-0/deuteranopia/sala.png` mostra o resultado —
  a faixa verde de `liberado` e a terracota de `chamado` viram o mesmo oliva,
  lado a lado, e a faixa nao separa nada. Nao era um quarto canal; era o
  primeiro canal desenhado maior.

  Agora cada estado tem um DESENHO proprio de traco, que sobrevive a qualquer
  simulacao porque nao depende de cor nenhuma:

    aguardando  3px pontilhado  — traco fino e interrompido, o estado quieto
    chamado     6px solido      — a barra cheia, o unico que pede acao agora
    liberado    6px duplo       — duas barras, "passou por duas maos"
    entregue    6px tracejado   — traco largo e interrompido, ciclo fechado
    retorno     6px pontilhado  — pontilhado grosso, distinto do aguardando
                                  pela espessura

  A cor continua ali por cima, e continua util para quem a enxerga: a faixa
  usa a cor cheia do estado, que passa 3:1 como nao-texto, contra 1,43 da
  borda de 1px que existia antes.

  Fica DEPOIS de .cartao e .linha de proposito: as duas declaram `border` no
  atalho, e o atalho reescreve border-left-width. Colocado antes, este bloco
  era silenciosamente anulado.
*/
.cartao,
.linha {
  border-left-width: 6px;
  border-left-style: solid;
  border-left-color: var(--borda);
}

.cartao[data-estado='aguardando'],
.linha[data-estado='aguardando'] {
  border-left-color: var(--estado-aguardando);
  border-left-style: dotted;
  border-left-width: 3px;
}
.cartao[data-estado='chamado'],
.linha[data-estado='chamado'] {
  border-left-color: var(--estado-chamado);
  border-left-style: solid;
}
.cartao[data-estado='liberado'],
.linha[data-estado='liberado'] {
  border-left-color: var(--estado-liberado);
  border-left-style: double;
}
.cartao[data-estado='entregue'],
.linha[data-estado='entregue'] {
  border-left-color: var(--estado-entregue);
  border-left-style: dashed;
}
.cartao[data-estado='retorno'],
.linha[data-estado='retorno'] {
  border-left-color: var(--estado-retorno);
  border-left-style: dotted;
}

/* ---------- etiqueta de estado ---------- */


/*
  A etiqueta nao empurra a tela.

  `white-space: nowrap` mantinha "retornou à sala" numa linha so — bonito, e em
  430px o cartao inteiro passava 2px da borda direita e a pagina ganhava rolagem
  horizontal. Dois pixels bastam: a pessoa arrasta a tela sem querer no meio da
  saida, e a lista se mexe embaixo do dedo dela.

  `max-width: 100%` prende a etiqueta ao cartao, e a quebra normal de palavra
  cuida do resto. Perder uma linha e melhor do que empurrar a pagina.
*/
.etiqueta {
  display: inline-flex;
  align-items: center;
  max-width: 100%;
  padding: 0.13rem 0.55rem;
  border-radius: 999px;
  font-size: var(--t-etiqueta);
  font-weight: 500;
  letter-spacing: 0.01em;
  background: var(--superficie-2);
  color: var(--tinta-media);
  border: 1px solid var(--borda);
}

.etiqueta[data-estado='aguardando'] {
  background: var(--estado-aguardando-fundo);
  color: var(--estado-aguardando);
  border-color: var(--estado-aguardando);
}

.etiqueta[data-estado='chamado'] {
  background: var(--estado-chamado-fundo);
  color: var(--estado-chamado);
  border-color: var(--estado-chamado);
}

.etiqueta[data-estado='liberado'] {
  background: var(--estado-liberado-fundo);
  color: var(--estado-liberado);
  border-color: var(--estado-liberado);
}

.etiqueta[data-estado='entregue'] {
  background: var(--estado-entregue-fundo);
  color: var(--estado-entregue);
  border-color: var(--estado-entregue);
}

.etiqueta[data-estado='retorno'] {
  background: var(--estado-retorno-fundo);
  color: var(--estado-retorno);
  border-color: var(--estado-retorno);
}

/* O icone vive dentro da etiqueta e herda a cor do estado. */
.etiqueta svg {
  width: 0.95em;
  height: 0.95em;
  vertical-align: -0.15em;
  margin-right: 0.3em;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---------- controles ---------- */

button {
  font: inherit;
  font-size: var(--t-corpo);
  font-weight: 500;
  min-height: var(--toque-min);
  padding: 0.5rem 0.9rem;
  border-radius: var(--canto);
  border: 1px solid var(--borda-forte);
  background: var(--superficie);
  color: var(--tinta);
  cursor: pointer;
  transition: background var(--transicao), border-color var(--transicao);
}

button:hover:not(:disabled) { background: var(--superficie-2); }
button:active:not(:disabled) { transform: translateY(1px); }

button.principal {
  background: var(--marca);
  border-color: var(--marca-escura);
  color: var(--tinta-clara);
}

button.principal:hover:not(:disabled) { background: var(--marca-escura); }

button.larga { width: 100%; padding: 0.7rem; font-size: var(--t-corpo); }

button.fantasma {
  background: transparent;
  border-color: transparent;
  color: inherit;
}

button.fantasma:hover:not(:disabled) { background: rgba(255, 255, 255, 0.14); }

/*
  Desabilitado com par proprio, NUNCA com opacity.

  A versao anterior usava opacity: 0.45 no elemento inteiro, o que compunha
  texto E fundo contra a pagina e derrubava o contraste para 2,12 — menos da
  metade do minimo. E era justamente o estado "Aguardando no portao", o que
  confirma a professora que ela ja fez a parte dela.

  Fica DEPOIS de .principal e .fantasma de proposito. Colocado antes, tinha a
  mesma especificidade que elas e perdia por ordem: o botao desabilitado
  continuava verde-cheio na tela, e o teste de tokens nao pegava porque ele
  mede as cores declaradas, nao qual regra vence a cascata. Quem pegou foi
  olhar o print.
*/
button:disabled,
button.principal:disabled,
button.fantasma:disabled,
button.larga:disabled {
  background: var(--apagado-fundo);
  color: var(--apagado-tinta);
  border-color: var(--borda-forte);
  cursor: default;
}

input[type='text'],
input:not([type]),
select,
textarea {
  font: inherit;
  width: 100%;
  /*
    O alvo de 44px vale para TODO controle, nao so para botao.

    So o botao tinha o minimo, e bastou o seletor de volume ganhar uma fonte um
    pouco menor para ele cair a 43px — um pixel abaixo do nivel AAA do WCAG
    2.5.8, invisivel em revisao e medido pela verificacao. Regra por elemento
    vira regra que alguem esquece; aqui ela vale para todos de uma vez.
  */
  min-height: var(--toque-min);
  padding: 0.65rem 0.8rem;
  border-radius: var(--canto);
  border: 1px solid var(--borda-forte);
  background: var(--superficie);
  color: var(--tinta);
}

input:focus,
select:focus,
textarea:focus {
  outline: 2px solid var(--marca);
  outline-offset: -1px;
  border-color: var(--marca);
}

/* ---------- estrutura ---------- */

.conteudo { padding: 1.15rem; max-width: 560px; margin: 0 auto; }

.secao {
  font-size: var(--t-etiqueta);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--tinta-fraca);
  margin: 1.6rem 0 0.6rem;
}

.secao:first-of-type { margin-top: 0; }

.vazio {
  color: var(--tinta-fraca);
  font-size: var(--t-corpo);
  padding: 0.8rem 0;
}

/*
  `min(180px, 100%)`, e nao `180px` seco.

  Numa tela de 320px com o padding do palco, a coluna minima de 180px ainda
  cabe — mas o conteudo dentro dela nem sempre, e uma coluna de grade nunca
  encolhe abaixo do minimo declarado. `min()` diz "180, ou a largura toda, o
  que for menor", e ai a grade cede em vez de empurrar a pagina.
*/
.grade {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(180px, 100%), 1fr));
  gap: 0.9rem;
}

.rede {
  font-size: var(--t-etiqueta);
  color: var(--tinta-fraca);
}

.rede[data-rede='desligado'] { color: var(--alerta); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}


    .colunas { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100vh - 58px); }
    .coluna { padding: 1.15rem; }
    .coluna + .coluna { border-left: 1px solid var(--borda); background: #fafbfa; }
    .rotulo {
      font-size: var(--t-etiqueta); font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--tinta-fraca); margin: 0 0 0.15rem;
    }
    .explica { font-size: var(--t-detalhe); color: var(--tinta-media); margin: 0 0 1rem; }
    ul { list-style: none; padding: 0; margin: 0; }
    .grade { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .cartao button { width: 100%; }
    .selo {
      position: fixed; bottom: 0.9rem; right: 1rem; font-size: var(--t-etiqueta);
      color: var(--tinta-fraca); background: var(--superficie);
      border: 1px solid var(--borda); border-radius: 999px; padding: 0.2rem 0.7rem;
    }
  
</style>

<body>
<header class="cabecalho">
    <span class="marca-glifo" aria-hidden="true"></span>
    <div>
      <p class="titulo">Janelinhas do Saber</p>
      <p class="subtitulo">Demonstração — portaria e sala lado a lado</p>
    </div>
  </header>

  <div class="colunas">
    <section class="coluna">
      <p class="rotulo">Portaria</p>
      <p class="explica">O responsável chegou no portão.</p>
      <ul id="cadastro"></ul>

      <p class="secao">Em saída</p>
      <ul id="ativas"></ul>
      <p class="vazio" id="nenhuma">Ninguém em saída agora.</p>
    </section>

    <section class="coluna">
      <p class="rotulo">Sala — 4º ano</p>
      <p class="explica">A professora confirma a saída.</p>
      <p class="vazio" id="vazio">Nenhuma chamada agora.</p>
      <div class="grade" id="grade"></div>
    </section>
  </div>

  <p class="selo">modo demonstração · sem rede</p>
<script>

/* ===== web/comum/estados.js ===== */
/*
  A mesma maquina de estados de src/estados.ts, em JavaScript, para o modo
  demo funcionar sem servidor.

  As duas copias tem que mudar juntas — e agora existe teste cobrando isso
  (`src/paridade.test.ts`), porque "tem que" escrito num comentario nao para
  ninguem. Com a copia atrasada, a demonstracao na frente da escola mostra um
  produto diferente do que sera entregue, ou o botao lanca TransicaoInvalida ao
  vivo.

  MAPA usa Object.create(null) pelo mesmo motivo do original: com objeto
  literal comum, MAPA['aguardando']['constructor'] resolve na cadeia de
  prototipo, devolve a funcao Object (truthy) e atravessa a maquina inteira.
*/

const ACOES = ['chamar', 'liberar', 'entregar', 'cancelar', 'retornar', 'encerrar']

const DONO = {
  chamar: 'portaria',
  liberar: 'sala',
  entregar: 'portaria',
  cancelar: 'portaria',
  retornar: 'sala',
  encerrar: 'portaria',
}

/*
  As razoes do retorno. Codigos, nao frases — o rotulo que a tela mostra pode
  ser renomeado sem reescrever o passado.
*/
const RAZOES_RETORNO = [
  'esqueceu-material',
  'nao-saiu-com-o-responsavel',
  'a-escola-reteve',
  'outro',
]

function ehRazaoRetorno(valor) {
  return typeof valor === 'string' && RAZOES_RETORNO.includes(valor)
}

function ehAcao(valor) {
  return typeof valor === 'string' && ACOES.includes(valor)
}

class TransicaoInvalida extends Error {
  constructor(de, acao) {
    super(`nao e possivel "${acao}" a partir de "${de}"`)
    this.name = 'TransicaoInvalida'
    this.de = de
    this.acao = acao
  }
}

class AcaoNaoPermitida extends Error {
  constructor(acao, papel) {
    super(`"${acao}" e da ${DONO[acao]}, nao da ${papel}`)
    this.name = 'AcaoNaoPermitida'
    this.acao = acao
    this.papel = papel
  }
}

const MAPA = Object.assign(Object.create(null), {
  aguardando: Object.assign(Object.create(null), { chamar: 'chamado' }),
  chamado: Object.assign(Object.create(null), { liberar: 'liberado', cancelar: 'aguardando' }),
  liberado: Object.assign(Object.create(null), { entregar: 'entregue', retornar: 'retorno' }),
  retorno: Object.assign(Object.create(null), { chamar: 'chamado', encerrar: 'aguardando' }),
})

function proximo(de, acao) {
  if (!ehAcao(acao)) throw new TransicaoInvalida(de, acao)
  const destino = MAPA[de]?.[acao]
  if (typeof destino !== 'string') throw new TransicaoInvalida(de, acao)
  return destino
}

function exigirDono(acao, papel) {
  if (!ehAcao(acao)) throw new TransicaoInvalida('aguardando', acao)
  if (DONO[acao] !== papel) throw new AcaoNaoPermitida(acao, papel)
}


/* ===== web/comum/cartao.js ===== */

/*
  Os dois formatos em que um aluno aparece.

  Nada aqui usa innerHTML com o nome: nome vem de planilha colada pela
  secretaria, e interpolar isso em template transforma um nome com marcacao em
  codigo executando na tela. textContent nao interpreta marcacao.

  REGRA DOS ESTADOS. Nenhum estado se apresenta so por cor. Cada um traz
  quatro canais ao mesmo tempo:

    cor      — token --estado-*, todos medidos contra as superficies
    rotulo   — texto em portugues corrido, nunca jargao
    icone    — forma distinta, para quem nao distingue matiz
    faixa    — posicao e espessura na lateral (o CSS cuida, via data-estado)

  O componente monta o conjunto. A tela nao escolhe partes dele — foi assim
  que `aguardando` acabou sem rotulo nenhum, comunicado apenas pela AUSENCIA
  da etiqueta.
*/

const ROTULO = {
  aguardando: 'aguardando',
  chamado: 'responsável chegou',
  liberado: 'liberado',
  entregue: 'entregue',
  retorno: 'retornou à sala',
}

/*
  Icones desenhados a mao, em SVG inline.

  Sem biblioteca e sem CDN: o app tem que subir com o cabo da escola
  desconectado, e uma fonte de icone remota seria a unica dependencia externa
  do projeto inteiro. Cada glifo e um punhado de tracos num viewBox de 24.
*/
const ICONE = {
  aguardando: ['M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z', 'M12 7v5l3 2'],
  chamado: ['M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7', 'M13.7 21a2 2 0 0 1-3.4 0'],
  liberado: ['M20 6 9 17l-5-5'],
  entregue: ['M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8', 'M17 16l4-4-4-4', 'M21 12H10'],
  retorno: ['M9 14 4 9l5-5', 'M4 9h11a5 5 0 0 1 0 10h-4'],
}

const NS = 'http://www.w3.org/2000/svg'

function icone(estado) {
  const tracos = ICONE[estado]
  if (!tracos) return null
  const svg = document.createElementNS(NS, 'svg')
  svg.setAttribute('viewBox', '0 0 24 24')
  svg.setAttribute('aria-hidden', 'true')
  for (const d of tracos) {
    const caminho = document.createElementNS(NS, 'path')
    caminho.setAttribute('d', d)
    svg.append(caminho)
  }
  return svg
}

/*
  O lugar da foto, vazio ate a escola trazer as fotos.

  Ate aqui isto desenhava um retrato vetorial gerado do nome. Servia para a
  vitrine e cumpria o invariante 4 (nada fotorrealista de crianca), mas era
  ilustracao inventada ocupando o lugar da informacao real — e a escola vai
  subir as fotos de matricula, com consentimento, na Fase 3.

  O ESPACO CONTINUA RESERVADO, e isso e o ponto. Um lugar vazio hoje e a mesma
  caixa que recebe a foto amanha: o cartao nao muda de altura, a linha nao
  reflui, e nenhuma tela precisa ser redesenhada quando as imagens chegarem.
  Tirar a caixa junto com o desenho seria economizar hoje para refazer depois.

  Fica com `aria-hidden`: e decoracao ate ter conteudo, e um leitor de tela
  anunciando "imagem" numa caixa vazia so atrapalha quem depende dele.
*/
function foto(_nome, classe) {
  const caixa = document.createElement('div')
  caixa.className = classe
  caixa.dataset.semFoto = 'sim'
  caixa.setAttribute('aria-hidden', 'true')
  return caixa
}

/** Etiqueta completa: icone + rotulo + cor, os tres sempre juntos. */
function etiquetaDe(texto, estado) {
  const span = document.createElement('span')
  span.className = 'etiqueta'
  if (estado) {
    span.dataset.estado = estado
    const glifo = icone(estado)
    if (glifo) span.append(glifo)
  }
  span.append(document.createTextNode(texto))
  return span
}

/**
 * Monta a etiqueta a partir do estado, com o rotulo e o icone que lhe pertencem.
 *
 * Exportada porque a portaria precisa RECONSTRUIR a etiqueta quando o estado
 * muda. Reescrever so o texto apagava o <svg> junto — textContent substitui
 * todos os filhos — e o rotulo escrito a mao la virava segunda fonte da
 * verdade, que nao sabe de nenhum estado alem dos dois digitados.
 */
function etiquetaDoEstado(estado) {
  const texto = ROTULO[estado]
  if (!texto) return null
  return etiquetaDe(texto, estado)
}

/**
 * Cartao grande. E o que a professora ve do fundo da sala: rosto grande,
 * nome legivel, estado inequivoco.
 */
function criarCartao({ nome, turma }) {
  const raiz = document.createElement('article')
  raiz.className = 'cartao'
  raiz.dataset.estado = 'aguardando'

  const nomeEl = document.createElement('p')
  nomeEl.className = 'nome'
  nomeEl.textContent = nome

  const turmaEl = document.createElement('p')
  turmaEl.className = 'turma'
  turmaEl.textContent = turma

  const textos = document.createElement('div')
  textos.append(nomeEl, turmaEl)

  const lugarDaEtiqueta = document.createElement('div')
  lugarDaEtiqueta.className = 'lugar-etiqueta'

  raiz.append(foto(nome, 'foto'), textos, lugarDaEtiqueta)

  raiz.definirEstado = (estado) => {
    raiz.dataset.estado = estado
    lugarDaEtiqueta.replaceChildren()
    const etiqueta = etiquetaDoEstado(estado)
    if (etiqueta) lugarDaEtiqueta.append(etiqueta)
  }
  raiz.definirEstado('aguardando')

  raiz.acrescentar = (no) => {
    raiz.append(no)
    return raiz
  }

  return raiz
}

/** Linha compacta. E o que a portaria percorre com o polegar, no celular. */
function criarLinha({ nome, turma, estado }) {
  const raiz = document.createElement('li')
  raiz.className = 'linha'
  // Alimenta a faixa lateral do CSS. Sem isto a linha fica sem o quarto canal.
  if (estado) raiz.dataset.estado = estado

  const bloco = document.createElement('div')
  bloco.className = 'nome'
  bloco.append(document.createTextNode(nome))

  /*
    A turma e a espera dividem a mesma linha de detalhe, em spans separados.

    Separados porque o tempo muda a cada tique e a turma nao: escrever os dois
    juntos obrigaria a reescrever o texto inteiro a cada dez segundos, e o
    proximo `textContent =` seria mais uma chance de apagar algo por engano —
    foi assim que a etiqueta perdeu o icone.
  */
  const detalhe = document.createElement('span')
  detalhe.className = 'detalhe'

  const turmaEl = document.createElement('span')
  turmaEl.className = 'turma-da-linha'
  turmaEl.textContent = turma

  const espera = document.createElement('span')
  espera.className = 'espera'

  detalhe.append(turmaEl, espera)
  bloco.append(detalhe)

  raiz.append(foto(nome, 'foto'), bloco)

  const etiqueta = estado ? etiquetaDoEstado(estado) : null
  if (etiqueta) raiz.append(etiqueta)

  return raiz
}


/* ===== web/comum/som.js ===== */
/*
  Som sintetizado. Nenhum arquivo de audio no repositorio: funciona offline
  e nao pesa.

  O navegador nao toca audio antes do primeiro gesto do usuario. Por isso
  destravar() precisa ser chamado de dentro de um clique — senao a primeira
  chamada da apresentacao sai muda, que e exatamente o momento que precisa
  funcionar.

  E DEPOIS DO PRIMEIRO GESTO O CONTEXTO PODE SUSPENDER DE NOVO. Aba em segundo
  plano, chamada telefonica, tela bloqueada, economia de bateria: o sistema
  suspende, e a versao anterior deste arquivo so testava `!contexto`. O objeto
  continuava existindo, entao tocarAbertura() executava inteira, agendava as
  notas num contexto parado, e nao saia som — sem nada na tela dizendo isso.
  A professora ficava esperando um aviso que nunca vinha, com o responsavel
  parado no portao.

  Este modulo nao toca no DOM: quem quiser avisar registra um retorno em
  `aoFalharSom`. Assim ele continua servindo a sala, a portaria e a demo, que
  desenham o aviso cada uma do seu jeito.
*/

const CHAVE_MUDO = 'janelinhas:mudo'
const CHAVE_VOLUME = 'janelinhas:volume'

/*
  Tres degraus, nao um controle continuo.

  Quem mexe nisto e uma professora de pe, com a turma esperando, num tablet.
  Tres alvos grandes acertam de primeira; um cursor deslizante exige mira e
  produz "quase inaudivel" por engano — que e a mesma falha que o mudo, so que
  sem nada na tela dizendo.
*/
const VOLUMES = { baixo: 0.45, medio: 1, alto: 1.8 }
const VOLUME_PADRAO = 'medio'

let contexto = null
let mudo = mudoGuardado()
let volume = volumeGuardado()
let avisar = () => {}

/*
  localStorage lanca excecao em aba anonima com armazenamento bloqueado, e o
  padrao de falha aqui e SOM LIGADO: um app que emudece sozinho por causa de
  uma configuracao de privacidade e pior que um que fala demais.
*/
function mudoGuardado() {
  try {
    return localStorage.getItem(CHAVE_MUDO) === 'sim'
  } catch {
    return false
  }
}

function guardarMudo(valor) {
  try {
    localStorage.setItem(CHAVE_MUDO, valor ? 'sim' : 'nao')
  } catch {
    /* sem armazenamento: vale so para esta sessao */
  }
}

function volumeGuardado() {
  try {
    const v = localStorage.getItem(CHAVE_VOLUME)
    // Valida contra os degraus conhecidos: valor adulterado ou de uma versao
    // antiga viraria NaN no ganho, e o oscilador falha em silencio.
    return v && v in VOLUMES ? v : VOLUME_PADRAO
  } catch {
    return VOLUME_PADRAO
  }
}

/** Devolve os degraus disponiveis, na ordem, para a tela montar o controle. */
function degraus() {
  return Object.keys(VOLUMES)
}

function volumeAtual() {
  return volume
}

function definirVolume(degrau) {
  if (!(degrau in VOLUMES)) return volume
  volume = degrau
  try {
    localStorage.setItem(CHAVE_VOLUME, degrau)
  } catch {
    /* sem armazenamento: vale so para esta sessao */
  }
  return volume
}

/** Aplica o degrau escolhido ao ganho base de cada toque. */
function volumeDe(base) {
  return base * (VOLUMES[volume] ?? 1)
}

/**
 * Registra quem recebe o aviso de que o som nao saiu.
 * Chamado com uma mensagem quando falha, e com null quando volta a funcionar.
 */
function aoFalharSom(retorno) {
  avisar = typeof retorno === 'function' ? retorno : () => {}
}

const AVISO_SUSPENSO = 'O som foi interrompido pelo aparelho. Toque aqui para reativar.'

function destravar() {
  if (!contexto) {
    const Contexto = window.AudioContext || window.webkitAudioContext
    if (!Contexto) {
      avisar('Este navegador não toca som.')
      return
    }
    contexto = new Contexto()
    /*
      A unica notificacao CONFIAVEL de que o contexto voltou.

      Ver o comentario de acordar(): a promessa do resume() nao serve para
      saber quando ele volta, porque ela pode nunca resolver. O statechange
      dispara de verdade quando o navegador libera o audio — inclusive quando
      a liberacao vem de um gesto em outro lugar da tela, que a promessa
      daquela chamada especifica jamais veria.
    */
    contexto.onstatechange = () => {
      avisar(contexto.state === 'running' ? null : AVISO_SUSPENSO)
    }
  }
  acordar()
}

/*
  Tenta acordar o contexto e RESPONDE NA HORA se ele nao estiver rodando.

  A primeira versao disto fazia `contexto.resume().then(conferir, avisar)`, o
  que parecia certo e nao era: no Chrome, resume() num contexto sem ativacao do
  usuario devolve uma promessa que fica PENDENTE — nao resolve nem rejeita, e
  espera indefinidamente por um gesto. Nenhum dos dois ramos rodava, nenhum
  aviso aparecia, e a tela ficava exatamente tao calada quanto antes da
  correcao. A verificacao em `ferramentas/telas.mjs` pegou isso.

  Por isso o estado e lido de forma sincrona e o aviso sai imediatamente. O
  resume continua sendo tentado, e quem desfaz o aviso e o onstatechange.

  Devolve se o som pode sair agora.
*/
function acordar() {
  if (!contexto) return false
  if (contexto.state === 'running') {
    avisar(null)
    return true
  }
  avisar(AVISO_SUSPENSO)
  try {
    contexto.resume().catch(() => {})
  } catch {
    /* alguns navegadores lancam em vez de rejeitar */
  }
  return false
}

function estaMudo() {
  return mudo
}

function alternarMudo() {
  mudo = !mudo
  guardarMudo(mudo)
  /*
    Silenciar tem que apagar o aviso de som interrompido.

    Sem isto a tela ficava dizendo "toque aqui para reativar" depois de a
    professora ter desligado o som de proposito — o app insistindo em consertar
    algo que ela acabou de escolher. E ao religar o aviso volta se o problema
    ainda existir, em vez de ela achar que voltou e nao voltar.
  */
  if (mudo) avisar(null)
  else acordar()
  return mudo
}

function nota(frequencia, atraso, duracao, volume) {
  const comeco = contexto.currentTime + atraso
  const osc = contexto.createOscillator()
  const ganho = contexto.createGain()
  osc.type = 'triangle'
  osc.frequency.setValueAtTime(frequencia, comeco)
  ganho.gain.setValueAtTime(0.0001, comeco)
  ganho.gain.exponentialRampToValueAtTime(volume, comeco + 0.025)
  ganho.gain.exponentialRampToValueAtTime(0.0001, comeco + duracao)
  osc.connect(ganho).connect(contexto.destination)
  osc.start(comeco)
  osc.stop(comeco + duracao + 0.05)
}

/*
  Toca, ou diz por que nao tocou.

  Nao ha caminho em que esta funcao termine sem som E sem aviso — era isso que
  acontecia antes, quando a guarda era `if (mudo || !contexto) return`: depois
  do primeiro gesto o objeto existe para sempre, entao a guarda passava, as
  notas eram agendadas num contexto parado, e a sala ficava muda sem sinal.

  Quando o contexto nao esta rodando as notas NAO sao agendadas para depois:
  `nota()` marca o comeco a partir de `currentTime`, que num contexto parado
  nao anda, e um toque que sai tres minutos atrasado chama a professora para
  uma crianca que ja saiu. Melhor o aviso na tela.
*/
function tocar(notas) {
  if (mudo) return
  if (!contexto) {
    avisar('O som ainda não foi ligado nesta tela. Toque aqui para ligar.')
    return
  }
  if (!acordar()) return
  for (const n of notas) nota(...n)
}

/*
  Os dois toques, e por que sao estes.

  Faixa util numa sala com criancas falando: 600 Hz a 2 kHz. Abaixo disso o som
  se perde no ruido de fundo de vinte vozes; acima fica estridente e cansa quem
  ouve dezenas de vezes por tarde. A versao anterior punha a entrega em 392 Hz e
  0,16 s — grave demais para atravessar a sala, e tao curta que se confundia com
  um estalo do proprio tablet.

  Fundamental + quinta justa, sempre. E o intervalo que soa resolvido sem soar
  melodia: nao vira musiquinha que a turma imita, e nao vira alarme. E, por ser
  consonante, duas chamadas quase simultaneas nao produzem batimento aspero.

    abertura  E5 659,25 + B5 987,77   sobe: alguem chegou
    entrega   B5 987,77 + E5 659,25   desce: fechou

  As duas usam as MESMAS duas notas, em ordem trocada. A sala aprende um par de
  sons, nao quatro, e a direcao carrega o significado.

  Duracao total entre 250 ms e 1 s: menos que isso nao registra com barulho de
  fundo, mais que isso ainda esta tocando quando a professora ja olhou.
*/
const ABERTURA = [
  [659.25, 0, 0.32],
  [987.77, 0.14, 0.42],
]

const ENTREGA = [
  [987.77, 0, 0.2],
  [659.25, 0.1, 0.3],
]

/** Duas notas subindo. Alguem chegou no portao. */
function tocarAbertura() {
  tocar(ABERTURA.map(([f, a, d]) => [f, a, d, volumeDe(0.16)]))
}

/** As mesmas duas notas, descendo. O ciclo fechou. */
function tocarEntrega() {
  tocar(ENTREGA.map(([f, a, d]) => [f, a, d, volumeDe(0.12)]))
}

/* ===== web/demo/index.html ===== */



    const TURMA = '4º ano'
    const ALUNOS = [
      { id: 'd1', nome: 'Maria Cecília Rocha', turma: TURMA },
      { id: 'd2', nome: 'Anthony Peçanha', turma: TURMA },
      { id: 'd3', nome: 'Isabela Furtado', turma: TURMA },
      { id: 'd4', nome: 'Lorenzo Sampaio', turma: TURMA },
      { id: 'd5', nome: "Maria Sant'Ana", turma: TURMA },
      { id: 'd6', nome: 'Ravi Bacelar', turma: TURMA },
    ]

    const chamadas = new Map()
    const cartoes = new Map()
    let relogio = 0

    function aplicar(alunoId, acao, papel) {
      const aluno = ALUNOS.find((a) => a.id === alunoId)
      const anterior = chamadas.get(alunoId)
      exigirDono(acao, papel)
      const de = anterior?.estado ?? 'aguardando'
      const para = proximo(de, acao)
      relogio++
      if (para === 'aguardando' || para === 'entregue') chamadas.delete(alunoId)
      else
        chamadas.set(alunoId, {
          ...aluno,
          alunoId,
          estado: para,
          desde: anterior?.desde ?? relogio,
          em: relogio,
        })
      desenhar()
    }

    function botao(texto, principal, aoTocar) {
      const b = document.createElement('button')
      b.textContent = texto
      if (principal) b.className = 'principal'
      b.onclick = () => {
        destravar()
        aoTocar()
      }
      return b
    }

    function desenhar() {
      const ativas = [...chamadas.values()].sort((a, b) => a.desde - b.desde)

      const ul = document.getElementById('ativas')
      ul.innerHTML = ''
      document.getElementById('nenhuma').hidden = ativas.length > 0
      for (const c of ativas) {
        const li = criarLinha({ nome: c.nome, turma: c.turma, estado: c.estado })
        if (c.estado === 'chamado') {
          li.append(botao('Cancelar', false, () => aplicar(c.alunoId, 'cancelar', 'portaria')))
        }
        if (c.estado === 'liberado') {
          li.append(botao('Entregar', true, () => aplicar(c.alunoId, 'entregar', 'portaria')))
        }
        ul.append(li)
      }

      desenharCadastro()

      const grade = document.getElementById('grade')
      const presentes = new Set(ativas.map((c) => c.alunoId))
      for (const [id, cartao] of cartoes) {
        if (!presentes.has(id)) {
          cartao.remove()
          cartoes.delete(id)
        }
      }

      for (const c of ativas) {
        let cartao = cartoes.get(c.alunoId)
        if (!cartao) {
          cartao = criarCartao({ nome: c.nome, turma: c.turma })
          const liberar = botao('Liberar saída', true, () =>
            aplicar(c.alunoId, 'liberar', 'sala'),
          )
          cartao.acrescentar(liberar)
          cartao.__botao = liberar
          cartao.__estado = null
          cartoes.set(c.alunoId, cartao)
          grade.append(cartao)
          tocarAbertura()
        }
        if (c.estado !== cartao.__estado) {
          cartao.definirEstado(c.estado)
          if (c.estado === 'liberado') tocarEntrega()
          cartao.__estado = c.estado
        }
        cartao.__botao.disabled = c.estado === 'liberado'
        cartao.__botao.textContent =
          c.estado === 'liberado' ? 'Aguardando no portão' : 'Liberar saída'
      }

      document.getElementById('vazio').hidden = ativas.length > 0
    }

    function desenharCadastro() {
      const cadastro = document.getElementById('cadastro')
      cadastro.innerHTML = ''
      for (const aluno of ALUNOS) {
        const li = criarLinha({ nome: aluno.nome, turma: aluno.turma })
        if (chamadas.has(aluno.id)) li.append(etiquetaDe('em saída'))
        else li.append(botao('Chamar', true, () => aplicar(aluno.id, 'chamar', 'portaria')))
        cadastro.append(li)
      }
    }

    desenhar()
  
</script>
