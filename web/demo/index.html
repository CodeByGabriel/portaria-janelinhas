<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo — Janelinhas do Saber</title>
  <link rel="stylesheet" href="../comum/tokens.css">
  <style>
    .colunas { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100vh - 58px); }
    .coluna { padding: 1.15rem; }
    .coluna + .coluna { border-left: 1px solid var(--borda); background: #fafbfa; }
    .rotulo {
      font-size: var(--t-etiqueta); font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--tinta-fraca); margin: 0 0 0.15rem;
    }
    .explica { font-size: var(--t-detalhe); color: var(--tinta-media); margin: 0 0 1rem; }
    ul { list-style: none; padding: 0; margin: 0; }
    .grade { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .cartao button { width: 100%; }
    .selo {
      position: fixed; bottom: 0.9rem; right: 1rem; font-size: var(--t-etiqueta);
      color: var(--tinta-fraca); background: var(--superficie);
      border: 1px solid var(--borda); border-radius: 999px; padding: 0.2rem 0.7rem;
    }
  </style>
</head>
<body>

  <header class="cabecalho">
    <span class="marca-glifo" aria-hidden="true"></span>
    <div>
      <p class="titulo">Janelinhas do Saber</p>
      <p class="subtitulo">Demonstração — portaria e sala lado a lado</p>
    </div>
  </header>

  <div class="colunas">
    <section class="coluna">
      <p class="rotulo">Portaria</p>
      <p class="explica">O responsável chegou no portão.</p>
      <ul id="cadastro"></ul>

      <p class="secao">Em saída</p>
      <ul id="ativas"></ul>
      <p class="vazio" id="nenhuma">Ninguém em saída agora.</p>
    </section>

    <section class="coluna">
      <p class="rotulo">Sala — 4º ano</p>
      <p class="explica">A professora confirma a saída.</p>
      <p class="vazio" id="vazio">Nenhuma chamada agora.</p>
      <div class="grade" id="grade"></div>
    </section>
  </div>

  <p class="selo">modo demonstração · sem rede</p>

  <script type="module">
    import { proximo, exigirDono } from '../comum/estados.js'
    import { criarCartao, criarLinha, etiquetaDe } from '../comum/cartao.js'
    import { destravar, tocarAbertura, tocarEntrega } from '../comum/som.js'

    const TURMA = '4º ano'
    const ALUNOS = [
      { id: 'd1', nome: 'Maria Cecília Rocha', turma: TURMA },
      { id: 'd2', nome: 'Anthony Peçanha', turma: TURMA },
      { id: 'd3', nome: 'Isabela Furtado', turma: TURMA },
      { id: 'd4', nome: 'Lorenzo Sampaio', turma: TURMA },
      { id: 'd5', nome: "Maria Sant'Ana", turma: TURMA },
      { id: 'd6', nome: 'Ravi Bacelar', turma: TURMA },
    ]

    const chamadas = new Map()
    const cartoes = new Map()
    let relogio = 0

    function aplicar(alunoId, acao, papel) {
      const aluno = ALUNOS.find((a) => a.id === alunoId)
      const anterior = chamadas.get(alunoId)
      exigirDono(acao, papel)
      const de = anterior?.estado ?? 'aguardando'
      const para = proximo(de, acao)
      relogio++
      if (para === 'aguardando' || para === 'entregue') chamadas.delete(alunoId)
      else
        chamadas.set(alunoId, {
          ...aluno,
          alunoId,
          estado: para,
          desde: anterior?.desde ?? relogio,
          em: relogio,
        })
      desenhar()
    }

    function botao(texto, principal, aoTocar) {
      const b = document.createElement('button')
      b.textContent = texto
      if (principal) b.className = 'principal'
      b.onclick = () => {
        destravar()
        aoTocar()
      }
      return b
    }

    function desenhar() {
      const ativas = [...chamadas.values()].sort((a, b) => a.desde - b.desde)

      const ul = document.getElementById('ativas')
      ul.innerHTML = ''
      document.getElementById('nenhuma').hidden = ativas.length > 0
      for (const c of ativas) {
        const li = criarLinha({ nome: c.nome, turma: c.turma, estado: c.estado })
        if (c.estado === 'chamado') {
          li.append(botao('Cancelar', false, () => aplicar(c.alunoId, 'cancelar', 'portaria')))
        }
        if (c.estado === 'liberado') {
          li.append(botao('Entregar', true, () => aplicar(c.alunoId, 'entregar', 'portaria')))
        }
        ul.append(li)
      }

      desenharCadastro()

      const grade = document.getElementById('grade')
      const presentes = new Set(ativas.map((c) => c.alunoId))
      for (const [id, cartao] of cartoes) {
        if (!presentes.has(id)) {
          cartao.remove()
          cartoes.delete(id)
        }
      }

      for (const c of ativas) {
        let cartao = cartoes.get(c.alunoId)
        if (!cartao) {
          cartao = criarCartao({ nome: c.nome, turma: c.turma })
          const liberar = botao('Liberar saída', true, () =>
            aplicar(c.alunoId, 'liberar', 'sala'),
          )
          cartao.acrescentar(liberar)
          cartao.__botao = liberar
          cartao.__estado = null
          cartoes.set(c.alunoId, cartao)
          grade.append(cartao)
          tocarAbertura()
        }
        if (c.estado !== cartao.__estado) {
          cartao.definirEstado(c.estado)
          if (c.estado === 'liberado') tocarEntrega()
          cartao.__estado = c.estado
        }
        cartao.__botao.disabled = c.estado === 'liberado'
        cartao.__botao.textContent =
          c.estado === 'liberado' ? 'Aguardando no portão' : 'Liberar saída'
      }

      document.getElementById('vazio').hidden = ativas.length > 0
    }

    function desenharCadastro() {
      const cadastro = document.getElementById('cadastro')
      cadastro.innerHTML = ''
      for (const aluno of ALUNOS) {
        const li = criarLinha({ nome: aluno.nome, turma: aluno.turma })
        if (chamadas.has(aluno.id)) li.append(etiquetaDe('em saída'))
        else li.append(botao('Chamar', true, () => aplicar(aluno.id, 'chamar', 'portaria')))
        cadastro.append(li)
      }
    }

    desenhar()
  </script>
</body>
</html>
