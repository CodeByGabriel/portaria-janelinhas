<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oficina — Janelinhas do Saber</title>
  <link rel="stylesheet" href="./tokens.css">
  <style>
    main { padding: 1.5rem; max-width: 1000px; margin: 0 auto; }
    p.dica { color: var(--tinta-media); max-width: 62ch; margin: 0 0 1.6rem; font-size: var(--t-corpo); }
    .controles { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 1.6rem 0; }
    ul { list-style: none; padding: 0; margin: 0; }
  </style>
</head>
<body>

  <header class="cabecalho">
    <span class="marca-glifo" aria-hidden="true"></span>
    <div>
      <p class="titulo">Janelinhas do Saber</p>
      <p class="subtitulo">Oficina de componentes</p>
    </div>
  </header>

  <main>
    <p class="dica">
      Os dois formatos em que um aluno aparece, nos quatro estados. Cartão para a
      sala, linha para a portaria. Nenhum servidor envolvido.
    </p>

    <p class="secao">Cartão — tela da sala</p>
    <div class="grade" id="grade"></div>

    <div class="controles">
      <button data-estado="aguardando">Aguardando</button>
      <button data-estado="chamado" class="principal">Chamado</button>
      <button data-estado="liberado">Liberado</button>
    </div>

    <p class="secao">Linha — tela da portaria</p>
    <ul id="linhas"></ul>

    <p class="secao">Etiquetas</p>
    <div class="controles" id="etiquetas"></div>
  </main>

  <script type="module">
    import { criarCartao, criarLinha, etiquetaDe } from './cartao.js'
    import { destravar, tocarAbertura, tocarEntrega } from './som.js'

    const ELENCO = [
      ['Maria Cecília Rocha', 'Pré 1'],
      ['Anthony Peçanha', '2º ano'],
      ["Maria Sant'Ana", '6º ano'],
      ['Gustavo Bandeira', '9º ano'],
      ['Ana-Clara Vasconcelos', '7º ano'],
    ]

    const grade = document.getElementById('grade')
    const cartoes = ELENCO.map(([nome, turma]) => {
      const c = criarCartao({ nome, turma })
      grade.append(c)
      return c
    })

    const linhas = document.getElementById('linhas')
    for (const [i, [nome, turma]] of ELENCO.entries()) {
      const estado = ['aguardando', 'chamado', 'liberado', 'chamado', 'liberado'][i]
      linhas.append(criarLinha({ nome, turma, estado }))
    }

    const etiquetas = document.getElementById('etiquetas')
    for (const [texto, estado] of [
      ['responsável chegou', 'chamado'],
      ['liberado', 'liberado'],
      ['já em saída', null],
    ]) {
      etiquetas.append(etiquetaDe(texto, estado))
    }

    for (const botao of document.querySelectorAll('.controles button[data-estado]')) {
      botao.onclick = () => {
        destravar()
        const estado = botao.dataset.estado
        cartoes.forEach((c) => c.definirEstado(estado))
        if (estado === 'chamado') tocarAbertura()
        if (estado === 'liberado') tocarEntrega()
      }
    }
  </script>
</body>
</html>
