<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oficina — Janelinhas do Saber</title>
  <link rel="stylesheet" href="./tokens.css">
  <style>
    main { padding: var(--e-6); max-width: 1280px; margin: 0 auto; }
    p.dica { color: var(--tinta-2); max-width: 62ch; margin: 0 0 var(--e-6); font-size: var(--t-corpo); }
    .controles { display: flex; gap: var(--e-2); flex-wrap: wrap; margin: var(--e-6) 0; }
    .lado-a-lado { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: var(--e-8); align-items: start; }
    @media (max-width: 1000px) { .lado-a-lado { grid-template-columns: 1fr; } }
    /* A prova em P&B: a mesma tela, sem cor nenhuma. */
    .pb { filter: grayscale(1); }
  </style>
</head>
<body class="painel">

  <header class="cabecalho">
    <span class="marca-glifo" aria-hidden="true"></span>
    <div>
      <p class="titulo">Janelinhas do Saber</p>
      <p class="subtitulo">Oficina de componentes</p>
    </div>
  </header>

  <main>
    <p class="dica">
      Os dois formatos em que um aluno aparece, nos cinco estados. Cartão para a
      sala (variante painel), linha para a portaria. Nenhum servidor envolvido.
    </p>

    <div class="controles">
      <button data-estado="aguardando">Aguardando</button>
      <button data-estado="chamado" class="principal">Chamado</button>
      <button data-estado="liberado">Liberado</button>
      <button data-estado="retorno">Retorno</button>
      <button data-estado="entregue">Entregue</button>
      <button id="pb" aria-pressed="false">Preto e branco</button>
    </div>

    <div class="lado-a-lado" id="palco">
      <div>
        <p class="secao">Cartão — tela da sala</p>
        <div class="grade" id="grade"></div>
      </div>
      <div>
        <p class="secao">Linha — tela da portaria</p>
        <ul id="linhas"></ul>
        <p class="secao">Etiquetas</p>
        <div class="controles" id="etiquetas"></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { criarCartao, criarLinha, etiquetaDe } from './cartao.js'
    import { destravar, tocarAbertura, tocarEntrega } from './som.js'

    const ESTADOS = ['aguardando', 'chamado', 'liberado', 'retorno', 'entregue']
    const ELENCO = [
      ['Maria Eduarda Nogueira', 'Pré 1'],
      ["Luíza Sant'Anna", 'Pré 2'],
      ['João Pedro Gonçalves de Albuquerque', '3º ano'],
      ['Ana-Clara Vasconcelos', '3º ano'],
      ['Rafael Oliveira dos Santos', '9º ano'],
    ]
    const ACAO = {
      aguardando: ['—', true],
      chamado: ['Liberar saída', false],
      liberado: ['Aguardando no portão', true],
      retorno: ['Aguardando a portaria chamar de novo', true],
      entregue: ['Some da tela; fica na trilha', true],
    }

    const grade = document.getElementById('grade')
    const cartoes = ELENCO.map(([nome, turma], i) => {
      const c = criarCartao({ nome, turma })
      const botao = document.createElement('button')
      botao.className = 'principal'
      c.acrescentar(botao)
      c.__botao = botao
      c.mostrar = (estado) => {
        c.definirEstado(estado)
        const [texto, desabilitado] = ACAO[estado]
        botao.textContent = texto
        botao.disabled = desabilitado
      }
      c.mostrar(ESTADOS[i])
      grade.append(c)
      return c
    })

    const linhas = document.getElementById('linhas')
    for (const [i, [nome, turma]] of ELENCO.entries()) {
      linhas.append(criarLinha({ nome, turma, estado: ESTADOS[i] }))
    }

    const etiquetas = document.getElementById('etiquetas')
    for (const [texto, estado] of [
      ['responsável chegou', 'chamado'],
      ['liberado', 'liberado'],
      ['retornou à sala', 'retorno'],
      ['entregue', 'entregue'],
      ['já em saída', null],
    ]) {
      etiquetas.append(etiquetaDe(texto, estado))
    }

    for (const botao of document.querySelectorAll('.controles button[data-estado]')) {
      botao.onclick = () => {
        destravar()
        const estado = botao.dataset.estado
        cartoes.forEach((c) => c.mostrar(estado))
        if (estado === 'chamado') tocarAbertura()
        if (estado === 'liberado') tocarEntrega()
      }
    }

    const pb = document.getElementById('pb')
    const palco = document.getElementById('palco')
    pb.onclick = () => {
      const ligado = palco.classList.toggle('pb')
      pb.setAttribute('aria-pressed', String(ligado))
    }
  </script>
</body>
</html>
